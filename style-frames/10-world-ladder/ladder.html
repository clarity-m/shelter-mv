<!doctype html>
<html><head><meta charset="utf-8"><title>Shelter MV 10: world ladder</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<pre id="log" style="display:none"></pre><pre id="png" style="display:none"></pre>
<script>
'use strict';
// ============================================================================
// Shelter MV, style frame 10: one shot, five rungs of world fidelity.
// One scene (camera, hill, tree, a seated figure, Clawd, clouds, the dome grid)
// is described once in 3D. Every rung ray-casts the same geometry through the
// same lens, and only the "lens" changes: pixel, vector, low-poly, paint, light.
//   ladder.html?rung=1..5   (&paint=0 skips rung 4's strokes; &sx=&sy= move the sun)
//   Render: python3 render.py rungN.png "rung=N"   (headless Chrome, ANGLE/Vulkan)
// ============================================================================
const T0 = performance.now();
const Q = new URLSearchParams(location.search);
const RUNG = +(Q.get('rung') || 3);
const W = 1920, H = 1080;
const LOG = [];
const log = s => { LOG.push(s); document.getElementById('log').textContent = LOG.join('\n'); };

// ---------------------------------------------------------------- utilities
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
const fx = x => { const s = (+x).toFixed(5); return s.indexOf('.') < 0 ? s + '.0' : s; };
const g3 = a => `vec3(${fx(a[0])},${fx(a[1])},${fx(a[2])})`;

// ================================================================ THE SCENE
// Units are metres. x right, y up, z away from the camera. The camera looks
// straight down +z with a shifted lens: the horizon sits at y = 780 px, so
// verticals stay vertical (anime background convention).
const F = 1400, CY = 780, CAMH = 0.7;
const CAM = [0, CAMH, 0];
const project = p => [960 + F * p[0] / p[2], CY - F * (p[1] - CAMH) / p[2]];
const rayDir = (px, py) => v3.norm([(px - 960) / F, (CY - py) / F, 1]);

// The hill: a broad mound with a crest on the right and a shoulder on the left.
const HILL = [ // amplitude, cx, cz, sx, sz
  [1.618, 1.621, 12.597, 1.657, 4.959],
  [0.935, -5.269, 10.239, 4.032, 1.825],
  [1.138, 0.370, 7.926, 6.181, 3.047],
];
const HILL_EPS = 0.00002;                  // soft floor (h never quite reaches 0)
function hillH(x, z) {
  let h = 0;
  for (const [a, cx, cz, sx, sz] of HILL) { const dx = (x - cx) / sx, dz = (z - cz) / sz; h += a * Math.exp(-(dx * dx + dz * dz)); }
  return 0.5 * (h + Math.sqrt(h * h + HILL_EPS));
}

// Sun: low, just behind the crest to Clawd's right.
const SUN_PX = [Q.has('sx') ? +Q.get('sx') : 1500, Q.has('sy') ? +Q.get('sy') : 664];
const SUN = rayDir(SUN_PX[0], SUN_PX[1]);

// Clawd on the crest. Glyph cell u wide, 2u tall; screen width ~144 px at rungs 1-2.
const CLAWD = { x: 1.51, z: 9.6 };
CLAWD.y = hillH(CLAWD.x, CLAWD.z);
CLAWD.u = 144 * CLAWD.z / F / 18;        // metres per glyph column
CLAWD.yaw = 0.42;                        // turned a little toward the figure (radians)
CLAWD.depth = 4 * CLAWD.u;

// The figure: seated, hugging her knees, watching Clawd.
const HUMAN = { x: -1.37, z: 5.2 };
HUMAN.y = hillH(HUMAN.x, HUMAN.z);
HUMAN.look = Math.atan2(CLAWD.x - HUMAN.x, CLAWD.z - HUMAN.z);
HUMAN.yaw = HUMAN.look + 0.30;          // body turned a little more side-on; the head turns back to him

// The tree on the left shoulder.
const TREE = { x: -4.1, z: 9.2 };
TREE.y = hillH(TREE.x, TREE.z);

// Environment boundary: a dome with a latitude/longitude grid.
const DOME = { c: [0, 0, 10], R: 220 };

// ---------------------------------------------------------------- primitives
// Human, local frame: f forward, u up, s toward her right hand. Seat origin on the ground.
const MAT = { SKY: 0, FLOOR: 1, HILL: 2, TRUNK: 3, LEAF: 4, SKIN: 5, HAIR: 6, SWEATER: 7, PANTS: 8, SHOE: 9, CLAWD: 10, CLOUD: 11 };
const HUMAN_PRIMS = (() => {
  const P = [];
  const add = (o) => P.push(o);
  // pelvis and torso (two offset round cones give the sweater an oval section)
  add({ t: 'ell', c: [-0.03, 0.13, 0], rad: [0.13, 0.11, 0.165], mat: MAT.PANTS, part: 1, k: 0.02 });
  for (const s of [-1, 1]) add({ t: 'rc', a: [-0.03, 0.18, 0.06 * s], b: [0.07, 0.49, 0.075 * s], r: 0.118, r2: 0.112, mat: MAT.SWEATER, part: 2, k: 0.06 });
  for (const s of [-1, 1]) add({ t: 'sph', c: [0.07, 0.505, 0.15 * s], r: 0.075, mat: MAT.SWEATER, part: 2, k: 0.07 });
  add({ t: 'cap', a: [0.08, 0.54, 0], b: [0.105, 0.655, 0], r: 0.046, mat: MAT.SKIN, part: 3, k: 0.03 });
  // head and bob
  const turn = (c) => { const a = -0.30, f = c[0] - 0.1, z = c[2]; return [0.1 + f * Math.cos(a) - z * Math.sin(a), c[1], f * Math.sin(a) + z * Math.cos(a)]; };
  add({ t: 'ell', c: turn([0.125, 0.755, 0]), rad: [0.098, 0.116, 0.086], mat: MAT.SKIN, part: 3, k: 0.02 });
  add({ t: 'ell', c: turn([0.102, 0.772, 0]), rad: [0.106, 0.124, 0.1], mat: MAT.HAIR, part: 4, k: 0.01 });
  add({ t: 'ell', c: turn([0.08, 0.69, 0]), rad: [0.088, 0.06, 0.106], mat: MAT.HAIR, part: 4, k: 0.04 });
  // legs: thighs up to the knees, shins down to the feet
  for (const s of [-1, 1]) {
    const hip = [0.0, 0.12, 0.085 * s], knee = [0.35, 0.44, 0.08 * s], ankle = [0.41, 0.075, 0.075 * s];
    add({ t: 'rc', a: hip, b: knee, r: 0.078, r2: 0.058, mat: MAT.PANTS, part: 5 + (s > 0 ? 1 : 0), k: 0.03 });
    add({ t: 'rc', a: knee, b: ankle, r: 0.056, r2: 0.04, mat: MAT.PANTS, part: 5 + (s > 0 ? 1 : 0), k: 0.02 });
    add({ t: 'rc', a: [0.39, 0.05, 0.075 * s], b: [0.53, 0.035, 0.085 * s], r: 0.045, r2: 0.036, mat: MAT.SHOE, part: 7, k: 0.02 });
  }
  // arms hugging the shins, hands clasped in front
  for (const s of [-1, 1]) {
    const sh = [0.07, 0.5, 0.165 * s], el = [0.25, 0.33, 0.205 * s], wr = [0.45, 0.37, 0.045 * s];
    add({ t: 'rc', a: sh, b: el, r: 0.058, r2: 0.05, mat: MAT.SWEATER, part: 8 + (s > 0 ? 1 : 0), k: 0.03 });
    add({ t: 'rc', a: el, b: wr, r: 0.049, r2: 0.037, mat: MAT.SWEATER, part: 8 + (s > 0 ? 1 : 0), k: 0.02 });
    add({ t: 'ell', c: [0.475, 0.37, 0.018 * s], rad: [0.05, 0.036, 0.04], mat: MAT.SKIN, part: 10, k: 0.02 });
  }
  return P;
})();

const TREE_PRIMS = (() => {
  const P = [];
  const add = (o) => P.push(o);
  // trunk leaning a little toward the figure, forking into three limbs
  add({ t: 'rc', a: [0, -0.3, 0], b: [0.12, 1.0, 0.0], r: 0.16, r2: 0.105, mat: MAT.TRUNK, part: 11, k: 0.05 });
  add({ t: 'rc', a: [0.12, 1.0, 0.0], b: [-0.42, 1.85, 0.05], r: 0.085, r2: 0.05, mat: MAT.TRUNK, part: 11, k: 0.06 });
  add({ t: 'rc', a: [0.12, 1.0, 0.0], b: [0.78, 1.78, -0.05], r: 0.08, r2: 0.045, mat: MAT.TRUNK, part: 11, k: 0.06 });
  add({ t: 'rc', a: [0.12, 1.0, 0.0], b: [0.2, 2.15, 0.0], r: 0.08, r2: 0.05, mat: MAT.TRUNK, part: 11, k: 0.06 });
  const canopy = [
    // left clump
    [-0.6, 2.2, 0.1, 0.6], [-1.05, 2.0, 0.0, 0.4], [-0.35, 2.52, 0.0, 0.48],
    // top clump
    [0.2, 2.76, 0.0, 0.6], [-0.15, 2.95, 0.1, 0.44], [0.56, 2.9, -0.05, 0.44],
    // right clump, reaching toward the figure
    [0.98, 2.1, -0.05, 0.54], [1.4, 1.96, 0.0, 0.37], [0.72, 2.36, 0.0, 0.44],
    // back fill, and a low front clump that hides where the limbs enter
    [0.2, 2.3, 0.45, 0.58], [0.12, 2.08, -0.3, 0.42],
  ];
  for (const [x, y, z, r] of canopy) add({ t: 'sph', c: [x, y, z], r, mat: MAT.LEAF, part: 12, k: 0.2 });
  return P;
})();

// Clouds: world-space ellipsoids far out under the dome.
function cloudAt(az, el, dist) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  return [dist * Math.sin(a) * Math.cos(e), CAMH + dist * Math.sin(e), dist * Math.cos(a) * Math.cos(e)];
}
const CLOUDS = (() => {
  const C = [];
  const blob = (az, el, dist, parts) => {
    const c0 = cloudAt(az, el, dist);
    for (const [dx, dy, dz, rx, ry, rz] of parts) C.push({ c: [c0[0] + dx, c0[1] + dy, c0[2] + dz], rad: [rx, ry, rz] });
  };
  // A: a soft cumulus upper left, behind the canopy's right edge
  blob(-12, 23, 150, [[0, 0, 0, 12, 6, 8], [-11, -1.5, 2, 8, 4.5, 6], [10, -2, -1, 9, 4.2, 6], [-3, 4.5, 1, 7.5, 5, 6], [5, 3.5, 0, 6, 4.5, 5], [19, -3.2, 0, 6, 2.6, 4.5]]);
  // B: a long thin band to the right, above the glow, lit from below
  blob(26, 15.5, 175, [[0, 0, 0, 26, 2.4, 10], [27, -1.0, 4, 18, 2.0, 8], [-24, 1.0, -3, 14, 1.8, 7], [47, -1.8, 8, 13, 1.6, 6]]);
  // C: a small cloud high on the right
  blob(22, 29, 160, [[0, 0, 0, 7, 3.6, 5], [6, -0.8, 1, 5, 2.8, 4], [-5.5, -1.0, 0, 4.5, 2.6, 4]]);
  return C;
})();

// ---------------------------------------------------------------- GLSL codegen
function sdfCode(prims, name) {
  let s = `float ${name}(vec3 p, out int mat, out int part) {\n  float d = 1e9, di; mat = 0; part = 0;\n`;
  for (const q of prims) {
    let e;
    if (q.t === 'sph') e = `length(p - ${g3(q.c)}) - ${fx(q.r)}`;
    else if (q.t === 'ell') e = `sdEll(p - ${g3(q.c)}, ${g3(q.rad)})`;
    else if (q.t === 'cap') e = `sdCap(p, ${g3(q.a)}, ${g3(q.b)}, ${fx(q.r)})`;
    else if (q.t === 'rc') e = `sdRC(p, ${g3(q.a)}, ${g3(q.b)}, ${fx(q.r)}, ${fx(q.r2)})`;
    s += `  di = ${e};\n  if (di < d) { mat = ${q.mat}; part = ${q.part}; }\n  d = smin(d, di, ${fx(q.k || 0.001)});\n`;
  }
  return s + '  return d;\n}\n';
}
function sdfCodeD(prims, name) {   // distance only (shadows, AO)
  let s = `float ${name}(vec3 p) {\n  float d = 1e9;\n`;
  for (const q of prims) {
    let e;
    if (q.t === 'sph') e = `length(p - ${g3(q.c)}) - ${fx(q.r)}`;
    else if (q.t === 'ell') e = `sdEll(p - ${g3(q.c)}, ${g3(q.rad)})`;
    else if (q.t === 'cap') e = `sdCap(p, ${g3(q.a)}, ${g3(q.b)}, ${fx(q.r)})`;
    else if (q.t === 'rc') e = `sdRC(p, ${g3(q.a)}, ${g3(q.b)}, ${fx(q.r)}, ${fx(q.r2)})`;
    s += `  d = smin(d, ${e}, ${fx(q.k || 0.001)});\n`;
  }
  return s + '  return d;\n}\n';
}
function boundOf(prims) {
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  const grow = (c, r) => { for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], c[i] - r); hi[i] = Math.max(hi[i], c[i] + r); } };
  for (const q of prims) {
    if (q.t === 'sph') grow(q.c, q.r);
    else if (q.t === 'ell') grow(q.c, Math.max(...q.rad));
    else { grow(q.a, Math.max(q.r, q.r2 || 0)); grow(q.b, Math.max(q.r, q.r2 || 0)); }
  }
  const c = v3.mul(v3.add(lo, hi), 0.5);
  return { c, r: v3.len(v3.sub(hi, lo)) * 0.5 + 0.05 };
}
const HB = boundOf(HUMAN_PRIMS), TB = boundOf(TREE_PRIMS);

function hillCode() {
  return HILL.map(([a, cx, cz, sx, sz]) =>
    `  { vec2 d = (q - vec2(${fx(cx)},${fx(cz)})) * vec2(${fx(1 / sx)},${fx(1 / sz)}); h += ${fx(a)} * exp(-dot(d, d)); }`).join('\n');
}


// ---------------------------------------------------------------- low-poly polytopes (rung 3)
// Every primitive also exists as a convex polytope (a list of planes n.x <= h):
// spheres and ellipsoids become jittered icosahedra, limbs become hexagonal
// frusta with bevelled ends. Rung 3 ray-casts these instead of the smooth SDFs.
const PHI = (1 + Math.sqrt(5)) / 2;
const ICO_FACES = (() => {
  const out = [];
  for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-1, 1]) out.push([a, b, c]);
  for (const a of [-1, 1]) for (const b of [-1, 1]) { out.push([0, a / PHI, b * PHI]); out.push([a / PHI, b * PHI, 0]); out.push([a * PHI, 0, b / PHI]); }
  return out.map(v3.norm);
})();
function randRot(rnd) {
  const u1 = rnd(), u2 = rnd(), u3 = rnd();
  const x = Math.sqrt(1 - u1) * Math.sin(2 * Math.PI * u2), y = Math.sqrt(1 - u1) * Math.cos(2 * Math.PI * u2);
  const z = Math.sqrt(u1) * Math.sin(2 * Math.PI * u3), w = Math.sqrt(u1) * Math.cos(2 * Math.PI * u3);
  return [[1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)],
          [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)],
          [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]];
}
const mulM = (M, v) => [0, 1, 2].map(i => M[i][0] * v[0] + M[i][1] * v[1] + M[i][2] * v[2]);
function polyOf(q, rnd, opt) {
  const P = [];
  opt = opt || {};
  if (q.t === 'sph' || q.t === 'ell') {
    const rad = q.t === 'sph' ? [q.r, q.r, q.r] : q.rad;
    const R = opt.flatBottom ? [[1, 0, 0], [0, 1, 0], [0, 0, 1]] : randRot(rnd);
    const yaw = rnd() * Math.PI * 2;
    for (const n0 of ICO_FACES) {
      let n = mulM(R, n0);
      if (opt.flatBottom) n = [n[0] * Math.cos(yaw) - n[2] * Math.sin(yaw), n[1], n[0] * Math.sin(yaw) + n[2] * Math.cos(yaw)];
      n = v3.norm(v3.add(n, [(rnd() - 0.5) * 0.14, (rnd() - 0.5) * 0.14, (rnd() - 0.5) * 0.14]));
      const hh = 0.9 * (1 + (rnd() - 0.5) * 0.08);
      const m = [n[0] / rad[0], n[1] / rad[1], n[2] / rad[2]], ml = v3.len(m);
      const nn = v3.mul(m, 1 / ml);
      P.push([...nn, hh / ml + v3.dot(nn, q.c)]);
    }
    if (opt.flatBottom) P.push([0, -1, 0, -(q.c[1] - rad[1] * 0.55)]);
  } else {
    const a = q.a, b = q.b, r1 = q.r, r2 = q.t === 'cap' ? q.r : q.r2;
    const ab = v3.sub(b, a), L = v3.len(ab), w = v3.mul(ab, 1 / L);
    const u = Math.abs(w[1]) < 0.9 ? v3.norm(v3.cross(w, [0, 1, 0])) : v3.norm(v3.cross(w, [1, 0, 0]));
    const v = v3.cross(w, u);
    const n = 6, ph = rnd() * Math.PI;
    for (let k = 0; k < n; k++) {
      const th = ph + k * 2 * Math.PI / n;
      const m = v3.add(v3.mul(u, Math.cos(th)), v3.mul(v, Math.sin(th)));
      const nn = v3.norm(v3.sub(m, v3.mul(w, (r2 - r1) / L)));
      P.push([...nn, v3.dot(nn, v3.add(a, v3.mul(m, r1 * 0.97)))]);
    }
    for (const [end, dir, r] of [[a, -1, r1], [b, 1, r2]]) {
      const wd = v3.mul(w, dir);
      P.push([...wd, v3.dot(wd, end) + r * 0.8]);
      for (let k = 0; k < n; k += 2) {
        const th = ph + (k + 0.5) * 2 * Math.PI / n;
        const m = v3.add(v3.mul(u, Math.cos(th)), v3.mul(v, Math.sin(th)));
        const nn = v3.norm(v3.add(wd, m));
        P.push([...nn, v3.dot(nn, end) + r * 0.98]);
      }
    }
  }
  return P;
}
function primBound(q) {
  if (q.t === 'sph') return { c: q.c, r: q.r * 1.3 };
  if (q.t === 'ell') return { c: q.c, r: Math.max(...q.rad) * 1.3 };
  const r = Math.max(q.r, q.r2 || 0);
  return { c: v3.mul(v3.add(q.a, q.b), 0.5), r: v3.len(v3.sub(q.b, q.a)) * 0.5 + r * 1.4 };
}
const POLY = (() => {
  const rnd = mulberry32(90210);
  const planes = [], meta = [];
  const HF = [Math.sin(HUMAN.yaw), 0, Math.cos(HUMAN.yaw)], HR = [Math.cos(HUMAN.yaw), 0, -Math.sin(HUMAN.yaw)];
  const HP = [HUMAN.x, HUMAN.y, HUMAN.z], TP = [TREE.x, TREE.y, TREE.z];
  const humanToWorld = p => v3.add(HP, v3.add(v3.add(v3.mul(HF, p[0]), [0, p[1], 0]), v3.mul(HR, p[2])));
  const push = (pl, b, mat, part) => {
    meta.push({ start: planes.length, count: pl.length, mat, part, c: b.c, r: b.r });
    for (const p of pl) planes.push(p);
  };
  for (const q of HUMAN_PRIMS) {
    const pl = polyOf(q, rnd).map(([nx, ny, nz, h]) => {
      const nw = v3.add(v3.add(v3.mul(HF, nx), [0, ny, 0]), v3.mul(HR, nz));
      return [...nw, h + v3.dot(nw, HP)];
    });
    const b = primBound(q);
    push(pl, { c: humanToWorld(b.c), r: b.r }, q.mat, q.part);
  }
  for (const q of TREE_PRIMS) {
    const pl = polyOf(q, rnd).map(([nx, ny, nz, h]) => [nx, ny, nz, h + v3.dot([nx, ny, nz], TP)]);
    const b = primBound(q);
    push(pl, { c: v3.add(TP, b.c), r: b.r }, q.mat, q.part);
  }
  const nObj = meta.length;
  CLOUDS.forEach((cl, i) => {
    const q = { t: 'ell', c: cl.c, rad: cl.rad };
    push(polyOf(q, rnd, { flatBottom: true }), { c: cl.c, r: Math.max(...cl.rad) * 1.3 }, MAT.CLOUD, 40 + i);
  });
  return { planes, meta, nObj, n: meta.length };
})();

// ================================================================ WEBGL
const glc = document.createElement('canvas');
glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false });
if (!gl) throw new Error('no webgl2');
const EXT_CBF = gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
if (!EXT_CBF) log('WARNING: no EXT_color_buffer_float');

const VS = `#version 300 es
in vec2 aP; void main() { gl_Position = vec4(aP, 0.0, 1.0); }`;
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

function compile(fsSrc, label, vsSrc) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(s);
      const m = /ERROR: 0:(\d+)/.exec(info);
      const ln = m ? +m[1] : 0;

    if (iPoly(ro, rd, int(m0.x), int(m0.y), tb, t, n)) { tb = t; nb = n; mb = int(m0.z); pb = int(m0.w); hitK = k; }
  }
  return hitK;
}
bool anyPoly(vec3 ro, vec3 rd, int k0, int k1) {
  for (int k = 0; k < 128; k++) {
    if (k < k0) continue; if (k >= k1) break;
    vec4 m0 = texelFetch(uPm, ivec2(2 * k, 0), 0), m1 = texelFetch(uPm, ivec2(2 * k + 1, 0), 0);
    vec3 oc = ro - m1.xyz; float b = dot(oc, rd), c = dot(oc, oc) - m1.w * m1.w; float h = b * b - c;
    if (h < 0.0 || -b + sqrt(h) < 0.0) continue;
    float t; vec3 n;
    if (iPoly(ro, rd, int(m0.x), int(m0.y), 1e4, t, n)) return true;
  }
  return false;
}

// ---------------------------------------------------------------- clouds (smooth)
float iEll(vec3 ro, vec3 rd, vec3 c, vec3 r, out vec3 n) {
  vec3 oc = (ro - c) / r, rr = rd / r;
  float a = dot(rr, rr), b = dot(oc, rr), cc = dot(oc, oc) - 1.0;
  float h = b * b - a * cc; if (h < 0.0) return -1.0;
  float t = (-b - sqrt(h)) / a;
  n = normalize((oc + rr * t) / r);
  return t;
}
${(() => {
  let s = 'float cloudsE(vec3 ro, vec3 rd, out vec3 nOut, out int idOut) {\n  float tb = 1e9; vec3 n; float t; nOut = vec3(0.0, -1.0, 0.0); idOut = 0;\n';
  CLOUDS.forEach((c, i) => { s += `  t = iEll(ro, rd, ${g3(c.c)}, ${g3(c.rad)}, n); if (t > 0.0 && t < tb) { tb = t; nOut = n; idOut = ${i}; }\n`; });
  return s + '  return tb;\n}';
})()}

// ---------------------------------------------------------------- scene cast
struct Hit { float t; int mat; int part; vec3 p; vec3 n; float fid; };
Hit castScene(vec3 ro, vec3 rd) {
  Hit h; h.t = 1e9; h.mat = M_SKY; h.part = 0; h.n = vec3(0.0); h.p = ro + rd * 1e4; h.fid = 0.0;
  float tObj = 1e9; vec3 nObj = vec3(0.0, 1.0, 0.0); int mObj = 0, pObj = 0, kObj = -1;
#if LOWPOLY
  kObj = castPolys(ro, rd, 0, NPOLY_OBJ, tObj, nObj, mObj, pObj);
#endif
  float t = 0.05; bool hit = false; int m = 0, pt = 0;
  for (int i = 0; i < 320; i++) {
    vec3 p = ro + rd * t;
    if ((p.y > 4.6 && rd.y > 0.0) || t > 48.0 || t > tObj) break;
    float d = mapIds(p, m, pt);
    if (d < 0.0003 * t) { hit = true; break; }
    t += d;
  }
  if (hit && t < tObj) {
    h.t = t; h.mat = m; h.part = pt; h.p = ro + rd * t;
    if (m == M_HILL) {
#if LOWPOLY
      hillT(h.p.xz, h.n, h.fid);
#else
      h.n = hillNormalS(h.p.xz);
#endif
    } else h.n = sdfNormal(h.p);
    return h;
  }
  if (tObj < 1e8) { h.t = tObj; h.mat = mObj; h.part = pObj; h.p = ro + rd * tObj; h.n = nObj; h.fid = fract(float(kObj) * 0.618 + dot(nObj, vec3(12.9898, 78.233, 37.719))); return h; }
  if (rd.y < 0.0) { h.t = -ro.y / rd.y; h.mat = M_FLOOR; h.part = 21; h.p = ro + rd * h.t; h.n = vec3(0.0, 1.0, 0.0); return h; }
  float tc = 1e9; vec3 nc = vec3(0.0, -1.0, 0.0); int ci = 0;
#if LOWPOLY
  int mc = 0, pc = 0; int kc = castPolys(ro, rd, NPOLY_OBJ, NPOLY, tc, nc, mc, pc); ci = kc - NPOLY_OBJ;
#else
  tc = cloudsE(ro, rd, nc, ci);
#endif
  if (tc < 1e8) { h.t = tc; h.mat = M_CLOUD; h.part = 40 + ci; h.p = ro + rd * tc; h.n = nc; h.fid = fract(dot(nc, vec3(12.9898, 78.233, 37.719))); }
  return h;
}

// ---------------------------------------------------------------- light transport helpers
float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 120; i++) {
    vec3 p = ro + rd * t;
    if (p.y > 4.6 || t > 45.0) break;
    float h = mapD(p);
    res = min(res, 12.0 * h / t);
    t += clamp(h, 0.01, 0.3);
    if (res < 0.002) break;
  }
  return clamp(res, 0.0, 1.0);
}
float sunVis(vec3 p, vec3 n) {
  float s = softShadow(p + n * 0.012, SUN);
#if LOWPOLY
  if (s > 0.0 && anyPoly(p + n * 0.012, SUN, 0, NPOLY_OBJ)) s = 0.0;
#endif
  return s;
}
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++) { float h = 0.015 + 0.1 * float(i) / 4.0; float d = mapAO(p + h * n); occ += (h - d) * sca; sca *= 0.9; }
  float big = 0.0; sca = 1.0;
  for (int i = 0; i < 4; i++) { float h = 0.25 + 0.5 * float(i); float d = mapAO(p + h * n); big += max(h - d, 0.0) * sca / h; sca *= 0.8; }
  return clamp(1.0 - 2.4 * occ, 0.0, 1.0) * clamp(1.0 - 0.3 * big, 0.0, 1.0);
}

// ---------------------------------------------------------------- sky
float PIXANG() { return (1920.0 / uRes.x) / F; }
vec3 skyBase(vec3 rd) {
  float e = max(rd.y, 0.0);
  vec3 c = mix(P_HOR, P_LOW, smoothstep(0.0, 0.08, e));
  c = mix(c, P_MID, smoothstep(0.05, 0.24, e));
  c = mix(c, P_UP, smoothstep(0.2, 0.45, e));
  c = mix(c, P_ZEN, smoothstep(0.4, 0.85, e));
  vec2 hz = normalize(rd.xz + 1e-5), hs = normalize(SUN.xz);
  float az = max(dot(hz, hs), 0.0);
  float band = pow(az, 5.0) * exp(-e * 5.0);
  c = mix(c, P_GLOW, clamp(band * 0.75, 0.0, 1.0));
  return c;
}
vec3 sunHalo(vec3 rd) {
  float d = 1.0 - dot(rd, SUN);
  return P_SUNC * (0.55 * exp(-d * 1400.0) + 0.3 * exp(-d * 180.0) + 0.14 * exp(-d * 22.0));
}
float sunDisc(vec3 rd) {
  float ang = acos(clamp(dot(rd, SUN), -1.0, 1.0));
  float r = 26.0 / F;
  return 1.0 - smoothstep(r - PIXANG(), r + PIXANG(), ang);
}
float domeLines(vec3 rd, out float el) {
  vec3 oc = CAM - DOME_C; float b = dot(oc, rd); float c = dot(oc, oc) - DOME_R * DOME_R;
  float t = -b + sqrt(max(b * b - c, 0.0));
  vec3 q = (CAM + rd * t - DOME_C) / DOME_R;
  float az = atan(q.x, q.z); el = asin(clamp(q.y, -1.0, 1.0));
  float stp = radians(10.0);
  float pa = PIXANG() * t / DOME_R;              // one pixel, in dome radians
  float da = abs(fract(az / stp + 0.5) - 0.5) * stp * cos(el);
  float de = abs(fract(el / stp + 0.5) - 0.5) * stp;
  float la = 1.0 - smoothstep(0.35, 1.25, da / pa);
  float le = 1.0 - smoothstep(0.35, 1.25, de / pa);
  return max(la, le) * smoothstep(0.004, 0.03, el);
}
float floorLines(vec3 p, float t, vec3 rd) {
  float pa = PIXANG() * t;
  vec2 g = abs(fract(p.xz + 0.5) - 0.5);
  float fx = pa, fz = pa / max(abs(rd.y), 0.015);
  float lx = 1.0 - smoothstep(0.3, 1.2, g.x / fx);
  float lz = 1.0 - smoothstep(0.3, 1.2, g.y / fz);
  float fade = 1.0 - smoothstep(0.35, 0.9, max(fx, fz * 0.25));
  return max(lx, lz) * fade;
}
vec3 tonemapHP(vec3 c) {   // hue-preserving soft shoulder
  float m = max(max(c.r, c.g), c.b);
  if (m > 0.72) { float mm = 0.72 + 0.28 * (1.0 - exp(-(m - 0.72) / 0.28)); c *= mm / m; }
  float w = smoothstep(1.2, 4.0, m);
  return mix(c, vec3(max(max(c.r, c.g), c.b)), w * 0.5);
}
vec3 toSRGB(vec3 c) { c = max(c, 0.0); return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
`;
}

// ================================================================ RUNG 3/4: lit forward render
function LIT_FS(opt) {
  return COMMON(opt) + `
layout(location = 0) out vec4 oCol;
layout(location = 1) out vec4 oAux;
uniform float uSS;
const float CLAWD_EMIT = ${fx(opt.clawdEmit || 0.6)};
const float AURA_K = ${fx(opt.auraK || 0.2)}, AURA_S = ${fx(opt.auraS || 0.45)};
vec3 albedo(int mat) {
  if (mat == M_HILL) return A_HILL; if (mat == M_FLOOR) return A_FLOOR; if (mat == M_TRUNK) return A_TRUNK;
  if (mat == M_LEAF) return A_LEAF; if (mat == M_SKIN) return A_SKIN; if (mat == M_HAIR) return A_HAIR;
  if (mat == M_SWEATER) return A_SWEATER; if (mat == M_PANTS) return A_PANTS; if (mat == M_SHOE) return A_SHOE;
  return A_CLAWD;
}
vec3 aura(vec3 rd, float tmax) {
  vec3 oc = CGLOW - CAM; float tc = dot(oc, rd);
  float d2 = max(dot(oc, oc) - tc * tc, 0.0);
  float behind = smoothstep(0.15, 0.6, tmax - tc);
  vec3 warmWhite = vec3(1.0, 0.78, 0.58);
  return warmWhite * AURA_K * (exp(-d2 / (AURA_S * AURA_S)) + 0.4 * exp(-d2 / (6.0 * AURA_S * AURA_S))) * behind;
}
vec3 horizonFog(vec3 rd) { return skyBase(normalize(vec3(rd.x, 0.015, rd.z))); }
vec3 skyColor(vec3 rd) {
  vec3 c = skyBase(rd) + sunHalo(rd);
  float el; float g = domeLines(rd, el);
  float glowMask = 1.0 - 0.8 * exp(-(1.0 - dot(rd, SUN)) * 30.0);
  c = mix(c, c * 1.18 + A_GRID * 0.03, g * ${fx(opt.gridAlpha || 0.35)} * glowMask);
  c = mix(c, P_DISC, sunDisc(rd));
  return c;
}
vec3 shadeHit(Hit h, vec3 rd) {
  if (h.mat == M_SKY) return skyColor(rd);
  if (h.mat == M_CLOUD) {
    vec3 n = h.n;
    float lit = dot(n, SUN);
    vec3 c = mix(P_CSH, P_CLIT, smoothstep(-0.35, 0.6, lit));
    c = mix(c, P_CUND, smoothstep(0.1, -0.7, n.y) * 0.8);
    float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.5);
    c += P_SUNC * rim * exp(-(1.0 - dot(rd, SUN)) * 6.0) * 0.6;
#if LOWPOLY
    c *= 0.97 + 0.06 * h.fid;
#endif
    return mix(c, skyBase(rd), 0.2);
  }
  vec3 p = h.p, n = h.n;
  float sh = sunVis(p, n);
  float ao = calcAO(p, n);
  vec3 alb = albedo(h.mat);
#if LOWPOLY
  alb *= 0.9 + 0.2 * h.fid;
  alb *= mix(vec3(0.94, 0.98, 1.08), vec3(1.07, 1.03, 0.9), fract(h.fid * 7.31));
#endif
  if (h.mat == M_HILL) {
    float v = vnoise2(p.xz * 1.3) * 0.6 + vnoise2(p.xz * 4.0) * 0.4;
    alb *= 0.88 + 0.24 * v;
#if PAINTTEX
    // grass a painter would mix: warm and cool patches, streaks along the slope
    float n1 = vnoise2(p.xz * 0.8 + 3.0), n2 = vnoise2(p.xz * 2.6 + 7.0), n3 = vnoise2(vec2(p.x * 9.0, p.z * 2.2));
    alb *= 0.72 + 0.4 * n1 + 0.2 * (n3 - 0.5);
    alb = mix(alb, alb * vec3(1.3, 1.12, 0.62), smoothstep(0.55, 0.85, n2) * 0.5);
    alb = mix(alb, alb * vec3(0.75, 0.95, 1.3), smoothstep(0.5, 0.15, n1) * 0.5);
#endif
    alb = mix(alb, A_FLOOR, floorMix(p.xz));
  }
#if PAINTTEX
  if (h.mat == M_LEAF) {
    vec3 q = p - TPOS;
    float n1 = vnoise(q * 2.2), n2 = vnoise(q * 5.5 + 3.0);
    alb *= 0.75 + 0.5 * n1;
    alb = mix(alb, alb * vec3(1.3, 1.2, 0.65), smoothstep(0.55, 0.85, n2) * 0.7);
    alb = mix(alb, alb * vec3(0.7, 0.9, 1.35), smoothstep(0.45, 0.15, n2) * 0.5);
  }
#endif
  float ndl = max(dot(n, SUN), 0.0);
  // light rig: warm key from the low sun, cool sky from above, warm glow from the
  // sun-side horizon, a little green bounce from below
  float up = clamp(n.y, 0.0, 1.0);
  vec3 skyF = P_SKYF * (0.3 + 0.7 * up) * (h.mat == M_LEAF ? 1.35 : 1.0);
  vec3 gdir = normalize(vec3(SUN.x, 0.12, SUN.z));
  float gf = max(dot(n, gdir), 0.0);
  vec3 glowF = P_GLOWL * gf * gf;
  vec3 bounce = P_BOUNCE * clamp(0.5 - 0.5 * n.y, 0.0, 1.0);
  vec3 c = alb * (P_SUNL * ndl * sh + (skyF + glowF + bounce) * ao);
  float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
  float back = smoothstep(-0.2, 0.7, dot(n, gdir));
#if PAINTTEX
  if (h.mat == M_HILL) {
    float sunSide = smoothstep(-0.35, 0.9, dot(normalize(p.xz - CAM.xz), normalize(SUN.xz)));
    float streak = vnoise2(vec2(p.x * 1.6 + p.z * 0.4, p.y * 26.0));
    float ridge = pow(fres, 4.0) * smoothstep(-0.05, 0.35, dot(n, gdir));
    c += P_SUNL * alb * (ridge * 2.2 * sunSide + 0.06 * streak * up) * (0.3 + 0.7 * sh);
  }
#endif
  c += P_SUNL * mix(alb, vec3(1.0), 0.35) * fres * back * (0.15 + 0.85 * sh) * ${fx(0.55)};
  vec3 lc = CGLOW - p; float dl = length(lc);
  if (h.mat != M_CLAWD) c += alb * P_CLAWDL * max(dot(n, lc / dl) * 0.8 + 0.2, 0.0) / (1.0 + dl * dl * 2.5) * (0.4 + 0.6 * ao);
  if (h.mat == M_CLAWD) {
    // lit by the scene, plus an inner warmth so the orange holds in backlight
    c = A_CLAWD * (CLAWD_EMIT + P_SUNL * ndl * sh * 0.55 + (skyF * 0.35 + glowF * 0.6) * ao);
    c += P_SUNL * A_CLAWD * fres * 0.5;
#if LUMCLAWD
    vec3 q = toClawd(p);
    vec3 nl = vec3(CYAW.x * n.x - CYAW.y * n.z, n.y, CYAW.y * n.x + CYAW.x * n.z);
    // the front face glows from inside, hottest in the middle; side faces stay deeper
    float front = smoothstep(0.5, 0.95, -nl.z);
    vec2 cc = vec2(q.x / (8.0 * CU), (q.y - 5.0 * CU) / (5.0 * CU));
    float core = exp(-dot(cc, cc) * 1.6);
    c = mix(c, A_CLAWD * (0.98 + 0.34 * core) + vec3(0.05, 0.012, 0.0) * core, front * 0.92);
    // the lip of the front face catches light like a chamfer
    float ez = abs(q.z + 0.5 * CDEP) < 0.35 * CU ? 1.0 : 0.0;
    c += vec3(1.0, 0.62, 0.38) * ez * (1.0 - front) * 0.8;
    // eyes: light pours out of the sockets
    c = mix(c, vec3(3.2, 2.4, 1.5), clawdEye(q));
#endif
  }
  float fm = h.mat == M_FLOOR ? 1.0 : (h.mat == M_HILL ? floorMix(p.xz) : 0.0);
  if (fm > 0.0) {
    vec3 rf = reflect(rd, vec3(0.0, 1.0, 0.0));
    float fr = 0.04 + 0.96 * pow(1.0 - max(-rd.y, 0.0), 5.0);
    c = mix(c, mix(c, skyBase(rf) + sunHalo(rf) * 0.6, fr * 0.55), fm);
    c = mix(c, c * 1.35 + A_GRID * 0.04, floorLines(p, h.t, rd) * ${fx(opt.floorGrid || 0.5)} * fm);
  }
  float fog = 1.0 - exp(-max(h.t - 7.0, 0.0) * ${fx(opt.fog || 0.016)});
  return mix(c, horizonFog(rd), fog);
}
void main() {
  vec3 acc = vec3(0.0); vec4 aux = vec4(0.0);
  int N = int(uSS);
  for (int sy = 0; sy < 4; sy++) { if (sy >= N) break;
    for (int sx = 0; sx < 4; sx++) { if (sx >= N) break;
      vec2 jit = (vec2(float(sx), float(sy)) + 0.5) / float(N) - 0.5;
      vec2 fc = gl_FragCoord.xy + jit;
      vec2 px = vec2(fc.x, uRes.y - fc.y) * (1920.0 / uRes.x);
      vec3 rd = normalize(vec3((px.x - 960.0) / F, (CY - px.y) / F, 1.0));
      Hit h = castScene(CAM, rd);
#if CLAWDONLY
      if (h.mat == M_CLAWD) { acc += shadeHit(h, rd); aux.x += 1.0; }
#else
      acc += shadeHit(h, rd) + aura(rd, h.t);
      if (sx == 0 && sy == 0) aux = vec4(float(h.mat) + float(h.part) / 64.0, h.t, h.n.x, h.n.y);
#endif
    }
  }
#if CLAWDONLY
  oCol = vec4(acc / max(aux.x, 1.0), aux.x / float(N * N));
  oAux = vec4(0.0);
#else
  oCol = vec4(acc / float(N * N), 1.0);
  oAux = aux;
#endif
}`;
}

// ================================================================ POST (blur, bloom, finish)
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform vec2 uDir; uniform float uSigma;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 st = uDir / uRes;
  vec4 acc = vec4(0.0); float wsum = 0.0;
  for (int i = -24; i <= 24; i++) {
    float x = float(i); float w = exp(-x * x / (2.0 * uSigma * uSigma));
    acc += texture(uSrc, uv + st * x * max(uSigma / 8.0, 1.0)) * w; wsum += w;
  }
  o = acc / wsum;
}`;
const DOWN_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uThr;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 px = 1.0 / uRes;
  vec3 c = (texture(uSrc, uv + px * vec2(-0.25, -0.25)).rgb + texture(uSrc, uv + px * vec2(0.25, -0.25)).rgb +
            texture(uSrc, uv + px * vec2(-0.25, 0.25)).rgb + texture(uSrc, uv + px * vec2(0.25, 0.25)).rgb) * 0.25;
  float m = max(max(c.r, c.g), c.b);
  o = vec4(c * smoothstep(uThr, uThr + 0.5, m), 1.0);
}`;
let _blurProg, _downProg;
function bloomChain(src, thr, sigmas) {
  _downProg = _downProg || compile(DOWN_FS, 'down');
  _blurProg = _blurProg || compile(BLUR_FS, 'blur');
  const outs = [];
  for (const [scale, sigma] of sigmas) {
    const w = Math.round(W / scale), h = Math.round(H / scale);
    const a = tex(w, h, 'f16'), b = tex(w, h, 'f16');
    const fa = fbo([a]), fb = fbo([b]);
    run(_downProg, fa, { uThr: thr }, { uSrc: src });
    run(_blurProg, fb, { uDir: [1, 0], uSigma: sigma }, { uSrc: a });
    run(_blurProg, fa, { uDir: [0, 1], uSigma: sigma }, { uSrc: b });
    outs.push(a);
  }
  return outs;
}

// ================================================================ OUTPUT
const out = document.getElementById('out');
const octx = out.getContext('2d');
function finish() {
  gpuSync();
  TIMES.total = performance.now() - T0;
  TIMES.render = TIMES.total - (TIMES.compile || 0);
  log('rung ' + RUNG + ' times(ms): ' + Object.entries(TIMES).map(([k, v]) => k + '=' + v.toFixed(0)).join(' '));
  if (Q.get('dump') === '1') document.getElementById('png').textContent = out.toDataURL('image/png');
}
// gl.finish() does not block in Chrome; reading one pixel back does, so timings are real
const _px = new Uint8Array(4);
function gpuSync() { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, _px); }
function timed(label, fn) { gpuSync(); const t0 = performance.now(); const r = fn(); gpuSync(); TIMES[label] = (TIMES[label] || 0) + performance.now() - t0; return r; }
function blitToCanvas() { octx.drawImage(glc, 0, 0); }

// tiled draw: heavy ray-casting shaders are split into bands so no single GPU
// command runs long enough to trip the Windows GPU watchdog.
function runTiled(prog, target, uniforms, textures, bands) {
  bands = bands || 8;
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  const w = target ? target.w : W, h = target ? target.h : H;
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  bindUniforms(prog, Object.assign({ uRes: [w, h] }, uniforms), textures);
  gl.enable(gl.SCISSOR_TEST);
  for (let b = 0; b < bands; b++) {
    const y0 = Math.floor(h * b / bands), y1 = Math.floor(h * (b + 1) / bands);
    gl.scissor(0, y0, w, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
  }
  gl.disable(gl.SCISSOR_TEST);
}

const POST_LIB = `

  // ---------------------------------------------------------- rim light: 1 px on edges facing the sun
  const sx = sN[0], sy = sN[1];
  const RIMC = { [MAT.HILL]: 9, [MAT.LEAF]: 8, [MAT.TRUNK]: 6, [MAT.SWEATER]: 12, [MAT.SKIN]: 11, [MAT.HAIR]: 7, [MAT.PANTS]: 6, [MAT.SHOE]: 5 };
  const IB2 = IB.slice();
  for (let y = 1; y < NH - 1; y++) for (let x = 1; x < NW - 1; x++) {
    const i = y * NW + x, m = MB[i];
    if (m === MAT.SKY || m === MAT.CLOUD || m === MAT.FLOOR || !(m in RIMC)) continue;

    const ux = Math.abs(dx / l) > 0.38 ? Math.sign(dx) : 0, uy = Math.abs(dy / l) > 0.38 ? Math.sign(dy) : 0;

  }
  IB.set(IB2);

  // ---------------------------------------------------------- a dark 1-px line where the figure meets the grass
  {
    const FIG = new Set([MAT.SKIN, MAT.HAIR, MAT.SWEATER, MAT.PANTS, MAT.SHOE]);
    const IB3 = IB.slice();
    for (let y = 1; y < NH - 1; y++) for (let x = 1; x < NW - 1; x++) {
      const i = y * NW + x;
      if (MB[i] !== MAT.HILL) continue;
      const nb = [i - 1, i + 1, i - NW, i + NW];
      if (nb.some(j => FIG.has(MB[j]))) IB3[i] = K(1);
    }
    IB.set(IB3);
  }
  // ---------------------------------------------------------- grass marks on the slope
  {
    const rg = mulberry32(777);
    for (let y = 2; y < NH; y++) for (let x = 0; x < NW; x++) {
      const i = y * NW + x;
      if (MB[i] !== MAT.HILL || g2[at(x, y) + 3] > 0.3) continue;
      const dens = 0.003 + 0.009 * (y / NH);
      if (rg() > dens) continue;
      const v = IB[i], up = rg() < 0.5 ? 1 : -1;
      const len = y > 200 && rg() < 0.5 ? 2 : 1;
      for (let k = 0; k < len; k++) { const j = (y - k) * NW + x; if (MB[j] === MAT.HILL) IB[j] = K(v + up); }

  const rnd = mulberry32(4242);
  for (let x = 1; x < NW - 1; x++) {
    let top = -1;
    for (let y = 0; y < NH; y++) { const m = MB[y * NW + x]; if (m === MAT.HILL) { top = y; break; } if (m !== MAT.SKY && m !== MAT.CLOUD) break; }

    const r = rnd();
    const hgt = r < 0.2 ? 2 : r < 0.55 ? 1 : 0;
    for (let k = 1; k <= hgt; k++) IB[(top - k) * NW + x] = IB[top * NW + x];
  }

  // ---------------------------------------------------------- Clawd: 36x10 sprite, light from the right
  const cp = project([CLAWD.x, CLAWD.y, CLAWD.z]);
  const cx = Math.round(cp[0] / 4), cyN = Math.round(cp[1] / 4);
  const spr = mirrorGrid(PX2);
  const x0 = cx - 18, y0 = cyN - 20;
  // his light: warm rings in the air, a warm pool on the grass below him
  const LX = cx, LY = cyN - 10;
  for (let y = Math.max(0, LY - 40); y < Math.min(NH, LY + 40); y++) for (let x = Math.max(0, LX - 60); x < Math.min(NW, LX + 60); x++) {
    const i = y * NW + x, m = MB[i];
    const r = Math.hypot((x + 0.5 - LX) / 1.35, y + 0.5 - LY);
    const lv = 2.4 * Math.pow(clamp(1 - r / 30, 0, 1), 1.3);
    const q = qd(lv, x, y, 2);
    if (q < 1) continue;
    if (m === MAT.SKY || m === MAT.CLOUD) IB[i] = Math.min(IB[i] + q, S(2));
    else if (m === MAT.HILL) IB[i] = GL(Math.min(q, 2));
  }
  for (let r = 0; r < 10; r++) for (let c = 0; c < 36; c++) {
    const ch = spr[r][c];
    if (ch === '.' || ch === 'o') continue;
    for (let k = 0; k < 2; k++) { const x = x0 + c, y = y0 + r * 2 + k; if (x >= 0 && y >= 0 && x < NW && y < NH) IB[y * NW + x] = CL[ch]; }
  }
  TIMES.pixelJS = performance.now() - t0;

  // ---------------------------------------------------------- 4x nearest
  const img = octx.createImageData(W, H), D = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = RGB[IB[(y >> 2) * NW + (x >> 2)]], k = (y * W + x) * 4;
    D[k] = c[0]; D[k + 1] = c[1]; D[k + 2] = c[2]; D[k + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  log('rung1 colours used: ' + new Set(IB).size);
}


// ================================================================ RUNG 2: VECTOR
// The same scene cel-shaded at 2x: every surface gets one of two flat tones (lit or
// shade, split by a crisp terminator), the sky is posterised into flat bands with
// flat rings around the sun. An ink pass then draws a uniform line wherever one
// object group meets another, on the nearer side only (ligne claire), lighter ink
// for the landscape and the clouds. Clawd is the ladder's vector silhouette.
const VEC_PAL = {
  SK0: '#6f7096', SK1: '#8a87aa', SK2: '#a69cb8', SK3: '#c2b0bf', SK4: '#d9c3c1', SK5: '#e8d4c7',
  SR1: '#f0dfcd', SR2: '#f5e8d7', SUNV: '#fbf3e6',
  CLS: '#9d98b8', CLL: '#e4cfcb', CLU: '#ecd6c9',
  HSH: '#4a5a5c', HLT: '#8f9270', HFAR: '#6a7474', FLR: '#565a70', FLG: '#6d7188',
  TSH: '#3b4a4d', TLT: '#708062', TRK: '#3d3437',
  HAIR: '#2b2733', SKIN: '#b99586', SWS: '#9895a8', SWL: '#d6cfcd', PNT: '#3a3e56', PNL: '#555a74', SHOE: '#25232b',
  INK: '#2a2540', INK2: '#433d5a', INKC: '#8d86ad',

const vecGLSL = () => Object.entries(VEC_PAL).map(([k, v]) => `const vec3 V_${k} = vec3(${[1, 3, 5].map(i => fx(parseInt(v.slice(i, i + 2), 16) / 255)).join(',')});`).join('\n');
const CEL_FS = opt => COMMON(opt) + `
layout(location = 0) out vec4 oCol; layout(location = 1) out vec4 oAux;
${vecGLSL()}
vec3 celSky(vec3 rd, float py) {
  float el = max((CY - py) / F, 0.0) * 0.93, cs = dot(rd, SUN);
  float wide = exp(-(1.0 - cs) * 9.0);
  float v = 1.0 - pow(el / 0.5, 0.8) + 0.07 * wide;      // 1 at the horizon, ~0 at the top
  vec3 c = V_SK0;
  if (v > 0.18) c = V_SK1; if (v > 0.36) c = V_SK2; if (v > 0.55) c = V_SK3; if (v > 0.74) c = V_SK4; if (v > 0.9) c = V_SK5;
  float ang = acos(clamp(cs, -1.0, 1.0)) * F;             // pixels from the sun centre
  if (ang < 104.0) c = mix(c, V_SR1, 0.6); if (ang < 58.0) c = V_SR2; if (ang < 27.0) c = V_SUNV;
  float el2; float g = domeLines(rd, el2);
  if (ang > 120.0) c = mix(c, c * 1.08 + 0.02, step(0.5, g));
  return c;
}
void main() {
  vec2 fc = gl_FragCoord.xy;
  vec2 px = vec2(fc.x, uRes.y - fc.y) * (1920.0 / uRes.x);
  vec3 rd = normalize(vec3((px.x - 960.0) / F, (CY - px.y) / F, 1.0));
  Hit h = castScene(CAM, rd);
  vec3 c; float grp = 0.0, wcls = 0.0;
  if (h.mat == M_SKY) { c = celSky(rd, px.y); grp = 0.0; }
  else if (h.mat == M_CLOUD) {
    float lit = dot(h.n, SUN) * 0.6 - h.n.y * 0.7;
    c = lit > 0.12 ? V_CLL : V_CLS;
    if (h.n.y < -0.55) c = V_CLU;
    grp = 30.0 + float(h.part); wcls = 2.0;
  } else {
    vec3 n = h.n, p = h.p;
    float sh = sunVis(p, n);
    float ndl = max(dot(n, SUN), 0.0) * sh;
    vec3 gdir = normalize(vec3(SUN.x, 0.12, SUN.z));
    float gf = max(dot(n, gdir), 0.0);
    float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
    float lit = ndl * 1.6 + gf * gf * 0.5 + fres * smoothstep(-0.2, 0.7, dot(n, gdir)) * 0.6;
    int m = h.mat;
    if (m == M_HILL || m == M_FLOOR) {
      float fm = m == M_FLOOR ? 1.0 : floorMix(p.xz);
      c = lit > 0.3 ? V_HLT : V_HSH;
      if (fm > 0.5) {
        c = V_FLR;
        vec2 g = abs(fract(p.xz * 2.0 + 0.5) - 0.5) / 2.0;
        float pw = PIXANG() * h.t;
        if (g.x < pw * 0.9 || g.y < pw * 0.9 / max(abs(rd.y), 0.05)) c = V_FLG;
      }
      grp = 1.0; wcls = 1.0;
    } else if (m == M_LEAF) { float ll = 0.55 * n.y + 0.75 * max(n.x, 0.0) + 2.0 * ndl; c = ll > 0.62 ? V_TLT : V_TSH; grp = 3.0; wcls = 0.0; }

    else if (m == M_HAIR) { c = V_HAIR; grp = 4.0; }
    else if (m == M_SKIN) { c = V_SKIN; grp = float(h.part == 10 ? 11 : 5); }
    else if (m == M_SWEATER) { c = lit > 0.3 ? V_SWL : V_SWS; grp = float(h.part == 2 ? 6 : h.part); }
    else if (m == M_PANTS) { c = lit > 0.3 ? V_PNL : V_PNT; grp = float(h.part == 1 ? 6 : h.part); }
    else if (m == M_SHOE) { c = V_SHOE; grp = 12.0; }
  }
  oCol = vec4(c, 1.0);
  oAux = vec4(grp, h.t, wcls, 0.0);
}`;
const INK_FS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uCel, uAux; uniform vec2 uRes;
uniform vec3 uClawd;      // screen x centre, ground y, px per glyph unit
out vec4 o;
${vecGLSL()}
float sdRoundBox(vec2 p, vec2 c, vec2 hb, float r) { vec2 q = abs(p - c) - hb + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

// the ladder's vector Clawd (glyph units, 18 x 10 box, y down)
float clawdV(vec2 p, out float eye) {
  float d = sdRoundBox(p, vec2(9.0, 4.0), vec2(6.0, 4.0), 0.7);
  d = smin(d, sdRoundBox(p, vec2(9.0, 5.0), vec2(8.0, 1.0), 0.98), 0.32);
  d = smin(d, sdRoundBox(p, vec2(4.5, 8.75), vec2(0.5, 1.25), 0.48), 0.18);
  d = smin(d, sdRoundBox(p, vec2(6.5, 8.75), vec2(0.5, 1.25), 0.48), 0.18);
  d = smin(d, sdRoundBox(p, vec2(11.5, 8.75), vec2(0.5, 1.25), 0.48), 0.18);
  d = smin(d, sdRoundBox(p, vec2(13.5, 8.75), vec2(0.5, 1.25), 0.48), 0.18);
  eye = min(sdRoundBox(p, vec2(5.5, 3.0), vec2(0.5, 1.0), 0.46), sdRoundBox(p, vec2(12.5, 3.0), vec2(0.5, 1.0), 0.46));
  return max(d, -eye);
}
vec3 inkOf(float w) { return w > 1.5 ? V_INKC : (w > 0.5 ? V_INK2 : V_INK); }
float radiusOf(float w) { return w > 1.5 ? 2.4 : (w > 0.5 ? 3.4 : 5.0); }
void main() {
  ivec2 o1 = ivec2(gl_FragCoord.xy);
  vec3 acc = vec3(0.0);
  for (int sy = 0; sy < 2; sy++) for (int sx = 0; sx < 2; sx++) {
    ivec2 q = o1 * 2 + ivec2(sx, sy);
    vec3 c = texelFetch(uCel, q, 0).rgb;
    vec4 a = texelFetch(uAux, q, 0);
    float R = radiusOf(a.z);
    float ink = 0.0;
    if (a.x > 0.5) {
      for (int dy = -6; dy <= 6; dy++) for (int dx = -6; dx <= 6; dx++) {
        float rr = float(dx * dx + dy * dy);
        if (rr > R * R || rr == 0.0) continue;
        vec4 b = texelFetch(uAux, q + ivec2(dx, dy), 0);
        bool diff = abs(b.x - a.x) > 0.5;
        if ((diff && a.y < b.y * 0.985) || (!diff && a.y < b.y * 0.82)) ink = 1.0;
      }
    }
    // flat rim band: a lit tone just inside edges that face the low sun (right and top)
    if (ink < 0.5 && a.x > 0.5 && a.x < 30.0) {
      float rim = 0.0;
      ivec2 tsz = textureSize(uAux, 0);
      for (int k = 1; k <= 16; k++) {
        if (q.x + k >= tsz.x || q.y + k >= tsz.y) break;       // the frame edge is not sky
        vec4 b1 = texelFetch(uAux, q + ivec2(k, 0), 0);
        vec4 b2 = texelFetch(uAux, q + ivec2(0, k), 0);
        if ((b1.x < 0.5 || (b1.y > a.y * 1.4 && abs(b1.x - a.x) > 0.5)) && k <= 13) rim = 1.0;
        if (b2.x < 0.5 && k <= 10) rim = max(rim, a.x < 1.5 ? 1.0 : 0.6);
      }
      if (rim > 0.0) {
        vec3 lit = a.x < 1.5 ? V_HLT : (a.x < 3.5 ? (a.x < 2.5 ? V_TRK * 1.6 : V_TLT) : c * 1.35 + vec3(0.06, 0.04, 0.02));

  float U = uClawd.z;
  vec2 g = (px - vec2(uClawd.x - 9.0 * U, uClawd.y - 10.0 * U)) / U;

  float inkW = 2.3 / U;
  float cov = clamp(0.5 - d * U, 0.0, 1.0);
  float covInk = clamp(0.5 - (d - inkW) * U, 0.0, 1.0);
  vec3 body = mix(vec3(0.878, 0.498, 0.373), vec3(0.831, 0.439, 0.31), clamp(g.y / 10.0, 0.0, 1.0));

function rung2() {
  const opt = { lowpoly: false, clawd3d: false, leafNoise: false, pal: 3 };
  const W2 = W * 2, H2 = H * 2;
  const cel = tex(W2, H2, 'f16', null, gl.NEAREST), aux = tex(W2, H2, 'f32');
  const fb = fbo([cel, aux]);
  const prog = compile(CEL_FS(opt), 'cel2');
  timed('scene', () => runTiled(prog, fb, {}, { uPl: plTex, uPm: pmTex }, 16));
  const cp = project([CLAWD.x, CLAWD.y, CLAWD.z]);
  const ink = compile(INK_FS, 'ink2');
  timed('ink', () => runTiled(ink, null, { uClawd: [cp[0], cp[1], 8] }, { uCel: cel, uAux: aux }, 8));
  gl.finish();
  blitToCanvas();
}


// ================================================================ RUNG 5: LIGHT
// The lit scene becomes a dim ghost; its surfaces are re-drawn as ~300k additive
// motes sampled from the render (dense on silhouettes, sparse inside), which lift
// and drift outward the closer they are to Clawd. The grid glows as threads of
// light. Clawd is the spark: the ladder's 11-ray burst, eyes kept, the new sun.
const GHOST_FS = opt => COMMON(opt) + `
uniform sampler2D uCol, uAux; uniform vec3 uSpark;
out vec4 o;
float edgeAt(ivec2 q) {
  vec4 a = texelFetch(uAux, q, 0);
  float e = 0.0;
  for (int k = 0; k < 8; k++) {
    float an = float(k) * 0.785398;
    ivec2 d = ivec2(round(vec2(cos(an), sin(an)) * 2.0));
    vec4 b = texelFetch(uAux, clamp(q + d, ivec2(0), textureSize(uAux, 0) - 1), 0);
    if (abs(floor(b.x) - floor(a.x)) > 0.5 || abs(b.y - a.y) > 0.08 * min(a.y, b.y)) e += 0.125;
  }
  return e;
}
void main() {
  ivec2 q = ivec2(gl_FragCoord.xy);
  vec3 c = texelFetch(uCol, q, 0).rgb;
  vec4 a = texelFetch(uAux, q, 0);
  int mat = int(floor(a.x));
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  if (mat == 0) { o = vec4(c, 1.0); return; }
  vec3 rd = normalize(vec3((px.x - 960.0) / F, (CY - px.y) / F, 1.0));
  vec3 p = CAM + rd * a.y;
  float e = edgeAt(q);
  float ds = length((px - uSpark.xy) / vec2(1.0, 0.8));
  float near = smoothstep(1100.0, 80.0, ds);        // how much of his light reaches here
  float ghost = mat == 11 ? 0.6 : 0.42;
  vec3 g = c * ghost;
  // silhouettes glow, warmer and brighter toward the spark
  g += (c * 0.8 + vec3(0.7, 0.45, 0.25) * near) * e * (0.8 + 1.4 * near);
  if (mat == 2 || mat == 1) {
    // the hill becomes a height map drawn in light: contour lines every 12 cm
    float hh = p.y / 0.16;
    float pw = PIXANG() * a.y / max(0.12, 0.35) * 2.2;
    float line = 1.0 - smoothstep(0.0, pw * 1.6 + 0.02, abs(fract(hh) - 0.5) * 2.0 - (1.0 - pw * 1.6));
    float d = abs(fract(hh + 0.5) - 0.5);                         // distance to the nearest contour, in steps
    float fw = PIXANG() * a.y * 9.0;                               // about a pixel, in steps

    vec3 lc = mix(vec3(0.95, 0.55, 0.35), vec3(1.0, 0.82, 0.55), near);

  }

    vec3 n = vec3(0.0);
    float side = smoothstep(-0.2, 0.9, (uSpark.x - px.x) < 0.0 ? -1.0 : 1.0);
    g = c * 0.42 + vec3(0.9, 0.55, 0.35) * e * (1.2 + 1.2 * side);
  }
  o = vec4(g, 1.0);
}`;
const MOTE_VS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uCol, uAux;
uniform vec2 uRes, uGrid; uniform float uLayer, uSize; uniform vec3 uSpark;
out vec3 vCol; out vec2 vUV; out float vA; out vec2 vStreak;
float h1(float n) { return fract(sin(n * 12.9898 + uLayer * 78.233) * 43758.5453); }
void main() {

  if (mat == 10) alive = 0.0;

  vec2 sp = vec2(uSpark.x, uRes.y - uSpark.y);
  vec2 away = p - sp; float ds = length(away / vec2(1.0, 0.8));
  float dis = smoothstep(1000.0, 100.0, ds) * (0.4 + 0.6 * h1(fid * 6.1));
  vec2 drift = normalize(away + vec2(0.0, 1e-3)) * 0.6 + vec2(0.0, 1.0);
  float lift = dis * dis * (40.0 + 160.0 * h1(fid * 7.7));
  vec2 pos0 = p + drift * lift;
  float sz = uSize * (0.6 + 0.9 * h1(fid * 4.3)) * (1.0 + e * 0.5);
  vec2 corner = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1)) * 2.0 - 1.0;
  // motes that travel leave a short streak along their drift
  vec2 sdir = normalize(drift);
  float slen = 1.0 + max(lift - 70.0, 0.0) * 0.012;
  vec2 off = sdir * corner.y * sz * slen + vec2(-sdir.y, sdir.x) * corner.x * sz;
  vec3 col = (c * (1.4 + 1.2 * e) + vec3(0.9, 0.55, 0.3) * dis) * (0.6 + 0.8 * dis);
  if (mat == 11) col = c * 1.3;
  if (mat == 4) col = mix(c * 2.0, vec3(1.0, 0.78, 0.42), 0.55) * 1.2;
  vCol = col; vUV = corner; vA = alive * (0.55 + 0.45 * h1(fid * 8.3)); vStreak = vec2(slen, 0.0);
  gl_Position = vec4((pos0 + off) / uRes * 2.0 - 1.0, 0.0, 1.0);
}`;
const MOTE_FS = `#version 300 es
precision highp float;
in vec3 vCol; in vec2 vUV; in float vA; in vec2 vStreak;
out vec4 o;
void main() {
  if (vA <= 0.0) discard;
  float r = length(vec2(vUV.x, vUV.y));
  float a = exp(-r * r * 3.2) * vA;
  o = vec4(vCol * a, a);
}`;
const SPARK_FS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uBase, uAux; uniform vec2 uRes; uniform vec3 uSpark; uniform float uU;
out vec4 o;
float sdRoundBox(vec2 p, vec2 c, vec2 hb, float r) { vec2 q = abs(p - c) - hb + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdRay(vec2 p, vec2 a, vec2 b, float ra, float rb) {
  p -= a; b -= a;
  float h = dot(b, b);
  vec2 q = vec2(dot(p, vec2(b.y, -b.x)), dot(p, b)) / h;
  q.x = abs(q.x);
  float bb = ra - rb; vec2 c = vec2(sqrt(max(h - bb * bb, 1e-6)), bb);
  float k = c.x * q.y - c.y * q.x, m = dot(c, q), n = dot(q, q);
  if (k < 0.0) return sqrt(h * n) - ra;
  if (k > c.x) return sqrt(h * (n + 1.0 - 2.0 * q.y)) - rb;
  return m - ra;
}
// the ladder's spark: 11 rays mapped onto Clawd's limbs, fully radiated (t = 1)
const float RA[11] = float[11](0.0, 47.0, 63.0, 116.0, 133.0, 180.0, -151.0, -121.0, -92.0, -61.0, -31.0);
const float RL[11] = float[11](8.3, 7.0, 7.9, 7.5, 6.6, 8.7, 6.2, 7.8, 8.9, 7.1, 6.6);
const float RW[11] = float[11](0.8, 0.62, 0.66, 0.64, 0.6, 0.8, 0.66, 0.72, 0.76, 0.7, 0.66);
float burst(vec2 p) {
  vec2 cen = vec2(9.0, 4.6);
  float d = 1e9;
  for (int i = 0; i < 11; i++) {
    float th = radians(RA[i]);
    vec2 dir = vec2(cos(th), sin(th));
    d = smin(d, sdRay(p, cen, cen + dir * RL[i], RW[i] * 1.45, 0.3), 0.35);
  }
  return d;
}
void main() {
  vec3 base = texelFetch(uBase, ivec2(gl_FragCoord.xy), 0).rgb;
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float U = uU;
  vec2 g = (px - vec2(uSpark.x, uSpark.y)) / U + vec2(9.0, 4.6);   // glyph units, centred on the burst
  vec2 cen = vec2(9.0, 4.6);
  float rays = burst(g);
  float core = sdRoundBox(g, cen, vec2(1.9, 1.35), 1.2);
  float eye = min(sdRoundBox(g, cen + vec2(-1.0, -0.1), vec2(0.21, 0.44), 0.2), sdRoundBox(g, cen + vec2(1.0, -0.1), vec2(0.21, 0.44), 0.2));
  float d = max(smin(rays, core, 0.8), -eye);
  float cov = clamp(0.5 - d * U, 0.0, 1.0);
  float r = length((g - cen) * vec2(1.0, 1.1));
  vec3 hot = vec3(1.0, 0.9, 0.78) * 2.8, orange = vec3(0.85, 0.3, 0.12) * 1.9, ember = vec3(0.69, 0.2, 0.1) * 1.4;
  vec3 sc = mix(hot, orange, smoothstep(1.6, 5.0, r));
  sc = mix(sc, ember, smoothstep(6.0, 9.5, r) * 0.45);
  // light around it: a soft corona and faint long rays along the burst directions
  float corona = exp(-r * r / 40.0) * 0.9 + exp(-r / 9.0) * 0.35;
  float beams = 0.0;
  for (int i = 0; i < 11; i++) {
    float th = radians(RA[i]);
    vec2 dir = vec2(cos(th), sin(th));
    vec2 v = g - cen;
    float along = dot(v, dir), across = abs(v.x * dir.y - v.y * dir.x);
    if (along > 0.0) beams += exp(-across * across / (1.2 + along * 0.35)) * exp(-along / 16.0) * 0.5;
  }
  float air = texelFetch(uAux, ivec2(gl_FragCoord.xy), 0).x < 0.5 ? 1.0 : 0.25;
  vec3 col = base + vec3(1.0, 0.62, 0.4) * (corona * 0.9 + beams * 0.55 * air);
  col = mix(col, sc, cov);
  // the eyes stay: two dark slits in the white-hot core
  float eyeCov = clamp(0.5 - eye * U, 0.0, 1.0) * step(core, 0.3);
  col = mix(col, vec3(0.45, 0.14, 0.08), eyeCov * 0.85);
  o = vec4(col, 1.0);
}`;
const SKY5_FS = opt => COMMON(opt) + `
uniform sampler2D uCol, uAux;
out vec4 o;
void main() {
  ivec2 q = ivec2(gl_FragCoord.xy);
  vec4 a = texelFetch(uAux, q, 0);
  vec3 c = texelFetch(uCol, q, 0).rgb;
  if (floor(a.x) > 0.5) { o = vec4(c, 1.0); return; }
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 rd = normalize(vec3((px.x - 960.0) / F, (CY - px.y) / F, 1.0));
  float el; float g = domeLines(rd, el);
  // the grid becomes threads of light, brighter where it crosses itself
  vec3 oc = CAM - DOME_C; float b = dot(oc, rd); float cc = dot(oc, oc) - DOME_R * DOME_R;
  float t = -b + sqrt(max(b * b - cc, 0.0));
  vec3 dq = (CAM + rd * t - DOME_C) / DOME_R;
  float az = atan(dq.x, dq.z), stp = radians(10.0);
  vec2 f = abs(fract(vec2(az / stp, el / stp) + 0.5) - 0.5) * stp;
  float node = exp(-dot(f, f) / (2.0 * pow(PIXANG() * 2.2, 2.0)));
  vec3 thread = vec3(1.0, 0.8, 0.62);
  c += thread * (g * 0.16 + node * 0.45) * smoothstep(0.0, 0.05, el);
  o = vec4(c, 1.0);
}`;
function rung5() {
  const opt = { lowpoly: false, clawd3d: false, leafNoise: true, pal: 5, gridAlpha: 0.0, floorGrid: 0.8, fog: 0.02, auraK: 0.0 };
  const col = tex(W, H, 'f16'), aux = tex(W, H, 'f32');
  const fb = fbo([col, aux]);
  const prog = compile(LIT_FS(opt), 'lit5');
  timed('scene', () => runTiled(prog, fb, { uSS: 1 }, { uPl: plTex, uPm: pmTex }, 8));
  const cp = project([CLAWD.x, CLAWD.y, CLAWD.z]);
  const spark = [cp[0], cp[1] - 5 * 8 - 6, 0];
  // sky with glowing grid
  const sky = tex(W, H, 'f16'), fsk = fbo([sky]);
  run(compile(SKY5_FS(opt), 'sky5'), fsk, {}, { uCol: col, uAux: aux });
  // ghost of the world
  const gh = tex(W, H, 'f16'), fg = fbo([gh]);
  run(compile(GHOST_FS(opt), 'ghost'), fg, { uSpark: spark }, { uCol: sky, uAux: aux });
  // motes
  const mprog = compile(MOTE_FS, 'mote', MOTE_VS);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fg);
  gl.viewport(0, 0, W, H);
  gl.useProgram(mprog);
  gl.disableVertexAttribArray(0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  let n = 0;
  for (const L of [{ cell: 4, size: 1.4, seed: 1 }, { cell: 9, size: 2.4, seed: 2 }, { cell: 22, size: 4.5, seed: 3 }]) {
    const gx = Math.round(W / L.cell), gy = Math.round(H / L.cell);
    bindUniforms(mprog, { uRes: [W, H], uGrid: [gx, gy], uLayer: L.seed, uSize: L.size, uSpark: spark }, { uCol: col, uAux: aux });
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, gx * gy);
    n += gx * gy;
  }
  gl.disable(gl.BLEND);
  gl.enableVertexAttribArray(0);
  TIMES.motes = n;
  // the spark
  const sp = tex(W, H, 'f16'), fsp = fbo([sp]);
  run(compile(SPARK_FS, 'spark'), fsp, { uSpark: spark, uU: 15 }, { uBase: gh, uAux: aux });
  const bl = timed('bloom', () => bloomChain(sp, 0.7, [[4, 5], [16, 10]]));
  const fin = compile(FINISH_FS, 'finish5');
  run(fin, null, { uBloom1: 0.5, uBloom2: 0.8, uVig: 0.3, uGrain: 0.02, uExposure: 1.0, uMaskClawd: 0 }, { uCol: sp, uB1: bl[0], uB2: bl[1], uAux: aux });
  gl.finish();
  blitToCanvas();
}

// ================================================================ RUNGS
function rung3() {
  const opt = { lowpoly: true, clawd3d: true, pal: 3, gridAlpha: 0.45, floorGrid: 0.55, fog: 0.016, clawdEmit: 0.82, auraK: 0.62, auraS: 0.5 };
  const col = tex(W, H, 'f16'), aux = tex(W, H, 'f32');
  const fb = fbo([col, aux]);
  const prog = compile(LIT_FS(opt), 'lit3');
  timed('scene', () => runTiled(prog, fb, { uSS: +(Q.get('ss') || 3) }, { uPl: plTex, uPm: pmTex }, 12));
  const wr = lightWrap(col, aux, 0.18, 3);
  const bl = timed('bloom', () => bloomChain(wr, 0.85, [[4, 5], [16, 7]]));
  const fin = compile(FINISH_FS, 'finish');
  run(fin, null, { uBloom1: 0.22, uBloom2: 0.3, uVig: 0.22, uGrain: 0.012, uExposure: 1.0, uMaskClawd: 1 }, { uCol: wr, uB1: bl[0], uB2: bl[1], uAux: aux });
  gl.finish();
  blitToCanvas();
}
function clawdScissorRun(prog, target, uniforms, textures) {
  const cs = project([CLAWD.x, CLAWD.y, CLAWD.z]);
  const x0 = Math.floor(cs[0] - 110), x1 = Math.ceil(cs[0] + 110), y0 = Math.floor(cs[1] - 130), y1 = Math.ceil(cs[1] + 30);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  bindUniforms(prog, Object.assign({ uRes: [W, H] }, uniforms), textures);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(x0, H - y1, x1 - x0, y1 - y0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.SCISSOR_TEST);
}
function rung4() {
  const opt = { lowpoly: false, clawd3d: true, leafNoise: true, pal: 4, gridAlpha: 0.75, floorGrid: 0.4, fog: 0.014, clawdEmit: 0.8, auraK: 0.85, auraS: 0.52, eyesRecess: true, lumClawd: true, paintTex: true };
  const col = tex(W, H, 'f16'), aux = tex(W, H, 'f32');
  const fb = fbo([col, aux]);
  const prog = compile(LIT_FS(opt), 'lit4');
  timed('scene', () => runTiled(prog, fb, { uSS: +(Q.get('ss') || 2) }, { uPl: plTex, uPm: pmTex }, 12));
  // Clawd alone, supersampled, with coverage: he is composited crisp over the paint
  const kc = tex(W, H, 'f16'), kx = tex(W, H, 'f16'), fk = fbo([kc, kx]);
  const kprog = compile(LIT_FS(Object.assign({}, opt, { clawdOnly: true })), 'clawd4');
  timed('clawd', () => clawdScissorRun(kprog, fk, { uSS: 4 }, { uPl: plTex, uPm: pmTex }));
  const under = timed('wrap', () => lightWrap(col, aux, 0.3, 3.5));
  let paint = under;
  if (Q.get('paint') !== '0') paint = timed('paint', () => paintStrokes(under, aux, [
    { cell: 16, len: 64, wid: 18, seed: 1 },
    { cell: 9, len: 36, wid: 11, seed: 2 },
    { cell: 5, len: 17, wid: 6, seed: 3, skip: 0.7 },
  ]));
  const comp = tex(W, H, 'f16'), fc = fbo([comp]);
  run(compile(PAINT_COMP_FS, 'pcomp'), fc, {}, { uPaint: paint, uClawd: kc });
  const bl = timed('bloom', () => bloomChain(comp, 0.8, [[4, 6], [16, 9]]));
  const fin = compile(PAINT_FINISH_FS, 'pfinish');
  run(fin, null, { uBloom1: 0.45, uBloom2: 0.65, uVig: 0.25, uGrain: 0.03, uWeave: 0.04 }, { uCol: comp, uB1: bl[0], uB2: bl[1], uClawd: kc });
  gl.finish();
  blitToCanvas();
}
const RUNGS = { 1: rung1, 2: rung2, 3: rung3, 4: rung4, 5: rung5 };
try {
  RUNGS[RUNG]();
} catch (e) {
  log('ERROR ' + e.message + '\n' + e.stack);
}
finish();
</script>
