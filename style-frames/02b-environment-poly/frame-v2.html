<body>
<canvas id="out" width="1920" height="1080"></canvas>

<script>
"use strict";
// ============================================================================
// Style frame 02b v2: "Environment showcase", low-poly revision (instrumental drop, mid-arc).
// v2: Clawd is a 3D solid (the glyph extruded, lit by the scene) at knee-to-waist height of the
// trees, and the sky has fewer, lighter, softer clouds.
// One geometry language from the foreground to the horizon: flat-shaded triangles.
// Tessellation density is capability: land Clawd has learned is subdivided finer,
// coloured and painted; untouched land stays coarse grey facets with a clean wireframe.
// Pipeline: JS builds the meshes (jittered strip triangulation, then adaptive
// crack-free 1-to-4 subdivision driven by the learned field) -> WebGL2 raster:
// cascaded shadow maps, planar water reflection, main pass (colour + aux) at 2x.
// Learned facets are painted in the fragment shader (short canvas-space strokes that
// follow each facet's slope, clipped to the facet, so edges stay crisp) -> readback ->
// screen-space stroke pass for sky and clouds only (flow-aligned ribbons sampling the
// underpainting) -> post (bloom, god rays, grade, weave, grain) -> crisp pixel Clawd
// + sparse HUD in 2D. Clawd is geometry now, rendered crisp (never painted).
// Deterministic: all randomness from seeded PRNGs / integer hashes.
// ============================================================================
const W = 1920, H = 1080;
const Q = new URLSearchParams(location.search);
const SS = +(Q.get('ss') || 2);          // supersampling factor for the scene pass
const PAINT = Q.get('paint') !== '0';
const DBG = +(Q.get('dbg') || 0);
const LOG = []; const log = (s) => LOG.push(s);
const T0 = performance.now();
const lap = (s) => log(s + ': ' + (performance.now() - T0).toFixed(0) + ' ms');

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const deg = Math.PI / 180;
const v3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
const dirFromAzEl = (az, el) => [Math.sin(az * deg) * Math.cos(el * deg), Math.sin(el * deg), Math.cos(az * deg) * Math.cos(el * deg)];
const f3 = (a) => `vec3(${a.map(x => (+x).toFixed(6)).join(',')})`;
const f1 = (x) => (+x).toFixed(6);
const clamp01 = (x) => x < 0 ? 0 : (x > 1 ? 1 : x);
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---------------------------------------------------------------- integer hashes + noise (JS side: terrain, fields)
function hashu(x) { x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; }
function h2(i, j) { return (hashu(Math.imul(i, 0x8da6b343) ^ hashu((Math.imul(j, 0xd8163841) + 0x9e3779b9) | 0)) >>> 8) / 16777216; }
function h3(i, j, k) { return (hashu(Math.imul(i, 0x8da6b343) ^ hashu(Math.imul(j, 0xd8163841) ^ hashu((Math.imul(k, 0xcb1ab31f) + 0x9e3779b9) | 0))) >>> 8) / 16777216; }
const hq = (x, z, k) => h3(Math.round(x * 512), Math.round(z * 512), k);   // hash of a position (quantised)
function gnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10), uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const g = (i, j, dx, dy) => { const a = h2(i, j) * 6.2831853; return Math.cos(a) * dx + Math.sin(a) * dy; };
  const a = g(ix, iy, fx, fy), b = g(ix + 1, iy, fx - 1, fy), c = g(ix, iy + 1, fx, fy - 1), d = g(ix + 1, iy + 1, fx - 1, fy - 1);
  const ab = a + (b - a) * ux, cd = c + (d - c) * ux;
  return ab + (cd - ab) * uy;
}
function fbmG(x, y, oct) { let s = 0, a = 0.5; for (let i = 0; i < oct; i++) { s += a * gnoise(x, y); const nx = (0.8 * x - 0.6 * y) * 2.03 + 17.3, ny = (0.6 * x + 0.8 * y) * 2.03 + 9.1; x = nx; y = ny; a *= 0.5; } return s; }
function ridged(x, y, oct) { let s = 0, a = 0.55, w = 1; for (let i = 0; i < oct; i++) { let n = 1 - Math.abs(gnoise(x, y) * 1.5); n *= n; s += a * n * w; w = clamp01(n * 1.6); const nx = (0.8 * x - 0.6 * y) * 2.02 + 11.7, ny = (0.6 * x + 0.8 * y) * 2.02 + 5.3; x = nx; y = ny; a *= 0.5; } return s; }

// ---------------------------------------------------------------- camera
const CAM = [0, 8.0, 0];
const PITCH = 3.4 * deg;
const VFOV = 32 * deg;
const FOC = (H / 2) / Math.tan(VFOV / 2);
const FWD = [0, -Math.sin(PITCH), Math.cos(PITCH)];
const UP = [0, Math.cos(PITCH), Math.sin(PITCH)];
const RIGHT = [1, 0, 0];
function project(p) { const d = v3.sub(p, CAM); const zc = v3.dot(d, FWD); return [W / 2 + FOC * v3.dot(d, RIGHT) / zc, H / 2 - FOC * v3.dot(d, UP) / zc, zc]; }

// ---------------------------------------------------------------- scene constants
const SUN = dirFromAzEl(8.5, 1.6);      // the visible low sun
const KEY = dirFromAzEl(22, 23);        // key light used on the land (painter's cheat)
const WATER = -0.3;
const CLAWD = [-4.3, 4.3, 26.0];         // Clawd's feet, on the spawn pad
const CLAWD_S = 0.075;                   // world size of one glyph pixel-width (glyph pixels are 1 wide x 2 tall)
const CLAWD_D = 4;                       // extrusion depth, in pixel-widths
const CLAWD_YAW = -8 * deg;              // turned a touch so the key-lit right-hand walls show
const CLAWD_H = 10 * CLAWD_S;            // 0.75 units: knee-to-waist height of the trees around him
const PADC = [CLAWD[0], CLAWD[2]], PADH = CLAWD[1], PADR = 0.72;
const CLAWD_ZC = v3.dot(v3.sub(CLAWD, CAM), FWD);
const CLAWD_WPX = 18 * CLAWD_S * FOC / CLAWD_ZC;   // on-screen width in pixels (about 97)
const XL = -27.0, XR = 33.0;             // episode walls

// ---------------------------------------------------------------- terrain field (JS)
// river centre line x(z): an S that leads from the foot of Clawd's knoll to the lake under the sun
const RIVER = [[-1.75, 22.0], [-0.9, 26], [1.4, 31], [4.6, 36], [6.1, 40.5], [5.6, 46], [3.9, 53], [3.0, 60], [3.2, 67.5], [5.0, 76], [8.6, 88], [13.2, 102], [16.8, 117], [18.8, 134], [19.9, 152], [21.5, 172], [26, 200], [31, 225], [36, 250]];
function riverX(z) {
  const N = RIVER.length;
  if (z <= RIVER[0][1]) return RIVER[0][0] + (z - RIVER[0][1]) * 0.2;
  if (z >= RIVER[N - 1][1]) return RIVER[N - 1][0] + (z - RIVER[N - 1][1]) * 0.2;
  let i = 0; while (RIVER[i + 1][1] < z) i++;
  const t = (z - RIVER[i][1]) / (RIVER[i + 1][1] - RIVER[i][1]);
  const p0 = RIVER[Math.max(0, i - 1)][0], p1 = RIVER[i][0], p2 = RIVER[i + 1][0], p3 = RIVER[Math.min(N - 1, i + 2)][0];
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
}
function riverDist(x, z) { const s = (riverX(z + 0.5) - riverX(z - 0.5)); return (x - riverX(z)) / Math.sqrt(1 + s * s); }
const LAKEC = [38, 262], LAKER = [40, 48];
const KNOLL = [-4.4, 26.6], KNR = [7.0, 6.2];

function Tbase(x, z) {
  const dx = riverDist(x, z);
  const wv = 11 + z * 0.09;
  const valley = 1 - Math.exp(-dx * dx / (wv * wv));
  let h = -0.1 + 5.2 * valley;
  h += 2.3 * fbmG(x * 0.045 + 3.1, z * 0.045 + 7.7, 5);
  { const u = (x + 21) / 9.5, v = (z - 50) / 9; h += 3.4 * Math.exp(-(u * u + v * v)); }       // grey hill, left
  { const u = (x - 25) / 12, v = (z - 58) / 11; h += 2.2 * Math.exp(-(u * u + v * v)); }       // broad grey swell, right
  // Clawd's knoll: a dome with a nearly flat crown for the spawn pad
  { const u = (x - KNOLL[0]) / (x > KNOLL[0] ? 8.8 : 6.4), v = (z - KNOLL[1]) / (z > KNOLL[1] ? 7.0 : 7.6); const r = Math.sqrt(u * u + v * v);
    h = mix(h, PADH - 0.035 - 2.4 * Math.max(0, r - 0.36) ** 2, sstep(1.08, 0.36, r));
    h += 0.95 * fbmG(x * 0.5 + 5.3, z * 0.5 + 1.7, 3) * sstep(0.40, 0.60, r) * (1 - sstep(0.9, 1.2, r)); }
  // river channel
  { const rw = 0.85 + z * 0.021;
    const ch = sstep(rw + 1.7, rw, Math.abs(dx));
    h = mix(h, -1.6, ch); }
  // lake
  if (z > 150) { const u = (x - LAKEC[0]) / LAKER[0], v = (z - LAKEC[1]) / LAKER[1]; h = mix(h, -2.6, sstep(1.0, 0.72, Math.sqrt(u * u + v * v))); }
  // distant ranges
  if (z > 380) {
    const az = Math.atan2(x, z);
    const rg = ridged(x * 0.0045 + 1.3, z * 0.0045 + 4.1, 5);
    const notch = 1 - 0.7 * Math.exp(-Math.pow((az - 0.148) / 0.075, 2));          // a low gap where the sun sets
    const bandB = sstep(430, 600, z) * (1 - sstep(880, 1080, z));
    h += mix(58, 18, sstep(-0.26, 0.24, az)) * rg * bandB * notch;
    { const u = (x + 560) / 400, v = (z - 1380) / 250; h += 125 * Math.exp(-(u * u + v * v)) * (0.62 + 0.5 * ridged(x * 0.0042 + 7.1, z * 0.0042 + 2.2, 5)); }
    const bandD = sstep(1150, 1350, z) * (1 - sstep(2000, 2300, z));
    h += mix(46, 14, sstep(-0.2, 0.3, az)) * rg * bandD * notch;
  }
  return h;
}

// where Clawd's learning has reached (0..1)
function learnedAt(x, z) {
  const dx = x - CLAWD[0], dz = z - CLAWD[2];
  const sx = dx * (dx > 0 ? 0.92 : 1.0), sz = dz * (dz > 0 ? 0.55 : 1.1);
  const r = Math.hypot(sx, sz);
  const ang = Math.atan2(dz, dx);
  const R = 9.0 * (1 + 0.16 * Math.sin(ang * 3 + 0.7) + 0.08 * Math.sin(ang * 7 + 2.1)) + 2.6 * fbmG(x * 0.11 + 4, z * 0.11 + 4, 3);
  const m = 1 - sstep(R - 3.5, R + 1.0, r);
  // the colour has run down the river toward the lake
  const d = Math.abs(riverDist(x, z)) + 2.6 * fbmG(x * 0.06, z * 0.06, 2);
  const lw = 1.3 + z * 0.058;
  const lobe = (1 - sstep(lw, lw * 1.9, d)) * sstep(18, 24, z) * (1 - 0.25 * sstep(90, 170, z));
  let lk = 0;
  if (z > 140) { const u = (x - LAKEC[0]) / (LAKER[0] * 1.2), v = (z - LAKEC[1]) / (LAKER[1] * 1.25); lk = (1 - sstep(0.8, 1.1, Math.hypot(u, v))) * 0.9; }
  return Math.max(m, lobe * 0.92, lk);
}

// ---------------------------------------------------------------- triangle buffer (non-indexed, per-face attributes)
// per vertex: pos f32x3 | normal i8x4 | colour u8x4 (sRGB albedo, emission) | ext u8x4 (mask, paint, frontier, rand)
class TriBuf {
  constructor(cap) { this.n = 0; this.P = null; this.alloc(cap || 4096); }
  alloc(cap) {
    const P = new Float32Array(cap * 9), N = new Int8Array(cap * 12), C = new Uint8ClampedArray(cap * 12), E = new Uint8ClampedArray(cap * 12);
    if (this.P) { P.set(this.P); N.set(this.N); C.set(this.C); E.set(this.E); }
    this.P = P; this.N = N; this.C = C; this.E = E; this.cap = cap;
  }
  // ref: a point the face normal must point away from (null: normal points up). nrm: optional shading normal override
  add(a, b, c, col, ext, ref, nrm) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz); if (l < 1e-14) return -1;
    nx /= l; ny /= l; nz /= l;
    let flip;
    if (ref) { const cx = (a[0] + b[0] + c[0]) / 3 - ref[0], cy = (a[1] + b[1] + c[1]) / 3 - ref[1], cz = (a[2] + b[2] + c[2]) / 3 - ref[2]; flip = nx * cx + ny * cy + nz * cz < 0; }
    else flip = ny < 0;
    if (flip) { nx = -nx; ny = -ny; nz = -nz; }
    if (nrm) { nx = nrm[0]; ny = nrm[1]; nz = nrm[2]; }

    const i = this.n++, o = i * 9, P = this.P;
    P[o] = a[0]; P[o + 1] = a[1]; P[o + 2] = a[2]; P[o + 3] = b[0]; P[o + 4] = b[1]; P[o + 5] = b[2]; P[o + 6] = c[0]; P[o + 7] = c[1]; P[o + 8] = c[2];
    const q = i * 12, N = this.N, C = this.C, E = this.E;
    const n0 = Math.round(nx * 127), n1 = Math.round(ny * 127), n2 = Math.round(nz * 127);
    for (let k = 0; k < 12; k += 4) {
      N[q + k] = n0; N[q + k + 1] = n1; N[q + k + 2] = n2; N[q + k + 3] = 0;
      C[q + k] = col[0] * 255; C[q + k + 1] = col[1] * 255; C[q + k + 2] = col[2] * 255; C[q + k + 3] = (col[3] || 0) * 255;
      E[q + k] = ext[0] * 255; E[q + k + 1] = ext[1] * 255; E[q + k + 2] = ext[2] * 255; E[q + k + 3] = ext[3] * 255;
    }

// ---------------------------------------------------------------- terrain mesh
// Level 0: rows of jittered vertices whose spacing grows with depth (roughly constant screen
// size), zipped into strips. Each level-0 triangle gets a level L from the learned field and is
// split 1-to-4 L times. Shared edges are split at the same (jittered) points from both sides;
// a new edge vertex only takes its true height if both neighbours are fine enough, otherwise it
// stays on the coarse edge, so the mesh never cracks.
const TSTAT = { l0: 0, facets: 0, lev: [0, 0, 0, 0] };

  let z = 13.0, k = 0, vid = 0;
  while (z < 4200) {
    const dx = S * (z + Z0), dz = dx * ASP;
    const x0 = -0.64 * z - 26, x1 = 0.76 * z + 36;
    const n = Math.max(2, Math.ceil((x1 - x0) / dx));
    const row = [];
    for (let i = 0; i <= n; i++) {
      const jx = (i > 0 && i < n) ? (h3(i, k, 1) - 0.5) * 0.72 * dx : 0;
      const jz = k > 0 ? (h3(i, k, 2) - 0.5) * 0.56 * dz : 0;
      const x = x0 + i * (x1 - x0) / n + jx, zz = z + jz;
      row.push({ p: [x, Tbase(x, zz), zz], id: vid++ });

    z += dz; k++;

  const tris = [];
  const d2 = (a, b) => (a.p[0] - b.p[0]) ** 2 + (a.p[2] - b.p[2]) ** 2;
  for (let r = 0; r < rows.length - 1; r++) {
    const A = rows[r], B = rows[r + 1];
    let i = 0, j = 0;
    while (i < A.length - 1 || j < B.length - 1) {
      let advA;
      if (i >= A.length - 1) advA = false; else if (j >= B.length - 1) advA = true;
      else advA = d2(A[i + 1], B[j]) < d2(A[i], B[j + 1]);

  const L = new Int8Array(tris.length);
  tris.forEach((t, ti) => {

    const x = s[0] + (t[0] - s[0]) * j, zz = s[2] + (t[2] - s[2]) * j;

    sub(mab, b, mbc, e, Lv, cab, cbc, Lv);

    sub(mab, mbc, mca, e, Lv, Lv, Lv, Lv);

// per-facet material: learned facets are coloured, untouched ones grey
function emitFacet(TB, a, b, c, Lv) {
  const cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3, cz = (a[2] + b[2] + c[2]) / 3;
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];

    const fm = sstep(0.48, 0.62, 0.5 + fbmG(cx * 0.02, cz * 0.02, 3)) * (1 - sstep(18, 50, cy));
    col = mix3([0.47, 0.63, 0.36], [0.24, 0.38, 0.28], fm);

    col = mix3(col, [0.96, 0.95, 0.97], sstep(sl, sl + 6, cy) * sstep(0.45, 0.7, ny));

// ground height of the actual (piecewise-linear) terrain mesh, for placing props
function heightIndex(TB, x0, x1, z0, z1, cs) {
  const nx = Math.ceil((x1 - x0) / cs), nz = Math.ceil((z1 - z0) / cs);
  const cells = new Array(nx * nz); for (let i = 0; i < cells.length; i++) cells[i] = [];
  const P = TB.P;
  for (let t = 0; t < TB.n; t++) {
    const o = t * 9;
    const mnx = Math.min(P[o], P[o + 3], P[o + 6]), mxx = Math.max(P[o], P[o + 3], P[o + 6]), mnz = Math.min(P[o + 2], P[o + 5], P[o + 8]), mxz = Math.max(P[o + 2], P[o + 5], P[o + 8]);
    if (mxx < x0 || mnx > x1 || mxz < z0 || mnz > z1) continue;
    const i0 = Math.max(0, Math.floor((mnx - x0) / cs)), i1 = Math.min(nx - 1, Math.floor((mxx - x0) / cs));
    const j0 = Math.max(0, Math.floor((mnz - z0) / cs)), j1 = Math.min(nz - 1, Math.floor((mxz - z0) / cs));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) cells[j * nx + i].push(t);

  return (x, z) => {
    const i = Math.floor((x - x0) / cs), j = Math.floor((z - z0) / cs);
    if (i >= 0 && j >= 0 && i < nx && j < nz) {
      for (const t of cells[j * nx + i]) {
        const o = t * 9;
        const ax = P[o], az = P[o + 2], bx = P[o + 3], bz = P[o + 5], cx = P[o + 6], cz = P[o + 8];
        const den = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);

        const w0 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / den, w1 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / den, w2 = 1 - w0 - w1;
        if (w0 >= -1e-6 && w1 >= -1e-6 && w2 >= -1e-6) return w0 * P[o + 1] + w1 * P[o + 4] + w2 * P[o + 7];
      }
    }
    return Tbase(x, z);
  };
}

// ---------------------------------------------------------------- water mesh (flat, faceted shading normals)
function buildWater() {
  const WB = new TriBuf(1 << 14);
  const rows = [];
  let z = 15.0, k = 0;
  while (z < 360) {
    const dx = 0.032 * (z + 6), dz = dx * 1.15;
    const x0 = -12, x1 = 22 + 0.3 * z;
    const n = Math.max(2, Math.ceil((x1 - x0) / dx));
    const row = [];
    for (let i = 0; i <= n; i++) {
      const jx = (i > 0 && i < n) ? (h3(i, k, 21) - 0.5) * 0.7 * dx : 0;
      const jz = k > 0 ? (h3(i, k, 22) - 0.5) * 0.5 * dz : 0;
      const x = x0 + i * (x1 - x0) / n + jx, zz = z + jz;
      row.push([x, WATER, zz, Tbase(x, zz)]);
    }
    rows.push(row); z += dz; k++;
  }
  const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[2] - b[2]) ** 2;
  const emit = (a, b, c) => {
    if (Math.min(a[3], b[3], c[3]) > WATER + 0.25) return;
    const cx = (a[0] + b[0] + c[0]) / 3, cz = (a[2] + b[2] + c[2]) / 3;
    const depth = Math.max(0, WATER - Tbase(cx, cz));
    const m = learnedAt(cx, cz);
    const th = hq(cx, cz, 31), rnd = hq(cx, cz, 32);
    const lt = sstep(0.0, 0.12, m - (th * 0.5 + 0.1));
    // gentle wave field + per-facet jitter: each facet catches the light differently
    const wv = Math.sin(cz * 0.9 + 1.7 * Math.sin(cx * 0.35)) * 0.035;
    const tx = (hq(cx, cz, 33) - 0.5) * 0.13 + wv * 0.4, tz = (hq(cx, cz, 34) - 0.5) * 0.10 + wv;
    const nrm = v3.norm([tx, 1, tz]);
    let body = mix3([0.50, 0.62, 0.56], [0.13, 0.26, 0.36], sstep(0.15, 2.0, depth));
    const gv = 0.36; body = mix3([gv, gv, gv + 0.02], body, lt);
    WB.add(a, b, c, [body[0], body[1], body[2], clamp01(depth / 3)], [Math.max(lt, 0.0), mix(0.3, 0.9, lt), 0, rnd], null, nrm);
  };
  for (let r = 0; r < rows.length - 1; r++) {
    const A = rows[r], B = rows[r + 1];
    let i = 0, j = 0;
    while (i < A.length - 1 || j < B.length - 1) {
      let advA;
      if (i >= A.length - 1) advA = false; else if (j >= B.length - 1) advA = true;
      else advA = d2(A[i + 1], B[j]) < d2(A[i], B[j + 1]);
      if (advA) { emit(A[i], A[i + 1], B[j]); i++; } else { emit(A[i], B[j + 1], B[j]); j++; }
    }
  }
  return WB;
}

// ---------------------------------------------------------------- low-poly primitives
const ICOS = (() => {

  const out = [{ V, F }];

    const V2 = V.slice(), F2 = [], cache = new Map();

// T(a, b, c, col, em, learned, paint, ref) appends one face
function lpSphere(T, c, r, sub, col, em, Ln, Pn, jit, rng, xform) {

function lpPrism(T, a, b, r, n, col, em, Ln, Pn, capA, capB, twist, rb) {

// Clawd in 3D: the 18x5 glyph extruded into a solid
const CLAWD_ROWS = [
  '...############...',
  '...##.######.##...',
  '.################.',
  '...############...',
  '....#.#....#.#....',
];
// Pixels are 1 wide x 2 tall and CLAWD_D widths deep. Hard edges, no bevels; the eye holes are punched
// through. Each wall quad carries per-vertex ambient occlusion: a corner is concave (dark) when the
// diagonal cell on the wall's open side is filled (under the arms, above the legs, inside the eyes).
function buildClawd3D() {
  const B = new TriBuf(1024), AO = [];
  const on = (c, r) => c >= 0 && c < 18 && r >= 0 && r < 5 && CLAWD_ROWS[r][c] === '#';
  const s = CLAWD_S, hd = CLAWD_D / 2, cy = Math.cos(CLAWD_YAW), sy = Math.sin(CLAWD_YAW);
  // local X across the glyph (left to right seen from the front), Y up, Z depth (front face at -hd)
  const P = (X, Y, Z) => [CLAWD[0] + (X * cy - Z * sy) * s, CLAWD[1] + Y * s, CLAWD[2] + (X * sy + Z * cy) * s];
  const N = (X, Y, Z) => [X * cy - Z * sy, Y, X * sy + Z * cy];
  const col = [0xD9 / 255, 0x77 / 255, 0x57 / 255, 0], ext = [1, 0, 0, 0.5];
  const quad = (a, b, c, d, n, ao) => {
    if (B.add(a, b, c, col, ext, null, n) >= 0) AO.push(ao[0], ao[1], ao[2]);
    if (B.add(a, c, d, col, ext, null, n) >= 0) AO.push(ao[0], ao[2], ao[3]);
  };
  const K = 0.42;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 18; c++) {
    if (!on(c, r)) continue;
    const X0 = c - 9, X1 = c - 8, Y0 = (4 - r) * 2, Y1 = Y0 + 2;
    quad(P(X0, Y0, -hd), P(X1, Y0, -hd), P(X1, Y1, -hd), P(X0, Y1, -hd), N(0, 0, -1), [1, 1, 1, 1]);
    quad(P(X0, Y0, hd), P(X0, Y1, hd), P(X1, Y1, hd), P(X1, Y0, hd), N(0, 0, 1), [1, 1, 1, 1]);
    if (!on(c + 1, r)) { const t = on(c + 1, r - 1) ? K : 1, b = on(c + 1, r + 1) ? K : 1;
      quad(P(X1, Y0, -hd), P(X1, Y0, hd), P(X1, Y1, hd), P(X1, Y1, -hd), N(1, 0, 0), [b, b, t, t]); }
    if (!on(c - 1, r)) { const t = on(c - 1, r - 1) ? K : 1, b = on(c - 1, r + 1) ? K : 1;
      quad(P(X0, Y0, hd), P(X0, Y0, -hd), P(X0, Y1, -hd), P(X0, Y1, hd), N(-1, 0, 0), [b, b, t, t]); }
    if (!on(c, r - 1)) { const l = on(c - 1, r - 1) ? K : 1, rr = on(c + 1, r - 1) ? K : 1;
      quad(P(X0, Y1, -hd), P(X1, Y1, -hd), P(X1, Y1, hd), P(X0, Y1, hd), N(0, 1, 0), [l, rr, rr, l]); }
    if (!on(c, r + 1)) { const l = on(c - 1, r + 1) ? K : 1, rr = on(c + 1, r + 1) ? K : 1;
      quad(P(X0, Y0, hd), P(X1, Y0, hd), P(X1, Y0, -hd), P(X0, Y0, -hd), N(0, -1, 0), [l, rr, rr, l]); }
  }
  return { B, AO: new Float32Array(AO) };
}

// ---------------------------------------------------------------- clouds: faceted cumulus far away
function buildClouds() {
  const CB = new TriBuf(1 << 15);
  const R = mulberry32(7);
  const T = (a, b, c, col, em, Ln, Pn, ref) => CB.add(a, b, c, [1, 1, 1, 0], [0.72, 0.85, 0, R()], ref);
  // one puff: angular position (deg), angular radius (deg), depth offset (deg), flattened base elevation (deg)
  const puff = (az, el, r, zc, D, base, sub, stretch, squash) => {
    const dir = dirFromAzEl(az, el), dist = D * (1 - zc * deg * 0.9);
    const c = v3.add(CAM, v3.mul(dir, dist));
    const rw = r * deg * dist;
    const baseY = CAM[1] + dist * Math.tan(base * deg);
    const eaz = [Math.cos(az * deg), 0, -Math.sin(az * deg)];
    lpSphere(T, c, rw, sub, null, 0, 0, 0, 0.12, R, (p) => {
      let q = p;
      if (stretch) { const d = v3.sub(p, c); const a = v3.dot(d, eaz); q = v3.add(p, v3.mul(eaz, a * (stretch - 1))); q[1] = c[1] + (q[1] - c[1]) * (squash || 0.32); }
      if (q[1] < baseY) q = [q[0], baseY + (R() - 0.5) * rw * 0.03, q[2]];
      return q;
    });
  };
  const cumulus = (azC, base, w, h, n, lean, D, sub) => {
    for (let i = 0; i < n; i++) {
      const v = Math.pow(R(), 1.15);
      const half = 0.5 * w * Math.sqrt(Math.max(0.04, 1 - Math.pow(v, 1.7)));
      const u = R() * 2 - 1;
      const r = w * (0.075 + 0.11 * R()) * (1.12 - 0.5 * v);
      const az = azC + u * half * 0.82 + lean * v * h;
      const el = base + r * 0.55 + v * h;
      const zc = w * 0.34 * Math.sqrt(Math.max(0, 1 - u * u)) * (1 - 0.35 * v) + r * 0.35 * R();
      puff(az, el, r * 1.15, zc, D, base, r > 1.0 ? (sub || 1) : 1);
    }
  };
  cumulus(25, 2.5, 11, 3.4, 15, -0.05, 5200, 2);   // a light cumulus bank low on the right (v1 had a heavy tower)
  cumulus(-24, 3.2, 8.5, 2.4, 10, 0.08, 5000, 2);  // companion over the snow massif
  cumulus(-6, 6.3, 3.6, 1.0, 6, 0.0, 5000, 1);     // one small fair-weather puff
  cumulus(-43, 2.0, 6, 1.6, 7, 0.0, 5000, 1);
  cumulus(41, 1.6, 5, 1.4, 6, 0.0, 5000, 1);
  // high, thin faceted cirrus: a light presence in the upper right, no weight
  [[17, 9.4, 1.4, 6.5], [27, 11.4, 1.2, 5.5], [34, 8.4, 1.0, 5.0], [8, 12.4, 0.9, 5.5]].forEach(([az, el, r, st]) => puff(az, el, r, 0, 5600, el - 5, 1, st, 0.16));
  // thin stratus bands low across the sun
  [[-6, 1.05, 1.1, 5.0], [6, 1.9, 0.8, 5.5], [15, 1.3, 0.9, 4.5], [-18, 1.6, 1.0, 4.0], [25, 2.2, 0.8, 4.0]].forEach(([az, el, r, st]) => puff(az, el, r, 0, 4800, el - 5, 1, st));
  return CB;
}

float hash21(ivec2 p){ return float(hashu(uint(p.x)*0x8da6b343u ^ hashu(uint(p.y)*0xd8163841u + 0x9e3779b9u)) >> 8u) * (1.0/16777216.0); }

vec2 skyQ(vec3 rd){ return vec2(degrees(atan(rd.x, rd.z)), degrees(asin(clamp(rd.y, -1.0, 1.0)))); }
vec3 skyGrad(vec3 rd, bool tight){

float pcf(sampler2DShadow s, vec3 uvz, float tx){

float blobShadow(vec2 q, vec2 c, vec2 r){ vec2 d = (q - c)/r; return 1.0 - smoothstep(0.55, 1.0, length(d)); }

vec3 lightSurf(vec3 p, vec3 n, vec3 alb, float ao, float sh){
  float dif = max(dot(n, KEY), 0.0) * mix(0.10, 1.0, sh);
  float sky = 0.55 + 0.45*n.y;
  float bnc = clamp(0.5 - 0.5*n.y, 0.0, 1.0);
  vec3 c = alb * (KEYCOL*dif + SKYCOL*sky*ao + BNCCOL*bnc*ao + FILLCOL*max(dot(n, FILLDIR), 0.0)*ao);

  c += alb * CLAWDCOL * gl * 1.8;
  c += alb * vec3(1.0, 0.82, 0.55) * 0.40 * exp(-dl*dl*0.10) * max(n.y, 0.0) * (0.25 + 0.75*sh);

// painted facet: short parallel strokes in canvas space, oriented along the facet's slope (water: horizontal).
// Facet edges stay crisp, so learned land is painted without leaving the low-poly language.
float hsh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7)))*43758.5453); }
vec2 toScr(vec3 q){ vec3 d = q - uCam; float z = dot(d, uFwd); return vec2(dot(d, uRight), dot(d, uUp))*uF/z; }
vec3 paintFacet(vec3 base, vec3 p, vec3 n, float rnd, float t, float amt, bool water){
  vec2 dir2 = vec2(1.0, 0.0);
  if (!water) {
    vec3 dh = vec3(0.0, 1.0, 0.0) - n*n.y; float sl = length(dh);
    float a = rnd*6.2831853;
    vec3 fd = vec3(cos(a), 0.0, sin(a)); fd = fd - n*dot(fd, n);
    vec3 d3 = normalize(mix(normalize(fd + 1e-5), dh/max(sl, 1e-4), smoothstep(0.10, 0.35, sl)));
    vec2 s = toScr(p + d3*0.02*t) - toScr(p);
    if (length(s) > 1e-6) dir2 = normalize(s);

  vec2 pr = vec2(-dir2.y, dir2.x);
  float u = dot(fc, dir2), v = dot(fc, pr);
  vec3 c = base;
  for (int k = 0; k < 2; k++) {
    float w = k == 0 ? 5.5 : 3.4;
    float vv = v/w + rnd*13.0 + float(k)*0.37;
    float row = floor(vv), fr = fract(vv);
    float off = hsh(vec3(row, rnd*91.0, float(k)))*60.0;
    float Ls = mix(14.0, 40.0, hsh(vec3(row, 3.1, rnd*17.0 + float(k))));
    float su = (u + off)/Ls;
    float seg = floor(su), f = fract(su);
    float hs = hsh(vec3(row, seg, rnd*57.0 + float(k)*7.0));
    float body = smoothstep(0.0, 0.14, f) * (1.0 - smoothstep(0.72, 1.0, f)) * smoothstep(0.0, 0.3, fr) * (1.0 - smoothstep(0.7, 1.0, fr));
    float val = (hs - 0.5)*0.26;
    vec3 tint = mix(vec3(1.06, 1.0, 0.91), vec3(0.93, 0.99, 1.08), hsh(vec3(seg, row, 5.0 + float(k))));
    float bristle = vnoise(vec2(u*0.10, v*1.4 + hs*40.0)) - 0.5;
    vec3 sc = base*(1.0 + val + bristle*0.16)*tint;
    c = mix(c, sc, body*amt*(k == 0 ? 0.9 : 0.55));
  }
  return c;
}
float edgeLine(float w){ vec3 d = fwidth(vBary); vec3 a = smoothstep(d*(w - 0.6), d*(w + 0.6), vBary); return 1.0 - min(min(a.x, a.y), a.z); }

vec3 cloudLit(vec3 n, float rnd, vec3 dc){
  float az = atan(dc.x, dc.z), el = asin(clamp(dc.y, -1.0, 1.0));
  float saz = atan(SUN.x, SUN.z), sel = asin(SUN.y);
  vec2 ts = vec2(saz - az, sel - el);
  float dsun = degrees(length(ts));
  vec3 eaz = vec3(cos(az), 0.0, -sin(az));
  vec3 eel = vec3(-sin(az)*sin(el), cos(el), -cos(az)*sin(el));
  vec3 L = normalize(normalize(ts.x*eaz + ts.y*eel) + 0.15*dc);
  float nl = dot(n, L);
  float facet = smoothstep(-0.70, 0.90, nl);        // wide ramp: neighbouring facets differ gently
  float pos = clamp(exp(-dsun*0.10)*1.25 + (1.0 - smoothstep(3.0, 9.0, degrees(el)))*0.30, 0.0, 1.0);
  float lit = clamp(facet*0.75 + pos*0.50 - 0.22, 0.0, 1.0);

  vec3 topC = vec3(0.23, 0.26, 0.55);
  vec3 litC = vec3(1.36, 0.80, 0.47);
  vec3 underC = vec3(0.92, 0.48, 0.44);
  vec3 c = mix(shadowC, topC, up*0.8);
  c = mix(c, underC, dn*0.7);
  c = mix(c, litC, lit);
  float sunProx = exp(-dsun*0.12);
  float rim = pow(1.0 - abs(dot(n, -dc)), 2.0);
  c += vec3(1.5, 1.05, 0.70) * rim * smoothstep(0.1, 0.7, nl) * (0.08 + 1.6*sunProx);

  c = mix(c, c*vec3(0.88, 0.92, 1.08), smoothstep(6.0, 16.0, degrees(el))*0.6);
  return c * (0.955 + 0.09*rnd);

const STROKE_VS = `#version 300 es
layout(location=0) in vec2 aPos; layout(location=1) in vec2 aUV; layout(location=2) in vec2 aSA; layout(location=3) in vec4 aCol;
out vec2 vUV; out float vSeed; out float vA; out vec4 vCol;
void main(){ vUV = aUV; vSeed = aSA.x; vA = aSA.y; vCol = aCol; vec2 c = aPos/vec2(${W}.0, ${H}.0)*2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); }`;
const STROKE_FS = `#version 300 es
precision highp float;
in vec2 vUV; in float vSeed; in float vA; in vec4 vCol;
out vec4 o;
float h1(float x){ return fract(sin(x*127.1 + 3.7)*43758.5453); }
float n1(float x){ float i = floor(x), f = fract(x); float u = f*f*(3.0-2.0*f); return mix(h1(i), h1(i+1.0), u); }
void main(){
  float u = vUV.x, v = vUV.y;

  float head = smoothstep(0.0, 0.12, u);
  float tail = 1.0 - smoothstep(0.62, 1.0, u)*0.9;
  float s = vSeed*91.0;

  float dry = smoothstep(0.12, 0.5, n1(v*9.0 + s*2.3)*0.8 + 1.0 - u*0.95);
  float a = clamp(vA*side*head*tail*bristle*dry, 0.0, 1.0);
  vec3 c = vCol.rgb * (0.95 + 0.10*br2);
  o = vec4(c*a, a);
}`;

const RAYS_FS = `#version 300 es
precision highp float; uniform sampler2D uT; uniform sampler2D uAux; uniform vec2 uSun; uniform vec2 uInv; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy*uInv; vec2 stepv = (uSun - uv)/64.0*0.95; vec3 acc = vec3(0.0); float decay = 1.0; vec2 p = uv;
  for (int i = 0; i < 64; i++) { p += stepv; float sky = 1.0 - step(0.05, texture(uAux, p).b); vec3 c = texture(uT, p).rgb;
    float l = dot(c, vec3(0.3,0.59,0.11)); acc += c*smoothstep(0.70, 0.97, l)*sky*decay; decay *= 0.972; }

const COPY_FS = `#version 300 es
precision highp float; uniform sampler2D uT; out vec4 o;
void main(){ o = texelFetch(uT, ivec2(gl_FragCoord.xy), 0); }`;
const BRIGHT_FS = `#version 300 es
precision highp float; uniform sampler2D uT; uniform vec2 uInv; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy*uInv; vec3 c = texture(uT, uv).rgb; float l = dot(c, vec3(0.3,0.59,0.11));

const BLUR_FS = `#version 300 es

uniform sampler2D uCrisp, uPaint, uAux, uB1, uB2, uB3, uRays;

  pass(pBright, b1, tPaint); blur(b1, b1t, 1.0);
  pass(pBright, b2, b1.t); blur(b2, b2t, 1.5); blur(b2, b2t, 1.5);
  pass(pBright, b3, b2.t); blur(b3, b3t, 2.0); blur(b3, b3t, 2.0);
  const sunScr = [W / 2 + FOC * v3.dot(SUN, RIGHT) / v3.dot(SUN, FWD), H / 2 - FOC * v3.dot(SUN, UP) / v3.dot(SUN, FWD)];
  log('sun at ' + sunScr.map(v => v.toFixed(0)).join(',') + '  clawd at ' + cl.slice(0, 2).map(v => v.toFixed(0)).join(','));
  const rays = mk(W / 2, H / 2);
  const pRays = prog(gl, VS_FULL, RAYS_FS);
  pass(pRays, rays, tPaint, p => { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tX1); gl.uniform1i(U(gl, p, 'uAux'), 1); gl.uniform2f(U(gl, p, 'uSun'), sunScr[0] / W, 1 - sunScr[1] / H); });
  const pFinal = prog(gl, VS_FULL, finalFS(cl));
  gl.bindFramebuffer(gl.FRAMEBUFFER, fComb); gl.viewport(0, 0, W, H); gl.useProgram(pFinal);
  const bindT = (unit, t, name) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(U(gl, pFinal, name), unit); };
  bindT(0, tC1, 'uCrisp'); bindT(1, tPaint, 'uPaint'); bindT(2, tX1, 'uAux'); bindT(3, b1.t, 'uB1'); bindT(4, b2.t, 'uB2'); bindT(5, b3.t, 'uB3'); bindT(6, rays.t, 'uRays');
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const fin = readRGBA8(gl, W, H, 0);
  lap('post');

  // --- 2D: final image, motes, sparse HUD (Clawd is in the 3D scene now)
  const out = document.getElementById('out');
  const ctx = out.getContext('2d');
  const id = ctx.createImageData(W, H); id.data.set(fin); ctx.putImageData(id, 0, 0);
  drawMotes(ctx, cl, aux);
  drawHUD(ctx);
  if (Q.get('dump') === '1') document.getElementById('png').textContent = out.toDataURL('image/png');
  lap('done');
}

function drawMotes(ctx, cl, aux) {
  const R = mulberry32(777);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  let n = 0, tries = 0;
  while (n < 70 && tries < 5000) {
    tries++;
    const x = cl[0] + (R() - 0.5) * 1100, y = cl[1] - 40 + (R() - 0.62) * 420;
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    if (Math.abs(x - cl[0]) < CLAWD_WPX * 0.5 + 10 && Math.abs(y - cl[1]) < CLAWD_WPX * 0.28 + 10) continue;   // never over Clawd
    const i = ((y | 0) * W + (x | 0)) * 4;
    const learned = aux[i] / 255;
    if (R() > learned * 0.9 + 0.04) continue;
    const d = Math.hypot((x - cl[0]) / 1.4, y - cl[1]);
    if (R() < d / 700) continue;
    const r = 1.1 + 2.6 * Math.pow(R(), 2.0);
    const a = 0.25 + 0.45 * R();
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
    g.addColorStop(0, `rgba(255,240,208,${a})`);
    g.addColorStop(0.35, `rgba(255,222,170,${a * 0.45})`);
    g.addColorStop(1, 'rgba(255,210,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
    n++;
  }
  ctx.restore();
}
function drawHUD(ctx) {
  ctx.save();
  ctx.font = '500 15px Consolas, "Cascadia Mono", "Courier New", monospace';
  ctx.textBaseline = 'top';
  try { ctx.letterSpacing = '1.5px'; } catch (e) { }
  const rows = [['EPISODE', '048 213'], ['REWARD', '+0.847'], ['STEP', '1 204 / 2 000']];
  const x = 64, y = 56;
  ctx.fillStyle = 'rgba(245,240,232,0.50)';
  rows.forEach((r, i) => ctx.fillText(r[0], x, y + i * 22));
  ctx.fillStyle = 'rgba(245,240,232,0.86)';
  rows.forEach((r, i) => ctx.fillText(r[1], x + 96, y + i * 22));
  ctx.restore();
}

try { main(); } catch (e) {
  const el = document.getElementById('log'); el.style.display = 'block';
  LOG.push('ERROR: ' + (e && e.stack ? e.stack : e));
}
document.getElementById('log').textContent = LOG.join('\n');
</script>
