<!doctype html>
<html><head><meta charset="utf-8"><title>08 anime cel - the harness</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="out"></canvas>
<script>
'use strict';
/* Shelter MV style frame 08: 2D anime cel. Scene: "The harness".
   Pipeline (all Canvas2D, deterministic):
   1. painted background: gradients, puff-built cumulus, skyline, window, bench, monitor;
      brush-dab texture sampled from the underpainting; slight depth-of-field blur.
   2. cel layers (researchers, harness): Catmull-Rom spline shapes, flat base colour,
      one hard shadow tone, highlight shapes, ink lines (tapered brush polygons for detail).
   3. compositing ("satsuei"): light gradients masked to each cel (para), hard rim lights
      from silhouette offsets, light shaft, dust, bloom/diffusion, grade, grain.
   4. Clawd stamped last on integer cells, exact #D97757. */
const T0 = performance.now();
const Q = new URLSearchParams(location.search);
const VW = +(Q.get('w') || 1920), VH = +(Q.get('h') || 1080);
const VIEW = { x: +(Q.get('vx') || 0), y: +(Q.get('vy') || 0), s: +(Q.get('vs') || 1) };
const PX = VIEW.s;
const NOPOST = Q.has('nopost');
const out = document.getElementById('out'); out.width = VW; out.height = VH;
const TIM = [];
function tick(n) { TIM.push(n + ' ' + (performance.now() - T0).toFixed(0)); }

// ------------------------------------------------------------------ utilities
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const D2R = Math.PI / 180;
function mk(w = VW, h = VH) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function VT(g) { g.setTransform(PX, 0, 0, PX, -VIEW.x * PX, -VIEW.y * PX); }
function ID(g) { g.setTransform(1, 0, 0, 1, 0, 0); }
function ctxOf(c) { const g = c.getContext('2d'); VT(g); g.lineJoin = 'round'; g.lineCap = 'round'; return g; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function big(g, style) { g.fillStyle = style; g.fillRect(-5000, -5000, 12000, 12000); }

// Catmull-Rom through points; a point [x,y,1] is a sharp corner.
function tangents(pts, closed, k) {
  const n = pts.length, T = [];
  for (let i = 0; i < n; i++) {
    if (pts[i][2]) { T.push([0, 0]); continue; }
    let a, b;
    if (closed) { a = pts[(i - 1 + n) % n]; b = pts[(i + 1) % n]; }
    else { a = pts[Math.max(0, i - 1)]; b = pts[Math.min(n - 1, i + 1)]; }
    T.push([(b[0] - a[0]) * k / 6, (b[1] - a[1]) * k / 6]);
  }
  return T;
}
function spl(pts, closed = true, k = 1, path = new Path2D()) {
  const n = pts.length, T = tangents(pts, closed, k);
  path.moveTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const j = (i + 1) % n, p = pts[i], q = pts[j];
    path.bezierCurveTo(p[0] + T[i][0], p[1] + T[i][1], q[0] - T[j][0], q[1] - T[j][1], q[0], q[1]);
  }
  if (closed) path.closePath();
  return path;
}
function splPts(pts, closed = false, k = 1, per = 14) {
  const n = pts.length, T = tangents(pts, closed, k), o = [];
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const j = (i + 1) % n, p = pts[i], q = pts[j];
    const c1 = [p[0] + T[i][0], p[1] + T[i][1]], c2 = [q[0] - T[j][0], q[1] - T[j][1]];
    for (let s = 0; s < per; s++) {
      const t = s / per, u = 1 - t;
      o.push([u * u * u * p[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * q[0],
              u * u * u * p[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * q[1]]);
    }
  }
  if (!closed) o.push([pts[n - 1][0], pts[n - 1][1]]); else o.push([pts[0][0], pts[0][1]]);
  return o;
}
// polygon around a polyline with width profile wf(u)
function strokePoly(P, wf) {
  const n = P.length, L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const tot = L[n - 1] || 1, lf = [], rt = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = wf(L[i] / tot) / 2;
    lf.push([P[i][0] - dy * w, P[i][1] + dx * w]); rt.push([P[i][0] + dy * w, P[i][1] - dx * w]);
  }
  const path = new Path2D(); path.moveTo(lf[0][0], lf[0][1]);
  for (let i = 1; i < n; i++) path.lineTo(lf[i][0], lf[i][1]);
  for (let i = n - 1; i >= 0; i--) path.lineTo(rt[i][0], rt[i][1]);
  path.closePath(); return path;
}
const taperF = (w, a = 0.3, b = 0.3, m = 0.12) => u => w * (u < a ? m + (1 - m) * Math.sin(u / a * Math.PI / 2) : u > 1 - b ? m + (1 - m) * Math.sin((1 - u) / b * Math.PI / 2) : 1);
function brush(g, pts, w, col, a = 0.3, b = 0.3, m = 0.12) { g.fillStyle = col; g.fill(strokePoly(splPts(pts, false, 1, 12), taperF(w, a, b, m))); }
function brushF(g, pts, wf, col) { g.fillStyle = col; g.fill(strokePoly(splPts(pts, false, 1, 12), wf)); }

// cel helpers
function fillP(g, p, c) { g.fillStyle = c; g.fill(p); }
function inkP(g, p, w, c) { g.lineWidth = w; g.strokeStyle = c; g.stroke(p); }
function clipFill(g, clip, shape, c) { g.save(); g.clip(clip); g.fillStyle = c; g.fill(shape); g.restore(); }
// the part of `path` NOT covered by itself shifted by (dx,dy): a form-following crescent
function crescent(g, path, dx, dy, c) {
  g.save(); g.clip(path);
  const p = new Path2D(); p.rect(-6000, -6000, 14000, 14000);
  p.addPath(path, new DOMMatrix([1, 0, 0, 1, dx, dy]));
  g.clip(p, 'evenodd');
  g.fillStyle = c; g.fill(path);
  g.restore();
}
// same, for shapes made of overlapping subpaths (unions): done with compositing on a scratch canvas
let TMP = null;
function crescentL(g, shape, dx, dy, c) {
  if (!TMP) TMP = mk();
  const tg = TMP.getContext('2d');
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-over'; tg.clearRect(0, 0, VW, VH);
  tg.setTransform(g.getTransform());
  tg.fillStyle = c; tg.fill(shape);
  tg.globalCompositeOperation = 'destination-out'; tg.translate(dx, dy); tg.fill(shape);
  tg.globalCompositeOperation = 'source-over';
  g.save(); ID(g); g.drawImage(TMP, 0, 0); g.restore();
}
function ell(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); return p; }

// compositing helpers (layer-level)
function paraOnto(layer, paint, op = 'screen', alpha = 1) {
  const t = mk(), tg = t.getContext('2d'); VT(tg); paint(tg);
  ID(tg); tg.globalCompositeOperation = 'destination-in'; tg.drawImage(layer, 0, 0);
  const lg = layer.getContext('2d'); lg.save(); ID(lg); lg.globalCompositeOperation = op; lg.globalAlpha = alpha; lg.drawImage(t, 0, 0); lg.restore();
}
function rimOnto(layer, dx, dy, paint, alpha = 1, clipFn = null) {
  const t = mk(), tg = t.getContext('2d');
  tg.drawImage(layer, 0, 0);
  tg.globalCompositeOperation = 'destination-out'; tg.drawImage(layer, dx * PX, dy * PX);
  tg.globalCompositeOperation = 'source-in'; VT(tg); paint(tg);
  if (clipFn) { tg.globalCompositeOperation = 'destination-in'; clipFn(tg); }
  const lg = layer.getContext('2d'); lg.save(); ID(lg); lg.globalCompositeOperation = 'source-atop'; lg.globalAlpha = alpha; lg.drawImage(t, 0, 0); lg.restore();
}
function radial(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) gr.addColorStop(o, c); return gr; }

// ------------------------------------------------------------------ palette
// early phase: lavender-slate greys; Clawd's orange is the only chroma
const COL = {
  ink: '#1e1b27',
  wall: '#2a2836', wallDk: '#1b1a24',
  skyTop: '#3b3c57', skyMid: '#6a6784', skyLow: '#aa9fab', skyHor: '#e4d4c9',
  cloudHi: '#eee2dc', cloudMid: '#a8a1b6', cloudSh: '#827c96',
  frame: '#191820', frameHi: '#5d5a6d',
  skin: '#e2cfca', skinSh: '#ae97a6', skinLine: '#6d4c59', blush: '#e9a09a',
  hairA: '#393c50', hairASh: '#27293a', hairAHi: '#5e6584', hairLine: '#17161f',
  coat: '#9d9ab1', coatSh: '#6c6886', coatLine: '#322f3e',
  shirt: '#47465a', shirtSh: '#333244',
  sweater: '#4b4d62', sweaterSh: '#343549', hairB: '#2d2c38', hairBSh: '#1e1d27', hairBHi: '#4e4d63',
  rib: '#cfcfdc', ribSh: '#8e8da6', joint: '#72718b', jointSh: '#55546a',
  mug: '#dad8e0', mugSh: '#a3a1b4',
  warm: '#ffb690', clawd: '#D97757', sun: '#fff0dc', cool: '#aacddc', rimW: '#fff7ec',
};

// ------------------------------------------------------------------ scene constants
const GLYPH = ['...############...', '...##.######.##...', '.################.', '...############...', '....#.#....#.#....'];
const CU = 8, CLW = 18 * CU, CLH = 10 * CU;       // Clawd pixel: CU wide, 2*CU tall
const CX = 960, CFEET = 726;
const CL0 = [CX - CLW / 2, CFEET - CLH];
const CG = [CX, CFEET - CLH * 0.5];               // glow centre
const SILL = 590, BENCH = 700;
const HARN = { cx: 960, cy: 731, HR: 246, k: 0.17 };
const RIB_PROF = [[0, 102], [0.3, 150], [0.62, 146], [0.88, 100], [1.0, 64]];
function ribCtrl(th) { const c = Math.cos(th), s = Math.sin(th); return RIB_PROF.map(([h, r]) => [HARN.cx + r * c, HARN.cy + r * HARN.k * s - h * HARN.HR]); }
const RIBS_BACK = [235, 305, 185, 355].map(d => d * D2R);
const RIBS_FRONT = [145, 35].map(d => d * D2R);
// the stylus touches the lower joint of the front-left rib
const TARGET = (() => { const p = ribCtrl(145 * D2R)[1]; return [p[0] - 15, p[1] + 1]; })();
const STY = { back: [22, -60], tip: [178, -14] };
const HAND = (() => { const a = -34 * D2R, lx = STY.tip[0], ly = STY.tip[1]; return { a, x: TARGET[0] - (lx * Math.cos(a) - ly * Math.sin(a)), y: TARGET[1] - (lx * Math.sin(a) + ly * Math.cos(a)) }; })();
const HEAD_A = { x: 585, y: 468, a: 16 * D2R };
const HEAD_B = { x: 1702, y: 338, a: -10 * D2R, s: 0.62 };
const MON = { x: 1300, y: 468, w: 236, h: 152 };

// ================================================================== BACKGROUND
function cumulus(g, seed, x, base, w, h) {
  const r = mulberry32(seed), puffs = [];
  const n = Math.round(9 + w / 24);
  for (let i = 0; i < n; i++) {
    const t = clamp(i / (n - 1) + (r() - 0.5) * 0.05, 0, 1);
    const dome = Math.pow(Math.sin(t * Math.PI), 0.7);
    const rad = h * (0.13 + 0.25 * dome) * (0.75 + 0.5 * r());
    puffs.push([x + (t - 0.5) * w, base - rad * 0.65 - dome * h * (0.42 + 0.22 * r()), rad]);
  }
  for (let i = 0; i < n * 0.7; i++) {
    const t = r(), dome = Math.sin(t * Math.PI), rad = h * (0.09 + 0.12 * r());
    puffs.push([x + (t - 0.5) * w * 0.95, base - rad * 0.45 - dome * h * 0.14, rad]);
  }
  const shape = new Path2D();
  for (const [px, py, pr] of puffs) { shape.moveTo(px + pr, py); shape.arc(px, py, pr, 0, Math.PI * 2); }
  g.save(); g.beginPath(); g.rect(x - w, base - h * 3, w * 2, h * 3); g.clip();
  // whole-cloud shading: gradient body, lit band on the sun-facing (left) edges, shade band right
  const gr = g.createLinearGradient(0, base - h * 1.15, 0, base);
  gr.addColorStop(0, COL.cloudHi); gr.addColorStop(0.5, COL.cloudMid); gr.addColorStop(1, COL.cloudSh);
  g.fillStyle = gr; g.fill(shape);
  crescentL(g, shape, h * 0.09, -h * 0.03, rgba(COL.cloudHi, 0.85));
  crescentL(g, shape, -h * 0.16, h * 0.04, rgba(COL.cloudSh, 0.75));
  g.restore();
}
function paintSky(g) {
  const gr = g.createLinearGradient(0, 20, 0, SILL);
  gr.addColorStop(0, COL.skyTop); gr.addColorStop(0.5, COL.skyMid); gr.addColorStop(0.84, COL.skyLow); gr.addColorStop(1, COL.skyHor);
  g.fillStyle = gr; g.fillRect(140, 10, 1660, SILL);
  g.fillStyle = radial(g, -60, 540, 10, 1300, [[0, 'rgba(255,238,218,0.7)'], [0.35, 'rgba(246,224,212,0.28)'], [1, 'rgba(240,220,215,0)']]);
  g.fillRect(140, 10, 1660, SILL);
  // high thin stratus
  const r = mulberry32(77);
  for (let i = 0; i < 26; i++) {
    const y = 90 + r() * 170, x = 200 + r() * 1500, w = 120 + r() * 380;
    g.fillStyle = `rgba(214,206,220,${0.03 + r() * 0.05})`;
    g.beginPath(); g.ellipse(x, y, w, 3 + r() * 7, -0.02, 0, 7); g.fill();
  }
  cumulus(g, 11, 330, 572, 460, 250);
  cumulus(g, 29, 1650, 548, 420, 190);
  cumulus(g, 5, 1110, 574, 260, 70);
  // skyline, two atmospheric layers
  for (const [seed, top, col] of [[3, 545, '#8f8a9e'], [8, 562, '#76718a']]) {
    const rr = mulberry32(seed); let x = 150;
    g.fillStyle = col;
    while (x < 1800) {
      const w = 20 + rr() * 70, h = (top === 545 ? 8 + rr() * 40 : 4 + rr() * 22) * (rr() < 0.12 ? 2.2 : 1);
      g.fillRect(x, SILL - (SILL - top) - h + 30, w, h + 40); x += w + rr() * 6;
    }
  }
}
function paintWindowFrame(g) {
  g.fillStyle = COL.frame;
  const X0 = 150, X1 = 1790, Y0 = 20, T = 22;
  g.fillRect(X0 - 4, Y0 - 4, X1 - X0 + 8, T);          // top
  g.fillRect(X0 - 4, Y0, T, SILL - Y0);                  // left
  g.fillRect(X1 - T + 4, Y0, T, SILL - Y0);              // right
  g.fillRect(540, Y0, 20, SILL - Y0);                    // mullions
  g.fillRect(1360, Y0, 20, SILL - Y0);
  // inner bevel catching sky light
  g.fillStyle = COL.frameHi;
  g.fillRect(X0 + T - 4, Y0 + 18, 2, SILL - Y0 - 18); g.fillRect(560, Y0 + 18, 2, SILL - Y0 - 18); g.fillRect(1380, Y0 + 18, 2, SILL - Y0 - 18);
  g.fillRect(X0, Y0 + 17, X1 - X0, 2);
  // sill
  g.fillStyle = '#4d4a5d'; g.fillRect(X0 - 20, SILL - 4, X1 - X0 + 40, 10);
  g.fillStyle = '#8a869b'; g.fillRect(X0 - 20, SILL - 4, X1 - X0 + 40, 2);
}
function paintWall(g) {
  big(g, COL.wall);
  let gr = g.createLinearGradient(0, 0, 0, BENCH);
  gr.addColorStop(0, 'rgba(14,13,20,0.55)'); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(0.86, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(8,8,12,0.55)');
  g.fillStyle = gr; g.fillRect(-10, -10, 1940, BENCH + 10);
}
function paintMarkerOnGlass(g) {
  // generic math on the glass of the upper-left light: attention mask, loss curve, symbols
  g.save();
  g.strokeStyle = 'rgba(240,236,246,0.22)'; g.fillStyle = 'rgba(240,236,246,0.22)'; g.lineWidth = 2.2;
  const r = mulberry32(41);
  // causal attention mask
  const ox = 200, oy = 58, cs = 13;
  for (let i = 0; i < 8; i++) for (let j = 0; j <= i; j++) {
    const v = r();
    g.strokeRect(ox + j * cs, oy + i * cs, cs - 2, cs - 2);
    if (v > 0.55 || i === j) { g.globalAlpha = 0.5 + v * 0.5; g.fillRect(ox + j * cs + 2, oy + i * cs + 2, cs - 6, cs - 6); g.globalAlpha = 1; }
  }
  // loss curve
  g.beginPath(); g.moveTo(330, 60); g.lineTo(330, 170); g.lineTo(480, 170); g.stroke();
  g.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 40; const x = 334 + t * 140, y = 72 + 90 * Math.exp(-t * 4.2) + 4 * Math.sin(i * 1.7) * (1 - t) + 6; i ? g.lineTo(x, y + 90 - 90) : g.moveTo(x, y); } g.stroke();
  g.font = 'italic 22px "Cambria Math", Cambria, serif';
  g.fillText('∇θ ℒ', 386, 80);
  g.fillText('QKᵀ/√d', 230, 186);
  g.restore();
}
function paintBench(g) {
  const gr = g.createLinearGradient(0, BENCH, 0, 1080);
  gr.addColorStop(0, '#59566b'); gr.addColorStop(0.12, '#454256'); gr.addColorStop(0.55, '#2d2b39'); gr.addColorStop(1, '#17161e');
  g.fillStyle = gr; g.fillRect(-10, BENCH, 1940, 1090 - BENCH);
  g.fillStyle = 'rgba(200,194,214,0.6)'; g.fillRect(-10, BENCH - 1, 1940, 2);
  g.fillStyle = 'rgba(10,10,14,0.5)'; g.fillRect(-10, BENCH + 1, 1940, 2);
}
function paintMonitor(g) {
  const { x, y, w, h } = MON;
  // stand
  g.fillStyle = '#23222c'; g.fillRect(x + w / 2 - 9, y + h, 18, BENCH + 12 - (y + h));
  g.fillStyle = '#2b2a35'; g.beginPath(); g.ellipse(x + w / 2, BENCH + 14, 58, 9, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(160,156,176,0.35)'; g.fillRect(x + w / 2 - 9, y + h, 2, BENCH + 12 - (y + h));
  // bezel
  g.fillStyle = '#15141b'; g.beginPath(); g.roundRect(x - 9, y - 9, w + 18, h + 18, 5); g.fill();
  g.fillStyle = 'rgba(170,166,188,0.5)'; g.fillRect(x - 7, y - 9, w + 14, 1.6);
}
function paintScreen(g) {
  const { x, y, w, h } = MON;
  g.save(); g.translate(x, y);
  g.fillStyle = '#1b1e26'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(170,205,220,0.07)'; g.fillRect(0, 0, w, h);
  // gridworld: 9 x 7, grey, waiting (empty spawn cell outlined)
  const gx = 12, gy = 16, cs = 13.5;
  const walls = new Set(['3,1', '3,2', '3,3', '6,3', '6,4', '6,5', '1,5', '2,5', '4,5']);
  for (let j = 0; j < 7; j++) for (let i = 0; i < 9; i++) {
    const k = i + ',' + j;
    g.fillStyle = walls.has(k) ? '#3b3e49' : ((i + j) % 2 ? '#686b76' : '#6f727d');
    g.fillRect(gx + i * cs, gy + j * cs, cs - 1.5, cs - 1.5);
  }
  g.fillStyle = '#b9bcc4'; g.fillRect(gx + 8 * cs, gy + 0 * cs, cs - 1.5, cs - 1.5);        // goal
  g.strokeStyle = 'rgba(230,235,240,0.9)'; g.lineWidth = 1.2; g.setLineDash([2, 2]);
  g.strokeRect(gx + 0 * cs + 1, gy + 6 * cs + 1, cs - 3.5, cs - 3.5); g.setLineDash([]);   // empty spawn
  // eval curve ticking upward
  const px = 142, py = 18, pw = 84, ph = 74;
  g.strokeStyle = '#4a4f5d'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, py); g.lineTo(px, py + ph); g.lineTo(px + pw, py + ph); g.stroke();
  g.setLineDash([2, 3]); g.beginPath(); g.moveTo(px, py + 10); g.lineTo(px + pw, py + 10); g.stroke(); g.setLineDash([]);
  const r = mulberry32(5); const pts = [];
  for (let i = 0; i <= 22; i++) { const t = i / 22; pts.push([px + 2 + t * (pw - 6), py + ph - 4 - (ph - 22) * Math.pow(t, 1.6) - (r() - 0.5) * 7]); }
  g.strokeStyle = '#d4e6ee'; g.lineWidth = 1.4; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
  const e = pts[pts.length - 1]; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(e[0], e[1], 2.2, 0, 7); g.fill();
  g.font = '9px Consolas, monospace'; g.fillStyle = '#c5d6de';
  g.fillText('0.312', px + 44, py + ph + 12); g.fillText('000128', gx, gy + 7 * cs + 12);
  g.fillStyle = 'rgba(200,225,235,0.55)'; g.fillText('▲', px + 76, py + ph + 12);
  g.restore();
}

// ================================================================== HARNESS (cel)
function ribPath(th) {
  const P = splPts(ribCtrl(th), false, 1, 48);
  const p = strokePoly(P, u => lerp(21, 11, Math.pow(u, 0.85)) * (u > 0.978 ? Math.sqrt(Math.max(0, 1 - ((u - 0.978) / 0.022) ** 2)) : 1));
  return { p, P };
}
function drawPlate(g) {
  const { cx, cy } = HARN, rx = 128, ry = rx * HARN.k;
  const side = new Path2D(); side.ellipse(cx, cy + 10, rx, ry, 0, 0, Math.PI); side.lineTo(cx - rx, cy); side.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true); side.closePath();
  fillP(g, side, '#6f6d84'); crescent(g, side, 10, 0, '#4f4d63'); inkP(g, side, 1.8, COL.ink);
  const top = ell(cx, cy, rx, ry);
  fillP(g, top, '#bdbccb'); crescent(g, top, 6, -3, '#9998ae');
  clipFill(g, top, ell(cx, cy, rx - 14, ry - 3.5), 'rgba(80,78,98,0.35)');
  inkP(g, ell(cx, cy, rx - 14, ry - 3.5), 1.1, 'rgba(30,27,39,0.6)');
  inkP(g, top, 1.8, COL.ink);
}
function drawRib(g, th) {
  const { p, P } = ribPath(th);
  fillP(g, p, COL.rib);
  crescent(g, p, -5, -1.5, COL.ribSh);
  crescent(g, p, 2.4, 1.2, COL.rimW);
  inkP(g, p, 1.7, COL.ink);
  // knuckle joints at the control knots
  const C = ribCtrl(th);
  for (const k of [1, 2]) {
    const q = C[k];
    let bi = 0, bd = 1e9; P.forEach((pp, i) => { const d = (pp[0] - q[0]) ** 2 + (pp[1] - q[1]) ** 2; if (d < bd) { bd = d; bi = i; } });
    const a = P[Math.max(0, bi - 1)], b = P[Math.min(P.length - 1, bi + 1)];
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const jw = k === 1 ? 11.5 : 10;
    const j = new Path2D(); j.roundRect(-6, -jw, 12, jw * 2, 4);
    g.save(); g.translate(q[0], q[1]); g.rotate(ang);
    fillP(g, j, COL.joint); crescent(g, j, 0, -3, COL.jointSh);
    g.fillStyle = 'rgba(230,230,240,0.8)'; g.fillRect(-4, -jw + 2, 1.6, jw * 2 - 4);
    inkP(g, j, 1.5, COL.ink);
    g.restore();
  }
}

// brush-dab texture sampled from the underpainting (painted look), then slight softening
function dabTexture(canvas, n, seed, lenR, widR, alpha, angFn) {
  const g = canvas.getContext('2d');
  const src = g.getImageData(0, 0, VW, VH).data;
  const r = mulberry32(seed);
  g.save(); ID(g);
  for (let i = 0; i < n; i++) {
    const x = r() * VW, y = r() * VH;
    const o = ((y | 0) * VW + (x | 0)) * 4;
    const j = (r() - 0.5) * 12;
    if (src[o + 3] < 250) { r(); r(); r(); r(); continue; }
    g.fillStyle = `rgba(${clamp(src[o] + j, 0, 255) | 0},${clamp(src[o + 1] + j, 0, 255) | 0},${clamp(src[o + 2] + j * 1.1, 0, 255) | 0},${alpha})`;
    const wx = VIEW.x + x / PX, wy = VIEW.y + y / PX;
    const a = angFn(wx, wy) + (r() - 0.5) * 0.35;
    const L = (lenR[0] + r() * (lenR[1] - lenR[0])) * PX, Wd = (widR[0] + r() * (widR[1] - widR[0])) * PX;
    g.setTransform(Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), x, y);
    g.beginPath(); g.ellipse(0, 0, L / 2, Wd / 2, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
