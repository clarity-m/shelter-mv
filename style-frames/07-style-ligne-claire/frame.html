<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shelter MV / 07 ligne claire / the harness</title>
<style>
html,body{margin:0;padding:0;background:#f5f0e8;overflow:hidden;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!--
  Shelter MV style frame 07: ligne claire. "The harness", early phase.
  Pure Canvas2D vector drawing: flat fills, uniform ink lines, one flat shade per surface.
  Lighting is two flat states: the whole scene is drawn in its dusk (shade) palette, then again offscreen
  in its lamp-lit palette and composited through one clip: the lamp's beam (convex hull of shade rim +
  pool on the bench, with a narrower second-step core on the wall). Researcher A's lit version is also
  composited through a disc around Clawd: his glow lights the face and hands turned toward him.
  One clip per layer, so each pixel is lit or shaded exactly once (no seams). ~0.1-0.5 s per frame.
  Architecture and props are modelled in world centimetres and projected (one-point perspective);
  figures are authored as Catmull-Rom contours in local centimetre frames and placed at their depth.
  Clawd is stamped last on the device pixel grid, never outlined.
  ?view=detail&x=..&y=..&z=..&w=..&h=..  re-renders the same drawing as a close-up.
-->
<script>
"use strict";
(function () {
const T0 = performance.now();
const Q = new URLSearchParams(location.search);
const VIEW = Q.get('view') || 'frame';
let VW = 1920, VH = 1080, Z = 1, OX = 0, OY = 0;
if (VIEW === 'detail') {
  VW = +(Q.get('w') || 1080); VH = +(Q.get('h') || 1080); Z = +(Q.get('z') || 2.2);
  const fx = +(Q.get('x') || 760), fy = +(Q.get('y') || 560);
  OX = fx - VW / 2 / Z; OY = fy - VH / 2 / Z;
}
const cv = document.getElementById('c');
cv.width = VW; cv.height = VH;
let ctx = cv.getContext('2d');
ctx.setTransform(Z, 0, 0, Z, -OX * Z, -OY * Z);
ctx.lineJoin = 'round'; ctx.lineCap = 'round';
const LWK = Math.pow(Z, -0.45);          // close-ups thicken lines by Z^0.55, like a redrawn panel
const LW = 2.5, LW2 = 1.6, LW3 = 1.05;   // figures+props / architecture / fine detail
const INK = '#1c1b1a';

// ------------------------------------------------------------------ palettes (dusk shade / lamp light)
const SH = {
  clawd: '#D97757',
  wall: '#89939b', rail: '#a3aaa5', railSh: '#8a918d', skirt: '#59626a', reveal: '#6c767e',
  sky1: '#6a7b88', sky2: '#82929d', sky3: '#a8aeab', sky4: '#cdc3af', hill1: '#6c7a81', hill2: '#56646b', moon: '#efeadd', winFrame: '#434c4b',
  floor: '#6a7076', floorLn: '#60666c', floorSh: '#585e64',
  benchTop: '#a9a797', benchEdge: '#878679', benchSh: '#8f8e80', body: '#535d64', bodyHi: '#5b656c', bodySh: '#474f56',
  metal: '#b3b8bc', metalSh: '#979da2', metalDk: '#777f85', steel: '#8d959b',
  cable: '#33383b', cable2: '#7b817e',
  coat: '#aeb7be', skinA: '#bf9e88', hairA: '#28231f', hairAln: '#4e4843', topA: '#3c4b4e', trouA: '#343a3f', trouAFar: '#2a2f33', shoeA: '#252321',
  skinB: '#6a4639', skinBSh: '#5a3a2f', hairB: '#c3c1b9', hairBln: '#8e8b84', cardB: '#4e5b63', cardBSh: '#434f56', shirtB: '#bfc0b8', trouB: '#32373b', trouBFar: '#272a2d', shoeB: '#2e2622',
  mon: '#2d3133', screen: '#434a4d', cell: '#687072', cellLt: '#98a0a0', cellDk: '#2a3032', curve: '#e6e2d6',
  lampOut: '#47514e', lampIn: '#f8f0dd', bulb: '#fffcf4', mug: '#9aa4a6', mugIn: '#5d5550', steam: '#9aa1a2',
  peach: '#d9b39c', paper: '#cfd2cd', clockRim: '#8e9693', blushA: '#bf9e88', coatBtn: '#9aa3a2',
};
const LIT = Object.assign({}, SH, {
  wall: '#d2caaf', rail: '#dcd5bf', railSh: '#c3bca6', skirt: '#9d9a8a',
  benchTop: '#eee5ce', benchEdge: '#cdc2a8', benchSh: '#d6ccb4',
  metal: '#efebe0', metalSh: '#cfc9ba', metalDk: '#a39e92', steel: '#c4bfb2',
  cable: '#3e4346', cable2: '#a5a196',
  coat: '#f4efe5', skinA: '#eecbac', blushA: '#ecbca3', topA: '#56676a', trouA: '#40464b',
  peach: '#f4cdb2',
});
let C = SH;

// ------------------------------------------------------------------ utilities
const D2R = Math.PI / 180;
// camera: world cm, x right, y up, z = depth from the camera
const CAM = { e: 140, f: 2300, cx: 960, cy: 400 };
const P = (x, y, z) => [CAM.cx + CAM.f * x / z, CAM.cy - CAM.f * (y - CAM.e) / z];
const S = z => CAM.f / z;

function poly(pts, closed = true) {
  const p = new Path2D();
  pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]));
  if (closed) p.closePath();
  return p;
}
const poly3 = (pts, closed = true) => poly(pts.map(q => P(q[0], q[1], q[2])), closed);
// Catmull-Rom through points; a third element of 1 marks a corner
function cr(pts, closed = true) {
  const p = new Path2D(), n = pts.length;
  const g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  p.moveTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    let c1x, c1y, c2x, c2y;
    if (p1[2]) { c1x = p1[0] + (p2[0] - p1[0]) / 3; c1y = p1[1] + (p2[1] - p1[1]) / 3; }
    else { c1x = p1[0] + (p2[0] - p0[0]) / 6; c1y = p1[1] + (p2[1] - p0[1]) / 6; }
    if (p2[2]) { c2x = p2[0] - (p2[0] - p1[0]) / 3; c2y = p2[1] - (p2[1] - p1[1]) / 3; }
    else { c2x = p2[0] - (p3[0] - p1[0]) / 6; c2y = p2[1] - (p3[1] - p1[1]) / 6; }
    p.bezierCurveTo(c1x, c1y, c2x, c2y, p2[0], p2[1]);
  }
  if (closed) p.closePath();
  return p;
}
function xf(p, m) { const q = new Path2D(); q.addPath(p, m); return q; }
function fill(p, col) { ctx.fillStyle = col; ctx.fill(p); }
function line(p, lw = LW, col = INK) { ctx.strokeStyle = col; ctx.lineWidth = lw * LWK; ctx.stroke(p); }
function shape(p, col, lw = LW) { fill(p, col); line(p, lw); }
function clipped(clip, fn) { ctx.save(); ctx.clip(clip); fn(); ctx.restore(); }
// merged silhouette: all strokes (2x) first, then all fills, so shared edges vanish
function group(parts, lw = LW) {
  ctx.strokeStyle = INK; ctx.lineWidth = 2 * lw * LWK;
  for (const q of parts) ctx.stroke(q[0]);
  for (const q of parts) fill(q[0], q[1]);
}
function tubeLine(p, w, col, lw = LW) {
  ctx.strokeStyle = INK; ctx.lineWidth = w + 2 * lw * LWK; ctx.stroke(p);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(p);
}
function circle(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, 2 * Math.PI); return p; }
function rectP(x, y, w, h) { const p = new Path2D(); p.rect(x, y, w, h); return p; }
// horizontal world circle / arc (angle 0 = +z, 90 = +x)
function hpts(cx, y, cz, r, a0 = 0, a1 = 360, n = 72) {
  const out = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * D2R; out.push(P(cx + r * Math.sin(a), y, cz + r * Math.cos(a))); }
  return out;
}
const hcircle = (cx, y, cz, r) => poly(hpts(cx, y, cz, r, 0, 360, 96));
// local figure frame -> screen: u along world x (flip -1 mirrors), v = up, cm
function figM(x0, y0, z, flip = 1) { const s = CAM.f / z; return new DOMMatrix([s * flip, 0, 0, -s, CAM.cx + s * x0, CAM.cy + s * (CAM.e - y0)]); }
const sub = (M, u, v, deg = 0, sc = 1) => M.multiply(new DOMMatrix().translate(u, v).rotate(deg).scale(sc));
const L = (M, pts, closed = true) => xf(cr(pts, closed), M);
const Lc = (M, u, v, r) => xf(circle(u, v, r), M);
const Le = (M, u, v, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(u, v, rx, ry, rot, 0, 2 * Math.PI); return xf(p, M); };
const rotPt = (q, deg) => { const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R); return [q[0] * c - q[1] * s, q[0] * s + q[1] * c]; };
// tube outline from a centreline (sleeves, trousers, ribs)
function tube(c, r, capA = 'round', capB = 'round') {
  const n = c.length, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    A.push([c[i][0] - ty * r[i], c[i][1] + tx * r[i]]);
    B.push([c[i][0] + ty * r[i], c[i][1] - tx * r[i]]);
  }
  const dir = (i, j) => { const dx = c[j][0] - c[i][0], dy = c[j][1] - c[i][1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const out = [];
  if (capA === 'flat') { A[0].push(1); B[0].push(1); }
  if (capB === 'flat') { A[n - 1].push(1); B[n - 1].push(1); }
  out.push(...A);
  if (capB === 'round') { const d = dir(n - 2, n - 1); out.push([c[n - 1][0] + d[0] * r[n - 1] * 0.95, c[n - 1][1] + d[1] * r[n - 1] * 0.95]); }
  out.push(...B.reverse());
  if (capA === 'round') { const d = dir(1, 0); out.push([c[0][0] + d[0] * r[0] * 0.95, c[0][1] + d[1] * r[0] * 0.95]); }
  return out;
}
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop();
  return lo.concat(up);
}

// ------------------------------------------------------------------ scene constants
const BW = 640;                                          // back wall depth
const HAR = { x: 0, y: 90, z: 360, discR: 31, discH: 3.4, r0: 22 };
const BN = { x0: -62, x1: 70, z0: 320, z1: 402, top: 90 };
const ST = { x: -96, z: 368, seat: 66 };
const AF = { x: -96, y: 66, z: 368 };                   // researcher A frame origin (stool seat centre)
const CT = { x0: 64, x1: 122, z0: 502, z1: 550, top: 92, low: 24 };
const BF = { x: 142, y: 0, z: 505 };                     // researcher B frame origin (between the feet)
const LAMP = { x: 0, z: 356, rim: 178, r: 16 };
const RP = 50;                                            // radius of the lamp pool on the bench
// the harness is two cupped hands: four finger-ribs per side in parallel planes, curling toward each other
// [side (-1 left, +1 right), depth offset, tip dx, tip dh, fitted]
const FINGERS = [[-1, -20, -3.0, -3.2, 1], [-1, -6.5, 0.6, 0.4, 1], [-1, 7, 1.2, 1.2, 1], [-1, 20, -1.6, -1.6, 1],
                 [1, -20, -3.0, -3.2, 0], [1, -6.5, 0.6, 0.4, 1], [1, 7, 1.2, 1.2, 1], [1, 20, -1.6, -1.6, 1]];
const A_TGT_F = 0, A_TGT_T = 0.3;
let A_state = null;

try { main(); } catch (e) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#e33'; ctx.font = '20px monospace';
  String(e && e.stack || e).split('\n').slice(0, 10).forEach((l, i) => ctx.fillText(l, 20, 40 + i * 26));
}
console.log('render ms ' + (performance.now() - T0).toFixed(1));

function main() {
  drawScene(false);                                            // whole scene, dusk palette
  const litAll = offscreen(() => drawScene(true));             // whole scene, lamp-lit palette
  const litA = offscreen(() => { C = LIT; drawA('body'); drawA('hands'); });
  const cut = () => ctx.clip(rectP(-1e4, -1e4, 3e4, P(0, BN.top, BN.z0)[1] + 1e4));
  composite(litAll, () => { ctx.clip(beamPath()); cut(); });  // the lamp beam
  composite(litA, () => { const [gx, gy] = P(HAR.x, HAR.y + 9, HAR.z); ctx.clip(circle(gx, gy, 380)); cut(); }); // Clawd's glow on A
  C = SH;
  drawLamp();
  drawClawd();
}
function offscreen(fn) {
  const c2 = document.createElement('canvas'); c2.width = VW; c2.height = VH;
  const keep = ctx; ctx = c2.getContext('2d');
  ctx.setTransform(Z, 0, 0, Z, -OX * Z, -OY * Z); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  fn();
  ctx = keep;
  return c2;
}
function composite(img, clipFn) {
  ctx.save(); clipFn(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(img, 0, 0); ctx.restore();
}
function drawScene(lit) {
  C = lit ? LIT : SH;
  if (!lit) {
    drawRoom(); drawWindow(); drawClock(); drawFloor(); drawCart(); drawB(); drawBenchBack();
    drawBenchTop(); drawStool(); drawA('body'); drawBenchFront(); drawHarness(); drawA('hands'); drawCables();
    return;
  }
  drawRoom(); drawBeamCore(); drawMotes(); drawBenchTop(); drawA("body"); drawHarness(); drawA("hands"); drawCables();
}
function drawBeamCore() {
  const pts = [...hpts(LAMP.x, LAMP.rim, LAMP.z, 7, 0, 360, 48), ...hpts(HAR.x, BN.top + 0.2, HAR.z, 30, 0, 360, 96)];
  fill(poly(hull(pts)), "#ddd5bb");
}
function drawMotes() {
  let a = 1234567;
  const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i = 0; i < 26; i++) {
    const y = lerp(230, 560, rnd()), x = 960 + (rnd() - 0.5) * lerp(200, 520, (y - 230) / 330);
    fill(circle(x, y, lerp(0.9, 2.0, rnd())), '#e7e0c8');
  }
}
function beamPath() {
  const pts = [...hpts(LAMP.x, LAMP.rim, LAMP.z, LAMP.r - 1.4, 0, 360, 64), ...hpts(HAR.x, BN.top + 0.2, HAR.z, RP, 0, 360, 128)];
  return poly(hull(pts));
}

// ------------------------------------------------------------------ room
function drawRoom() {
  const X0 = OX - 4, Y0 = OY - 4, WW = VW / Z + 8, HH = VH / Z + 8;
  fill(rectP(X0, Y0, WW, HH), C.wall);
  // skirting
  const yS = P(0, 12, BW)[1], yB = P(0, 0, BW)[1];
  fill(rectP(X0, yS, WW, yB - yS), C.skirt);
  line(poly([[X0, yS], [X0 + WW, yS]], false), LW2);
}

function drawWindow() {
  const x0 = -262, x1 = -128, yb = 172, yt = 300, zw = BW, zg = BW + 16;
  const o = [P(x0, yt, zw), P(x1, yt, zw), P(x1, yb, zw), P(x0, yb, zw)];
  const g = [P(x0, yt, zg), P(x1, yt, zg), P(x1, yb, zg), P(x0, yb, zg)];
  const open = poly(o);
  fill(open, C.reveal);
  clipped(open, () => {
    const glass = poly(g);
    clipped(glass, () => {
      const gx0 = g[0][0] - 2, gx1 = g[1][0] + 2, H0 = CAM.cy;
      const band = (ya, yb2, col) => fill(rectP(gx0, ya, gx1 - gx0, yb2 - ya), col);
      band(g[0][1] - 400, H0 - 300, C.sky1);
      band(H0 - 300, H0 - 190, C.sky2);
      band(H0 - 190, H0 - 128, C.sky3);
      band(H0 - 128, g[2][1] + 4, C.sky4);
      const strat = (cx, cy, w, h, col) => { const p = new Path2D(); p.ellipse(cx, cy, w, h, 0, 0, 2 * Math.PI); fill(p, col); };
      strat(gx0 + 150, H0 - 222, 130, 4.5, C.sky3);
      strat(gx0 + 300, H0 - 350, 160, 5, C.sky2);
      strat(gx0 + 90, H0 - 150, 110, 3.5, C.sky4);
      const hy = g[2][1];
      const hill = (pts, col) => { fill(poly(pts), col); line(poly(pts.slice(1, -1), false), LW3); };
      const H1 = [[gx0, hy + 6]], H2 = [[gx0, hy + 6]];
      for (let i = 0; i <= 40; i++) {
        const x = lerp(gx0, gx1, i / 40), t = i / 40;
        H1.push([x, hy - 24 - 12 * Math.sin(t * 4.1 + 0.6) - 5 * Math.sin(t * 11.3)]);
        H2.push([x, hy - 9 - 7 * Math.sin(t * 6.3 + 2.0) - 3 * Math.sin(t * 15.1 + 1)]);
      }
      H1.push([gx1, hy + 6]); H2.push([gx1, hy + 6]);
      hill(H1, C.hill1); hill(H2, C.hill2);
      // crescent moon
      const mx = gx0 + 345, my = H0 - 285, mr = 14;
      const outer = circle(mx, my, mr), inner = circle(mx + 7.5, my - 4, mr * 0.92);
      const both = new Path2D(); both.addPath(outer); both.addPath(inner);
      clipped(outer, () => { ctx.fillStyle = C.moon; ctx.fill(both, 'evenodd'); line(inner, LW3); });
      const big = new Path2D(); big.rect(mx - 60, my - 60, 120, 120); big.addPath(inner);
      ctx.save(); ctx.clip(big, 'evenodd'); line(outer, LW3); ctx.restore();
    });
    // steel frame in the glass plane
    const fw = 4.5, mw = 3.6, xm = (x0 + x1) / 2;
    const r3 = (xa, xb, ya, yb2) => poly3([[xa, yb2, zg - 1], [xb, yb2, zg - 1], [xb, ya, zg - 1], [xa, ya, zg - 1]]);
    group([r3(x0, x1, yb, yb + fw), r3(x0, x0 + fw, yb, yt), r3(x1 - fw, x1, yb, yt), r3(xm - mw / 2, xm + mw / 2, yb, yt), r3(x0, x1, 238, 238 + mw)].map(p => [p, C.winFrame]), LW2 * 0.85);
    const h1 = P(xm + 5, 212, zg - 3), h2 = P(xm + 5, 198, zg - 3);
    tubeLine(poly([h1, h2], false), 2.4, C.steel, LW3);
  });
  line(open, LW2);
  // sill board (front face; the camera is below its top)
  const s1 = P(x0 - 8, yb, zw - 5), s2 = P(x1 + 8, yb - 4, zw - 5);
  shape(poly([s1, [s2[0], s1[1]], s2, [s1[0], s2[1]]]), C.rail, LW2);
}

function drawClock() {
  const [cx, cy] = P(236, 214, BW - 2), r = 12.5 * S(BW - 2);
  shape(circle(cx, cy, r + 2.6), C.clockRim, LW2);
  shape(circle(cx, cy, r), C.paper, LW3);
  const t = new Path2D();
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * Math.PI, r0 = i % 3 ? r * 0.84 : r * 0.72; t.moveTo(cx + Math.sin(a) * r0, cy - Math.cos(a) * r0); t.lineTo(cx + Math.sin(a) * r * 0.92, cy - Math.cos(a) * r * 0.92); }
  line(t, LW3);
  const hand = (a, len, w) => line(poly([[cx, cy], [cx + Math.sin(a) * len, cy - Math.cos(a) * len]], false), w);
  hand((7 + 52 / 60) / 12 * 2 * Math.PI, r * 0.5, LW2 * 1.2);
  hand(52 / 60 * 2 * Math.PI, r * 0.78, LW3 * 1.2);
  fill(circle(cx, cy, 1.8), INK);
}

function drawFloor() {
  const yB = P(0, 0, BW)[1];
  const X0 = OX - 4, WW = VW / Z + 8, Y1 = OY + VH / Z + 4;
  fill(rectP(X0, yB, WW, Y1 - yB), C.floor);
  line(poly([[X0, yB], [X0 + WW, yB]], false), LW2);
  const t = new Path2D();
  for (let x = -600; x <= 600; x += 75) { const a = P(x, 0, BW), b = P(x, 0, 200); t.moveTo(a[0], a[1]); t.lineTo(b[0], b[1]); }
  for (let z = BW - 75; z > 250; z -= 75) { const y = P(0, 0, z)[1]; t.moveTo(X0, y); t.lineTo(X0 + WW, y); }
  line(t, LW3, C.floorLn);
  fill(poly3([[CT.x0 - 3, 0, CT.z0], [CT.x1 + 4, 0, CT.z0], [CT.x1 + 6, 0, CT.z1 + 6], [CT.x0 - 2, 0, CT.z1 + 6]]), C.floorSh);
  fill(poly(hpts(BF.x + 1, 0, BF.z + 2, 19)), C.floorSh);
}

// ------------------------------------------------------------------ boxes, bench, stool
function box3(x0, x1, y0, y1, z0, z1, cols, lw = LW) {
  const f = [[x0, y1, z0], [x1, y1, z0], [x1, y0, z0], [x0, y0, z0]];
  const faces = [];
  if (y1 < CAM.e) faces.push([[[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], cols.top]);

function drawMonitor(m) {

function fingerProf(f, t) {   // (x toward the centre from the left rim, height above the disc), cubic Bezier
  const P0 = [-HAR.r0, 0], P1 = [-HAR.r0 - 7.5, 12], P2 = [-HAR.r0 + 2.5, 38 + f[3]], P3 = [-4.5 + f[2], 30 + f[3]];
  const u = 1 - t, k0 = u * u * u, k1 = 3 * u * u * t, k2 = 3 * u * t * t, k3 = t * t * t;
  return [k0 * P0[0] + k1 * P1[0] + k2 * P2[0] + k3 * P3[0], k0 * P0[1] + k1 * P1[1] + k2 * P2[1] + k3 * P3[1]];
}
function fingerWorld(f, t) { const [x, h] = fingerProf(f, t); return [HAR.x - f[0] * x, HAR.y + HAR.discH + h, HAR.z + f[1]]; }
function fingerPts3(f, n = 28) { const out = []; for (let i = 0; i < n; i++) out.push(fingerWorld(f, i / (n - 1))); return out; }
function drawRibScreen(pts3) {
  const n = pts3.length, q = pts3.map(p => P(...p));
  const rad = pts3.map((p, i) => lerp(0.68, 0.42, i / (n - 1)) * S(p[2]));
  shape(cr(tube(q, rad, 'flat', 'round')), C.metal, LW);
  // collars at two knuckles
  for (const t of [0.3, 0.62]) {
    const i = Math.round(t * (n - 1)), a = q[Math.max(0, i - 1)], b = q[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const hl = 0.75 * S(pts3[i][2]), hw = rad[i] + 0.45 * S(pts3[i][2]);
    const c0 = q[i];
    const band = poly([[c0[0] - dx * hl - dy * hw, c0[1] - dy * hl + dx * hw], [c0[0] + dx * hl - dy * hw, c0[1] + dy * hl + dx * hw], [c0[0] + dx * hl + dy * hw, c0[1] + dy * hl - dx * hw], [c0[0] - dx * hl + dy * hw, c0[1] - dy * hl - dx * hw]]);
    shape(band, C.metalSh, LW2);
  }
  // fingertip pad
  const tp = q[n - 1];
  shape(circle(tp[0], tp[1], 1.05 * S(pts3[n - 1][2])), C.metalSh, LW2);
  return q;
}
function drawHarness() {
