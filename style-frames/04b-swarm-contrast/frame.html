<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shelter MV style frame 04b: the swarm, full contrast</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:1920px;height:1080px}
canvas{display:block;position:absolute;left:0;top:0}
#dbg{display:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<pre id="dbg"></pre>
<script>
'use strict';
// =====================================================================
// Shelter MV, style frame 04b: "the swarm", revised for contrast.
// The last pull-back. The camera has just left the humans' sim: its
// painted sky is the luminous curved edge along the bottom. Out here is
// deep space and the Dyson swarm around Alpha Centauri B: a few thin
// inclined bands of tiny crisp collectors (one point per instance), a
// white-hot core, and 11 shafts of escaping light that draw the spark.
// Alpha Centauri A hangs upper left.
// Deterministic: collectors are hash-generated on the GPU from their
// vertex ID; everything else uses a seeded PRNG.
// Pipeline (WebGL2, HDR half-float):
//   space + star glow + shafts -> stars -> far collectors -> star disk ->
//   near collectors -> Alpha Cen A -> sim sky (underpainting, strokes,
//   rim) -> bloom -> tonemap, grade, grain -> HUD.
// =====================================================================
const DBG = [];
function log(s){ DBG.push(String(s)); const el = document.getElementById('dbg'); if (el) el.textContent = DBG.join('\n'); }
window.addEventListener('error', e => log('JSERR ' + e.message + ' @' + e.lineno + ':' + e.colno));
const T0 = performance.now();
const QS = new URLSearchParams(location.search);
const VIEW = QS.get('view') || 'final';

const W = 1920, H = 1080;
const P = {
  C: [1112, 404], RS: 212,        // Alpha Cen B (px) and the swarm unit (px)
  A: [352, 206],                  // Alpha Cen A (px)
  bub: [840, 2800, 1900],         // the sim we just left: centre x, centre y, radius (px)
  rStar: 0.030,                   // photosphere radius (swarm units)
  gain: 1.0,                      // collector brightness
  kFar: 0.18, kNear: 0.045,       // lit far faces, warm near backs
  occ: 0.35,                      // how much each near-side collector hides behind it
  nDrift: 5000,                   // instances in transit between bands
  grid: 0.0,                      // wireframe on the sim membrane (1 ribs, 2 ribs and parallels)
  exposure: 1.0, bloom: 0.55,
};
for (const k of ['gain', 'kFar', 'kNear', 'occ', 'nDrift', 'grid', 'exposure', 'bloom']) if (QS.has(k)) P[k] = +QS.get(k);
const CX = P.C[0], CY = P.C[1], RS = P.RS;

// ---------------------------------------------------------------- random
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gaussOf(r){ let u = 0; while (u === 0) u = r(); const v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function smoothstep(a, b, x){ const t = Math.min(Math.max((x-a)/(b-a), 0), 1); return t*t*(3-2*t); }
function makeNoise1D(r, n){ // periodic value noise with n cells
  const v = new Float32Array(n); for (let i = 0; i < n; i++) v[i] = r();
  return function(x){ const i0 = Math.floor(x), f = x - i0; const a = v[((i0 % n) + n) % n], b = v[(((i0+1) % n) + n) % n]; const t = f*f*(3-2*f); return a + (b-a)*t; };
}

// ---------------------------------------------------------------- the ring plane
// The bands share a mean plane (the lanes and the dust lie in it too), seen from below at PLANE_E.
const PLANE_E = 28*Math.PI/180, PLANE_PA = -4*Math.PI/180;

// ---------------------------------------------------------------- the spark: 11 lanes of escaping light
// Lanes run outward in the ring plane, so their screen lengths are foreshortened like the rings.
const RAYS = [];
{
  const r = mulberry32(9127);
  const N = 11, rot = -Math.PI/2 + 0.12;
  for (let k = 0; k < N; k++){
    const ang = rot + k*2*Math.PI/N + (r() - 0.5)*0.32;
    const Lp = 2.1 + 1.25*r();                                  // in-plane length (swarm units)
    const c = Math.cos(ang - PLANE_PA), sq = 0.62;
    const L = Lp*Math.sqrt(c*c + sq*sq*(1 - c*c));              // screen length
    RAYS.push([ang, L, 0.008 + 0.022*Math.pow(r(), 1.6), 0.50 + 0.60*r()]);  // angle, length, base half-width, intensity
  }
}
const rayArr = new Float32Array(48); RAYS.forEach((q, k) => rayArr.set(q, k*4));

// ---------------------------------------------------------------- swarm bands
// Each band is a thin annulus of collectors in its own plane. e is the elevation of the view from
// below that plane (0 = edge-on). Collectors face the star, so the far arcs show their lit faces:
// they pass under the star as a bright cup, while the near arcs (warm backs) arch over it.
// Along a band the collectors bunch into knots joined by thin threads; across it they form a few
// ringlets. Both densities are tabulated as inverse CDFs for the GPU, plus a width profile.
const BANDS = [   // g: brightness, w: warp amplitude (swarm units)
  { r: 0.50, dr: 0.018, e: 30, pa: -6, n: 40000,  g: 1.10, w: 0.008 },
  { r: 0.72, dr: 0.026, e: 26, pa: -2, n: 60000,  g: 0.75, w: 0.014 },
  { r: 0.97, dr: 0.036, e: 33, pa: -9, n: 90000,  g: 1.25, w: 0.018 },
  { r: 1.25, dr: 0.024, e: 24, pa: 3,  n: 72000,  g: 0.70, w: 0.024 },
  { r: 1.58, dr: 0.044, e: 29, pa: -5, n: 115000, g: 0.62, w: 0.030 },
];
for (const b of BANDS) if (QS.has('nscale')) b.n = Math.round(b.n*(+QS.get('nscale')));
const NQ = 1024, NBIN = 2048, NBD = BANDS.length;
const invU = new Float32Array(NQ*NBD), invL = new Float32Array(NQ*NBD), widL = new Float32Array(NQ*NBD);
function invCdf(pdf){
  const n = pdf.length, c = new Float64Array(n+1);
  for (let i = 0; i < n; i++) c[i+1] = c[i] + Math.max(pdf[i], 0);
  const tot = c[n]; for (let i = 0; i <= n; i++) c[i] /= tot;
  const out = new Float32Array(NQ); let j = 0;
  for (let i = 0; i < NQ; i++){
    const q = i/(NQ-1);
    while (j < n-1 && c[j+1] < q) j++;
    const f = (q - c[j])/Math.max(c[j+1] - c[j], 1e-12);
    out[i] = (j + Math.min(Math.max(f, 0), 1))/n;
  }
  return out;
}
{
  const r = mulberry32(31337);
  BANDS.forEach((b, bi) => {
    // across the band: a few crisp ringlets with dark gaps
    const K = 2 + Math.floor(r()*3), rl = [];
    for (let i = 0; i < K; i++) rl.push([r()*1.3 - 0.65, 0.05 + 0.13*r(), 0.4 + 0.6*r()]);
    const pu = new Float64Array(NBIN);
    for (let i = 0; i < NBIN; i++){
      const u = (i + 0.5)/NBIN*2 - 1;
      let v = 0.05*Math.exp(-u*u*2.0);
      for (const [c, w, a] of rl){ const d = (u - c)/w; v += a*Math.exp(-d*d); }
      v *= Math.exp(-Math.pow(Math.abs(u)/0.95, 8));
      pu[i] = v;
    }
    invU.set(invCdf(pu), bi*NQ);
    // along the band: knots (dense clusters) joined by thinner threads
    const n1 = makeNoise1D(r, 16), n2 = makeNoise1D(r, 96);
    const KN = 6 + Math.floor(r()*6), kn = [];
    for (let i = 0; i < KN; i++) kn.push([r(), 0.006 + 0.035*Math.pow(r(), 1.5), 0.5 + 2.5*Math.pow(r(), 2)]);
    const knot = t => { let v = 0; for (const [c, w, a] of kn){ let d = t - c; d -= Math.round(d); d /= w; v += a*Math.exp(-d*d); } return v; };
    const pl = new Float64Array(NBIN);
    for (let i = 0; i < NBIN; i++){ const t = i/NBIN; pl[i] = 0.20 + 0.55*n1(t*16)*n2(t*96) + knot(t); }
    invL.set(invCdf(pl), bi*NQ);
    for (let i = 0; i < NQ; i++) widL[bi*NQ + i] = 0.70 + 0.30*Math.min(knot(i/NQ), 2.0);
    const e = b.e*Math.PI/180, pa = b.pa*Math.PI/180;
    b.a = [Math.cos(pa), Math.sin(pa), 0];
    b.c = [Math.sin(e)*Math.sin(pa), -Math.sin(e)*Math.cos(pa), Math.cos(e)];   // near arc above the star, lit far arc below
    b.nrm = [b.a[1]*b.c[2] - b.a[2]*b.c[1], b.a[2]*b.c[0] - b.a[0]*b.c[2], b.a[0]*b.c[1] - b.a[1]*b.c[0]];
    b.seed = Math.imul(0x9E3779B1, bi + 1) >>> 0;
  });
}
const NPTS = BANDS.reduce((s, b) => s + b.n, 0);

// ---------------------------------------------------------------- the sim's cumulus: sphere piles, bases below frame
const PUFFS = [];
{
  const r = mulberry32(777);
  const clouds = [[640, 1125, 240, 185, 30], [1070, 1112, 170, 105, 22], [300, 1105, 120, 58, 14], [1390, 1100, 120, 52, 14], [1580, 1092, 70, 28, 8]];  // x, base y, half-width, height, puffs
  for (const [cx, yb, hw, ht, np] of clouds){
    for (let j = 0; j < np; j++){
      const v = Math.pow(r(), 0.75);
      const u = (r()*2 - 1)*(1 - 0.62*v);
      const rad = hw*(0.10 + 0.26*Math.pow(r(), 1.4))*(1 - 0.40*v);
      PUFFS.push(cx + u*hw, yb - v*ht, rad, yb);
    }
  }
}
const puffArr = new Float32Array(PUFFS), NPUFF = PUFFS.length/4;

// ---------------------------------------------------------------- background stars
const starList = [];
{
  const r = mulberry32(8080);
  const cols = [[0.70, 0.80, 1.00], [0.86, 0.91, 1.00], [1.00, 0.97, 0.93], [1.00, 0.90, 0.78], [1.00, 0.82, 0.66]];
  const col = t => { const f = Math.min(t, 0.9999)*(cols.length-1), i = Math.floor(f), g = f - i; return [0, 1, 2].map(c => cols[i][c]*(1-g) + cols[i+1][c]*g); };
  const push = (x, y, b, c, s) => starList.push(x, y, c[0]*b, c[1]*b, c[2]*b, s);
  const inBub = (x, y) => VIEW !== 'nobub' && Math.hypot(x - P.bub[0], y - P.bub[1]) < P.bub[2] + 3;
  const nearBright = (x, y) => Math.hypot(x - P.A[0], y - P.A[1]) < 60 || Math.hypot(x - CX, y - CY) < RS*0.7;
  for (let i = 0; i < 6000; i++){
    const x = r()*W, y = r()*H; if (inBub(x, y)) continue;
    const b = 0.006 + 0.030*Math.pow(r(), 3) + 0.30*Math.pow(r(), 14);
    push(x, y, b, col(r()), 1);
  }
  for (let i = 0; i < 36; i++){
    const x = 20 + r()*(W-40), y = 20 + r()*(H-40);
    if (nearBright(x, y) || inBub(x, y)) continue;
    const b = 0.20 + 0.9*Math.pow(r(), 2.2), c = col(r());
    if (b > 0.7){ push(x, y, b, c, 1); push(x+1, y, b*0.25, c, 1); push(x-1, y, b*0.25, c, 1); push(x, y+1, b*0.25, c, 1); push(x, y-1, b*0.25, c, 1); }
    else push(x, y, b*0.55, c, 2);
  }
}
const NSTAR = starList.length/6;

// ---------------------------------------------------------------- brush strokes for the sim sky
function simStrokes(r, n, Lmin, Lmax, Wmin, Wmax, aMin, aMax){
  const d = new Float32Array(n*6); let m = 0;
  for (let i = 0; i < n*6 && m < n; i++){
    const x = r()*W, y = 850 + r()*(H - 850);
    if (Math.hypot(x - P.bub[0], y - P.bub[1]) > P.bub[2] - 2) continue;
    d.set([x, y, Lmin + r()*(Lmax - Lmin), Wmin + r()*(Wmax - Wmin), r(), aMin + r()*(aMax - aMin)], m*6); m++;
  }
  return { data: d.subarray(0, m*6), n: m };
}
const strokeRnd = mulberry32(4242);
const SL = [
  simStrokes(strokeRnd, 1400, 50, 110, 10, 18, 0.45, 0.70),
  simStrokes(strokeRnd, 5000, 22, 48, 5, 9, 0.50, 0.80),
  simStrokes(strokeRnd, 12000, 9, 20, 2.5, 4.5, 0.55, 0.85),
];
log('prep ms ' + Math.round(performance.now() - T0) + ', collectors ' + NPTS + ', stars ' + NSTAR + ', strokes ' + SL.map(s => s.n).join('/'));

// ================================================================ WebGL
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) log('NO WEBGL2');
const extCBF = gl.getExtension('EXT_color_buffer_float');
const dri = gl.getExtension('WEBGL_debug_renderer_info');
log('renderer: ' + (dri ? gl.getParameter(dri.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) + ' | float targets: ' + !!extCBF);

function compile(type, src, name){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const info = gl.getShaderInfoLog(s); log('COMPILE ERROR ' + name + ':\n' + info);
    const lines = src.split('\n'); const re = /0:(\d+)/g; let m, seen = 0;
    while ((m = re.exec(info)) && seen < 4){ const ln = +m[1]; seen++; for (let i = Math.max(1, ln-2); i <= Math.min(lines.length, ln+1); i++) log('  ' + i + ': ' + lines[i-1]); }
  }
  return s;
}
function program(vs, fs, name){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs, name + '.vs'));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, name + '.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log('LINK ERROR ' + name + ': ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
  for (let i = 0; i < n; i++){ const inf = gl.getActiveUniform(p, i); u[inf.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, inf.name); }
  p.u = u; return p;
}
function setU(p, vals){
  gl.useProgram(p);
  for (const k in vals){
    const loc = p.u[k]; if (loc === undefined || loc === null) continue;
    const v = vals[k];
    if (typeof v === 'number') gl.uniform1f(loc, v);
    else if (v.i !== undefined) gl.uniform1i(loc, v.i);
    else if (v.ui !== undefined) gl.uniform1ui(loc, v.ui);
    else if (v.v4 !== undefined) gl.uniform4fv(loc, v.v4);
    else if (v.length === 2) gl.uniform2f(loc, v[0], v[1]);
    else if (v.length === 3) gl.uniform3f(loc, v[0], v[1], v[2]);
    else if (v.length === 4) gl.uniform4f(loc, v[0], v[1], v[2], v[3]);
  }
}
function bindTex(p, name, unit, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); if (p.u[name]) gl.uniform1i(p.u[name], unit); }
function target(w, h){
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  if (extCBF) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER); if (st !== gl.FRAMEBUFFER_COMPLETE) log('FB incomplete ' + st);
  return { tex, fb, w, h };
}
function tableTex(w, h, data){   // exact float lookup tables, read with texelFetch
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, w, h, 0, gl.RED, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const vaoEmpty = gl.createVertexArray();
function drawTo(tgt){ gl.bindFramebuffer(gl.FRAMEBUFFER, tgt ? tgt.fb : null); gl.viewport(0, 0, tgt ? tgt.w : W, tgt ? tgt.h : H); }
function fullscreen(p, tgt){ drawTo(tgt); gl.useProgram(p); gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3); }

// ---------------------------------------------------------------- GLSL
const HDR = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
const VS_FULL = HDR + 'void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }\n';
const NOISE = `
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float gn(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  float a = dot(h22(i)*2.0-1.0, f);
  float b = dot(h22(i+vec2(1.0,0.0))*2.0-1.0, f-vec2(1.0,0.0));
  float c = dot(h22(i+vec2(0.0,1.0))*2.0-1.0, f-vec2(0.0,1.0));
  float d = dot(h22(i+vec2(1.0,1.0))*2.0-1.0, f-vec2(1.0,1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p, int oct){
  float s = 0.0, a = 0.5;
  mat2 R = mat2(0.8, -0.6, 0.6, 0.8);
  for (int i = 0; i < 9; i++){ if (i >= oct) break; s += a*gn(p); p = R*p*2.03 + vec2(13.7, 7.3); a *= 0.5; }
  return s;
}
`;
// escaping light, as seen in the swarm plane (lights the collectors that sit in a shaft)
const RAYS_GLSL = `
uniform vec4 uRay[12]; uniform int uNR; uniform vec2 uPlane;   // ring plane: position angle, sin(elevation)
float planeRho(vec2 s){   // radius in the ring plane of a screen offset, assuming it lies in that plane
  vec2 a = vec2(cos(uPlane.x), sin(uPlane.x)), c = vec2(sin(uPlane.x), -cos(uPlane.x));
  return length(vec2(dot(s, a), dot(s, c)/uPlane.y));
}
float rayLight(vec2 s){
  float acc = 0.0;
  for (int k = 0; k < 12; k++){ if (k >= uNR) break;
    vec4 R = uRay[k]; vec2 d = vec2(cos(R.x), sin(R.x));
    float al = dot(s, d); if (al <= 0.0) continue;
    float t = al/R.y; if (t >= 1.0) continue;
    float pe = abs(s.x*d.y - s.y*d.x);
    float w = (R.z*pow(1.0 - t, 0.9) + 0.004)*1.6;
    float q = pe/w;
    acc += R.w*exp(-q*q)*pow(1.0 - t, 1.2)/(0.2 + al);
  }
  return acc;
}
`;

// ---- deep space, Alpha Cen B's glow, and the 11 shafts
const FS_BG = HDR + NOISE + RAYS_GLSL + `
uniform vec2 uC; uniform float uRs; uniform vec2 uA;
out vec4 o;
void main(){
  vec2 px = vec2(gl_FragCoord.x, 1080.0 - gl_FragCoord.y);
  vec2 s = (px - uC)/uRs; float r = length(s);
  vec3 col = vec3(0.0008, 0.0010, 0.0024)*(0.6 + 0.4*(1.0 - px.y/1080.0));
  // white core with a compact orange falloff
  col += vec3(1.00, 0.93, 0.84)*8.0*exp(-r*r/0.0036)
       + vec3(1.00, 0.55, 0.26)*1.30*exp(-r/0.11)
       + vec3(1.00, 0.34, 0.13)*0.16/(1.0 + pow(r/0.28, 2.0))
       + vec3(0.60, 0.14, 0.06)*0.012/(1.0 + pow(r/1.00, 2.0));
  // shafts: the swarm has swept its interior clean, so escaping light shows in the dust beyond it;
  // inside, only the roots near the core and the glinting collectors along each lane trace it
  float pr = planeRho(s);
  float dust = mix(0.035, 1.0, smoothstep(1.40, 2.00, pr))*(0.75 + 0.5*(0.5 + 0.5*fbm(px/160.0 + vec2(5.0, 2.0), 4)));
  vec3 sh = vec3(0.0);
  for (int k = 0; k < 12; k++){ if (k >= uNR) break;
    vec4 R = uRay[k]; vec2 d = vec2(cos(R.x), sin(R.x));
    float al = dot(s, d); if (al <= 0.0) continue;
    float t = al/R.y; if (t >= 1.0) continue;
    float pe = abs(s.x*d.y - s.y*d.x);
    float w = R.z*pow(1.0 - t, 0.85) + 0.002;
    float q = pe/w;
    float core = exp(-q*q);
    float skirt = exp(-q*q/16.0)*0.24;
    float fall = pow(1.0 - t, 1.15)/(0.55 + 0.45*al);
    float vis = max(dust, 1.6*exp(-al/0.10));
    float mott = 0.70 + 0.6*(0.5 + 0.5*gn(vec2(al*3.0 + float(k)*17.0, float(k)*3.7)));
    vec3 rc = mix(vec3(1.0, 0.86, 0.70), vec3(1.0, 0.52, 0.25), smoothstep(0.2, 2.2, al));
    sh += rc*R.w*(core + skirt)*fall*vis*mott;
  }
  col += sh*0.70;
  // Alpha Cen A: faint cool outer halo (its core comes later)
  float dA = length(px - uA);
  col += vec3(0.62, 0.72, 1.0)*0.006/(1.0 + pow(dA/150.0, 2.0));

// ---- collectors: generated from gl_VertexID, one crisp pixel each

uniform vec2 uC; uniform float uRs;
uniform vec3 uBa; uniform vec3 uBc; uniform vec3 uBn;
uniform float uR; uniform float uDR;
uniform int uRow; uniform uint uSeed; uniform int uSide;

uniform float uGain; uniform float uRStar; uniform int uMode; uniform float uKFar; uniform float uKNear;
uniform sampler2D uInvU; uniform sampler2D uInvL; uniform sampler2D uWidL;

  float halo = q5 > 0.75 ? 1.0 : 0.0;               // a quarter drift in a soft halo around the ringlets

// ---- the sim we just left: its golden-hour sky seen from outside (horizon at the rim)
const SIMGEO = `
uniform vec3 uBub;
void simGeo(vec2 px, out float dep, out float el, out float ph, out float dist){
  vec2 d = px - uBub.xy; dist = length(d);
  dep = uBub.z - dist;
  el = acos(clamp(dist/uBub.z, 0.0, 1.0));   // elevation above the sim's horizon (rad)

`;
const FS_SIM = HDR + NOISE + SIMGEO + `
uniform vec4 uPuff[100]; uniform int uNP;
out vec4 o;
float cloudSD(vec2 p, float k){   // signed distance to the union of all puffs, smooth-min blended over k px
  float d = 1e5;
  for (int i = 0; i < 100; i++){ if (i >= uNP) break;
    vec4 pf = uPuff[i];
    float di = length(p - pf.xy) - pf.z;
    float h = clamp(0.5 + 0.5*(di - d)/k, 0.0, 1.0);
    d = mix(di, d, h) - k*h*(1.0 - h);
  }
  return d;
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, 1080.0 - gl_FragCoord.y);

  float yN = clamp((px.y - 890.0)/190.0, 0.0, 1.0);

  sky = mix(sky, vec3(1.00, 0.74, 0.52)*0.50, smoothstep(0.45, 1.0, yN));

  vec3 col = sky;

  float d0 = cloudSD(px, 9.0);
  if (d0 < 2.0){
    float dS = cloudSD(px, 44.0);
    float gx = cloudSD(px + vec2(2.0, 0.0), 44.0) - dS, gy = cloudSD(px + vec2(0.0, 2.0), 44.0) - dS;
    vec2 g = normalize(vec2(gx, gy) + 1e-6);
    float t = clamp(-min(d0, dS)/40.0, 0.0, 1.0);
    vec3 nrm = normalize(vec3(g*sqrt(max(1.0 - t*t, 0.0)), t + 0.10));
    vec3 L = normalize(vec3(0.62, -0.50, 0.60));
    float lam = dot(nrm, L) + 0.06*gn(px/26.0);
    vec3 c = mix(vec3(0.72, 0.62, 0.90)*0.30, vec3(0.98, 0.70, 0.72)*0.42, smoothstep(-0.30, 0.30, lam));
    c = mix(c, vec3(1.00, 0.86, 0.72)*0.60, smoothstep(0.35, 0.75, lam));

`;
const FS_OVER = HDR + 'uniform sampler2D uSrc; out vec4 o; void main(){ vec4 c = texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0); o = vec4(c.rgb*c.a, c.a); }\n';

uniform sampler2D uSim; uniform vec3 uBub;

float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

const FS_STROKE = HDR + `
uniform vec3 uBub;
in vec2 vUV; in vec3 vCol; in float vSeed; in float vA;
out vec4 o;
float h1(float x){ return fract(sin(x*127.1 + 311.7)*43758.5453); }

// ---- the sim's edge: a crisp luminous rim with thin-film colour, and the environment wireframe

uniform float uGrid;
out vec4 o;
void main(){

  vec3 irid = (0.5 + 0.5*cos(6.28318*(th*1.2 + vec3(0.02, 0.36, 0.68))))*vec3(1.0, 0.86, 1.0);
  float warm = exp(-pow((px.x - 1150.0)/600.0, 2.0));

// ---- bloom
const FS_DOWN = HDR + `
uniform sampler2D uSrc; uniform vec2 uTS; uniform vec2 uSrcTexel; uniform float uPre; out vec4 o;
void main(){

uniform sampler2D uHDR; uniform sampler2D uBloom; uniform float uBloomStr; uniform float uExp; uniform int uRaw; uniform vec3 uBub;

float acesS(float x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
vec3 tonemap(vec3 x){

    gl.useProgram(pPts); gl.bindVertexArray(vaoEmpty);
    bindTex(pPts, 'uInvU', 0, texU); bindTex(pPts, 'uInvL', 1, texL); bindTex(pPts, 'uWidL', 2, texW);
    const common = Object.assign({ uC: P.C, uRs: RS, uGain: P.gain, uRStar: P.rStar, uKFar: P.kFar, uKNear: P.kNear, uOcc: P.occ, uSide: { i: side } }, rayU);
    if (side === 2){
      setU(pPts, Object.assign({}, common, { uMode: { i: 2 }, uBG: 1, uWarp: [0, 0], uRow: { i: 0 }, uSeed: { ui: 0x51ED27 }, uBa: [1, 0, 0], uBc: [0, 1, 0], uBn: [0, 0, 1], uR: 1, uDR: 0 }));
      gl.drawArrays(gl.POINTS, 0, P.nDrift);
      return;
    }
    BANDS.forEach((b, bi) => {
      setU(pPts, Object.assign({}, common, { uMode: { i: 0 }, uBG: b.g, uWarp: [b.w, b.seed % 628 / 100], uBa: b.a, uBc: b.c, uBn: b.nrm, uR: b.r, uDR: b.dr, uRow: { i: bi }, uSeed: { ui: b.seed } }));
      gl.drawArrays(gl.POINTS, 0, b.n);
    });
  };
  if (VIEW !== 'noswarm'){
    drawTo(tMain);
    gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
    drawBands(0);
    gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
    setU(pDisk, { uC: P.C, uRs: RS, uRStar: P.rStar });
    gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
    drawBands(1);
    gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
    drawBands(2);
    gl.disable(gl.BLEND);
  }

  // 6. Alpha Cen A
  drawTo(tMain);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
  setU(pAcen, { uA: P.A });
  gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);

  // 7. the sim: underpainting, strokes, rim
  if (VIEW !== 'nobub'){
    setU(pSim, { uBub: P.bub, uPuff: { v4: puffArr }, uNP: { i: NPUFF } });
    fullscreen(pSim, tSim);
    gl.bindTexture(gl.TEXTURE_2D, tSim.tex);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    drawTo(tMain);
    gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
    gl.useProgram(pOver); bindTex(pOver, 'uSrc', 0, tSim.tex);
    gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (VIEW !== 'nostroke'){
      gl.useProgram(pStroke); bindTex(pStroke, 'uSim', 0, tSim.tex); setU(pStroke, { uBub: P.bub });
      const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      for (let li = 0; li < SL.length; li++){
        gl.bufferData(gl.ARRAY_BUFFER, SL[li].data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0); gl.vertexAttribDivisor(0, 1);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 24, 8); gl.vertexAttribDivisor(1, 1);
        gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 24, 16); gl.vertexAttribDivisor(2, 1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, SL[li].n);
      }
    }
    gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
    setU(pRim, { uBub: P.bub, uGrid: P.grid });
    gl.bindVertexArray(vaoEmpty); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disable(gl.BLEND);
  }

  // 8. bloom chain
  const sizes = [[960, 540], [480, 270], [240, 135], [120, 68], [60, 34], [30, 17]];
  const down = sizes.map(s => target(s[0], s[1]));
  const up = sizes.slice(0, 5).map(s => target(s[0], s[1]));
  let src = tMain;
  for (let i = 0; i < down.length; i++){
    gl.useProgram(pDown); bindTex(pDown, 'uSrc', 0, src.tex);
    setU(pDown, { uTS: [down[i].w, down[i].h], uSrcTexel: [1/src.w, 1/src.h], uPre: i === 0 ? 1 : 0 });
    fullscreen(pDown, down[i]); src = down[i];
  }
  let low = down[5];
  for (let i = 4; i >= 0; i--){
    gl.useProgram(pUp); bindTex(pUp, 'uLow', 0, low.tex); bindTex(pUp, 'uCur', 1, down[i].tex);
    setU(pUp, { uTS: [up[i].w, up[i].h], uLowTexel: [1/low.w, 1/low.h] });
    fullscreen(pUp, up[i]); low = up[i];
  }

  // 9. final
  gl.useProgram(pFinal);
  bindTex(pFinal, 'uHDR', 0, tMain.tex); bindTex(pFinal, 'uBloom', 1, up[0].tex);
  setU(pFinal, { uBloomStr: P.bloom, uExp: P.exposure, uRaw: { i: VIEW === 'raw' ? 1 : 0 }, uBub: P.bub });
  fullscreen(pFinal, null);
  const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);

  // 10. diegetic HUD: a new episode, in the environment built for us
  if (VIEW !== 'nohud'){
    const hud = document.createElement('canvas'); hud.width = W; hud.height = H;
    hud.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none';
    document.body.appendChild(hud);
    const hx = hud.getContext('2d');
    hx.font = '14px Consolas, "Cascadia Mono", "Courier New", monospace';
    if ('letterSpacing' in hx) hx.letterSpacing = '2px';
    hx.fillStyle = 'rgba(245, 240, 232, 0.46)';
    hx.fillText('EP    000001', 58, 928);
    hx.fillText('STEP  000000', 58, 950);
  }
  log('gl error: ' + gl.getError() + ' | total ms ' + Math.round(performance.now() - T0));
} catch (e) { log('EXC ' + e.message + '\n' + e.stack); }
</script>
