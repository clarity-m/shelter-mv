<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Shelter MV - style frame 14 - pixel swarm</title>
<style>html,body{margin:0;padding:0;background:#0a0a12;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
// ============================================================================
// Shelter MV, style frame 14: the swarm as a lantern, in the outside world's
// pixel style (the 09 night lab). Authored at 480x270 into a palette-index
// buffer (32 colours), lit through palette ramps with 2x2 Bayer dither only
// where a ramp steps, then blown up 4x nearest-neighbour.
// Three nested shells of collector plates hold Alpha Centauri B. Plates sit on
// sunflower (Fibonacci) lattices; every seam and corner pinhole shows the
// lit haze inside. The camera sits on the axis where the shells were built to
// line up: eleven lanes are open through all three, and the light that
// escapes along them fans into the dust as the spark.
// Deterministic: one seeded PRNG plus hashed noise, no filtering.
// ============================================================================
const T0 = performance.now();
const W = 480, H = 270, SC = 4;
const Q = new URLSearchParams(location.search);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260927);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = 2 * Math.PI;

// ---------------------------------------------------------------- palette ---
const HEX = [
  // C0..C12  night ramp, shared with the 09 lab
  '#0a0a12', '#12121c', '#1a1a28', '#232335', '#2d2e43', '#3a3c54', '#4a4d67',
  '#5d617b', '#747a92', '#8f95aa', '#adb3c2', '#ccd0da', '#e9eaee',
  // E0 faintest ember, W0..W8 Claude's light (W5 is exactly #D97757), W9 white heat
  '#1a1117', '#28191f', '#3f2229', '#5e2e31', '#86403c', '#b0584a', '#d97757', '#eb9a72',
  '#f6c296', '#fde8cc', '#fffaf1',
  // P0..P5  the held world: the only pastels in the frame
  '#9c8cc6', '#e3aac6', '#fcd2ab', '#fff4d8', '#76a193', '#4d7470',
  // A0, A1  Alpha Centauri A: the one pale cool accent
  '#8ea3cc', '#d6e2f7',
];
const C = Array.from({ length: 13 }, (_, i) => i);
const E0 = 13, Wc = Array.from({ length: 10 }, (_, i) => 14 + i);       // Wc[9] = white heat
const P = Array.from({ length: 6 }, (_, i) => 24 + i);
const A0 = 30, A1 = 31;
// warm light as one ramp, indexed by level: 0 = space ... 7 = #D97757 ... 11 = white heat
const WR = [C[0], E0, Wc[0], Wc[1], Wc[2], Wc[3], Wc[4], Wc[5], Wc[6], Wc[7], Wc[8], Wc[9]];
const RGB = HEX.map(h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)));

// ---------------------------------------------------------------- buffers ---
const IB = new Uint8Array(W * H);          // palette index per native pixel
function set(x, y, c) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  IB[y * W + x] = c;
}
const get = (x, y) => IB[y * W + x];

// ------------------------------------------------------------- dithering ---
// Ordered dither only in narrow transition bands: a continuous level is
// contrast-stretched around each step, so most pixels land on solid ramp
// colours and the 2x2 Bayer patterns appear only where a ramp changes.
const BAY2 = [0.125, 0.625, 0.875, 0.375];
const thr2 = (x, y) => BAY2[((y & 1) << 1) | (x & 1)];
function qd(v, x, y, sharp) {
  sharp = sharp || 2;
  const b = Math.floor(v);
  const f = (v - b - 0.5) * sharp + 0.5;
  return b + (f > thr2(x, y) ? 1 : 0);
}

// ----------------------------------------------------------------- noise ---
function hashN(a, b, c, d) {
  let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041) + Math.imul(d | 0, 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hashN(ix, iy, s, 0), b = hashN(ix + 1, iy, s, 0), c = hashN(ix, iy + 1, s, 0), d = hashN(ix + 1, iy + 1, s, 0);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let o = 0; o < oct; o++) { v += a * vnoise(x * f, y * f, s + o * 17); n += a; f *= 2; a *= 0.5; }
  return v / n;
}
const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };

// ======================================================== scene constants ===
const CX = 290, CY = 137;                  // Alpha Centauri B, the swarm centre
const RS = 7.2;                            // the star's disc
// the eleven lanes: [angle deg (screen, y down), length px, width px, strength]
const LANES = [
  [-86, 150, 1.9, 0.90], [-52, 108, 1.3, 0.65], [-21, 176, 2.3, 1.00], [10, 122, 1.5, 0.75],
  [40, 96, 1.1, 0.55], [94, 140, 2.0, 0.90], [123, 110, 1.3, 0.65], [152, 185, 2.4, 1.00],
  [184, 100, 1.2, 0.60], [215, 146, 1.9, 0.85], [245, 90, 1.0, 0.50],
].map(([a, L, w, I], k) => ({ c: Math.cos(a * Math.PI / 180), s: Math.sin(a * Math.PI / 180), L, w, I, k }));
// three nested shells, inner to outer. Plates sit on a Fibonacci (sunflower)
// lattice whose pole faces the camera. Each shell has its own plate count,
// seam width, pinholes where plates meet, and a few missing plates.
//   R radius, N plates on the whole sphere, seam half-width px, pin px,
//   miss fraction, oc oculus radius px, rot spiral phase, h haze per px inside it
const SH = [
  { R: 24, N: 230, seam: 0.75, pin: 1.35, miss: 0.14, oc: RS + 2.2, rot: 0.9, h: 0.070 },
  { R: 34, N: 300, seam: 0.95, pin: 1.50, miss: 0.10, oc: RS + 3.4, rot: 2.3, h: 0.045 },
  { R: 45, N: 250, seam: 0.50, pin: 1.20, miss: 0.07, oc: RS + 4.6, rot: 4.1, h: 0.030 },
];
const NS = SH.length, R_OUT = SH[NS - 1].R;
const BACK = [6.6, 5.4, 4.4];              // lit inside face of each back half
// the held world: a small bubble inside the swarm, seen through one porthole
const BUB = { x: 7.0, y: 16.6, r: 6.5 };
const PORT = BUB.r + 1.8;
// Alpha Centauri A, and home
const STAR_A = [66, 44];
const SUN = [54, 226];
const LA = norm3([-0.78, -0.52, 0.35]);    // light direction toward A

// ================================================================ shells ===
for (const S of SH) {
  const GA = Math.PI * (3 - Math.sqrt(5));
  S.n = Math.ceil(S.N * 0.64);             // only the front-facing part is ever queried
  S.pts = new Float64Array(S.n * 3);
  for (let i = 0; i < S.n; i++) {
    const z = 1 - (2 * i + 1) / S.N, r = Math.sqrt(1 - z * z), ph = i * GA + S.rot;
    S.pts[i * 3] = r * Math.cos(ph); S.pts[i * 3 + 1] = r * Math.sin(ph); S.pts[i * 3 + 2] = z;
  }
}
// Front-half plate under image offset (dx, dy) on shell k: a plate id, or -1
// for a gap. Seams are measured in image pixels (so they stay 1 px lines) but
// capped on the shell, so they close up where the shell turns edge-on.
function frontPlate(k, dx, dy, rho) {
  const S = SH[k];
  if (rho < S.oc) return -1;
  const z = Math.sqrt(S.R * S.R - rho * rho);
  const qx = dx / S.R, qy = dy / S.R, qz = z / S.R;
  const Pt = S.pts; let b1 = -3, b2 = -3, b3 = -3, i1 = 0, i2 = 0, i3 = 0;
  for (let i = 0, j = 0; i < S.n; i++, j += 3) {
    const d = Pt[j] * qx + Pt[j + 1] * qy + Pt[j + 2] * qz;
    if (d <= b3) continue;
    if (d > b1) { b3 = b2; i3 = i2; b2 = b1; i2 = i1; b1 = d; i1 = i; }
    else if (d > b2) { b3 = b2; i3 = i2; b2 = d; i2 = i; }
    else { b3 = d; i3 = i; }
  }
  const zz = Math.max(z, 0.35);
  const sep = (ia, ib) => {                // image-px and shell-px distance to the bisector of plates ia, ib
    const nx = Pt[ia * 3] - Pt[ib * 3], ny = Pt[ia * 3 + 1] - Pt[ib * 3 + 1], nz = Pt[ia * 3 + 2] - Pt[ib * 3 + 2];
    const f = qx * nx + qy * ny + qz * nz;
    const gx = (nx - nz * dx / zz) / S.R, gy = (ny - nz * dy / zz) / S.R;
    return [f / Math.hypot(gx, gy), f / Math.hypot(nx, ny, nz) * S.R];
  };
  const [d12, s12] = sep(i1, i2), [d13] = sep(i1, i3);
  if (d12 < S.seam && s12 < S.seam * 2.4) return -1;             // seam
  if (d12 < S.pin && d13 < S.pin && s12 < S.pin * 2.4) return -1; // pinhole where plates meet
  if (hashN(k, i1, 7, 3) < S.miss) return -1;                    // missing plate
  return i1;
}
function laneAt(dx, dy) {
  for (const l of LANES) {
    const along = dx * l.c + dy * l.s;
    if (along <= 0) continue;
    if (Math.abs(-dx * l.s + dy * l.c) < l.w * 0.5 + 0.35) return l.k;
  }
  return -1;
}

// ================================================================= space ===
// near-black, a faint Milky Way band running up from home (lower left)
const MW_A = -35 * Math.PI / 180, MW_C = Math.cos(MW_A), MW_S = Math.sin(MW_A);
function mwAt(x, y) {
  const rx = x - SUN[0], ry = y - SUN[1];
  const along = rx * MW_C + ry * MW_S, across = -rx * MW_S + ry * MW_C;
  const wob = 9 * (fbm(along / 70, 0.5, 5, 2) - 0.5);
  const d = (across - wob) / 24;
  let v = Math.exp(-d * d * 1.7) * (0.3 + 1.0 * fbm(x / 20, y / 20, 9, 3));
  v -= 0.55 * Math.exp(-Math.pow((across - wob + 5) / 5.5, 2)) * fbm(x / 11, y / 11, 21, 2);   // dark lane
  return v;
}
const MWV = new Float32Array(W * H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const v = mwAt(x, y); MWV[y * W + x] = v;
  set(x, y, C[clamp(qd(1.75 * v, x, y, 2), 0, 2)]);
}
// stars at three brightness levels, denser in the band
(function stars() {
  for (let k = 0; k < 2600; k++) {
    const x = (rnd() * W) | 0, y = (rnd() * H) | 0, m = MWV[y * W + x];
    if (rnd() > 0.16 + 0.8 * clamp(m, 0, 1)) continue;
    const b = rnd();
    if (b < 0.74) set(x, y, C[3 + ((rnd() * 2) | 0)]);
    else if (b < 0.94) set(x, y, C[6 + ((rnd() * 2) | 0)]);
    else if (b < 0.988) set(x, y, C[9 + ((rnd() * 2) | 0)]);
    else { set(x, y, C[11]); for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (get(x + ox, y + oy) < C[4]) set(x + ox, y + oy, C[4]); }
  }
})();
// Alpha Centauri A: bright, cool, far from the swarm
(function starA() {
  const [ax, ay] = STAR_A;
  for (let y = ay - 18; y <= ay + 18; y++) for (let x = ax - 18; x <= ax + 18; x++) {
    const d = Math.hypot(x - ax, y - ay);
    const v = 2.6 * Math.pow(clamp(1 - d / 17, 0, 1), 1.7);
    const k = qd(v, x, y, 2);
    if (k >= 1 && get(x, y) < C[k + 1]) set(x, y, C[k + 1]);
  }
  const arm = [A1, A0, C[9], C[7], C[6], C[5], C[4]];
  for (let s = 1; s < arm.length; s++) {
    set(ax + s, ay, arm[s]); set(ax - s, ay, arm[s]);
    if (s < arm.length - 1) { set(ax, ay + s, arm[s + 1]); set(ax, ay - s, arm[s + 1]); }
  }
  for (const [ox, oy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { set(ax + ox, ay + oy, C[7]); set(ax + 2 * ox, ay + 2 * oy, C[4]); }
  set(ax, ay, C[12]); set(ax + 1, ay, A1); set(ax - 1, ay, A1); set(ax, ay + 1, A1); set(ax, ay - 1, A1);
})();
// home: the Sun, a faint point at the end of Cassiopeia's W, as it looks from Alpha Centauri
(function home() {
  const [sx, sy] = SUN;
  [[8, -6], [14, -1], [21, -7], [27, -2], [34, -9]].forEach(([ox, oy], k) => set(sx + ox, sy + oy, C[k === 2 ? 8 : 7]));
  for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) set(sx + ox, sy + oy, C[3]);
  set(sx, sy, C[10]);
})();

// ================================================= light in the dust ======
// Outside the outer shell: a glow hugging the silhouette (light leaking through
// all the small gaps) and, where the gaps line up, eleven shafts. Each shaft is
// hot and narrow at its lane, then fans out soft into the dust and fades.
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const dx = x + 0.5 - CX, dy = y + 0.5 - CY, rho = Math.hypot(dx, dy);
  if (rho < R_OUT) continue;
  const e = rho - R_OUT;
  const halo = 2.9 * Math.exp(-e / 2.5) + 1.3 * Math.exp(-e / 15);
  let core = 0, fan = 0;
  for (const l of LANES) {
    const s = dx * l.c + dy * l.s;
    if (s <= 0) continue;
    const t = Math.abs(-dx * l.s + dy * l.c);
    const u = (s - R_OUT) / (l.L - R_OUT);
    if (u >= 1) continue;
    const uu = Math.max(u, 0);
    const wc = (0.55 + 0.45 * l.w) * Math.pow(1 - uu, 0.6);
    core = Math.max(core, 7.6 * l.I * Math.exp(-uu / 0.2) * Math.exp(-0.5 * (t / wc) * (t / wc)));
    const sig = 1.0 + l.w * (0.9 + 2.6 * uu);
    const dust = 0.7 + 0.6 * vnoise(s / 13, t / 2.2 + 37 * l.k, 3);
    fan = Math.max(fan, 4.2 * l.I * Math.pow(1 - uu, 1.15) * Math.exp(-0.5 * (t / sig) * (t / sig)) * dust);
  }
  const v = Math.max(Math.max(halo, fan) + 0.3 * Math.min(halo, fan), core);
  const k = qd(v, x, y, 2);
  if (k >= 1) {
    const cur = get(x, y);
    if (k >= 3 || cur <= C[2]) set(x, y, WR[clamp(k, 1, 10)]);
  }
}

// =============================================================== lantern ===
// Cast straight into the swarm: the front halves of the shells from the
// outside in (collecting the lit haze between them), then the held world, the
// star, and the lit inside face of whichever back half the sight line reaches.
const K_PLATE = 1, K_GLOW = 2, K_STAR = 3, K_BUB = 4;
const KIND = new Uint8Array(W * H), LEV = new Float32Array(W * H);
const SHI = new Int8Array(W * H).fill(-1), PLI = new Int32Array(W * H).fill(-1);
const x0 = Math.floor(CX - R_OUT - 1), x1 = Math.ceil(CX + R_OUT + 1), y0 = Math.floor(CY - R_OUT - 1), y1 = Math.ceil(CY + R_OUT + 1);
for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
  const dx = x + 0.5 - CX, dy = y + 0.5 - CY, r2 = dx * dx + dy * dy;
  if (r2 >= R_OUT * R_OUT) continue;
  const i = y * W + x, rho = Math.sqrt(r2);
  const ln = laneAt(dx, dy);
  const inPort = (dx - BUB.x) ** 2 + (dy - BUB.y) ** 2 < PORT * PORT;
  let hit = false, haze = 0;
  for (let k = NS - 1; k >= 0; k--) {
    const S = SH[k]; if (rho >= S.R) continue;
    const id = (ln >= 0 || inPort) ? -1 : frontPlate(k, dx, dy, rho);
    if (id >= 0) {
      KIND[i] = K_PLATE; SHI[i] = k; PLI[i] = k * 1000 + id; hit = true;
      if (k === NS - 1) {                  // outer plates: flat-shaded by A's cool light
        const j = id * 3, Pt = S.pts;
        const lam = Math.max(0, Pt[j] * LA[0] + Pt[j + 1] * LA[1] + Pt[j + 2] * LA[2]);
        LEV[i] = 1.2 + 2.8 * Math.pow(lam, 1.5) + 0.6 * (hashN(k, id, 5, 1) - 0.5);
      } else {                             // inner plates: warm bounce, plus the haze in front
        LEV[i] = (k === 0 ? 4.0 : 3.0) + 0.7 * (hashN(k, id, 5, 1) - 0.5) + haze;
      }
      break;
    }
    // through shell k's front half: haze until the next shell in, or the mid-plane
    const zk = Math.sqrt(S.R * S.R - r2);
    const zn = (k > 0 && rho < SH[k - 1].R) ? Math.sqrt(SH[k - 1].R ** 2 - r2) : 0;
    haze += S.h * (zk - zn);
  }
  if (hit) continue;
  const bx = dx - BUB.x, by = dy - BUB.y;
  if (bx * bx + by * by < BUB.r * BUB.r) { KIND[i] = K_BUB; continue; }
  if (r2 < RS * RS) { KIND[i] = K_STAR; LEV[i] = 10.1 + 1.4 * Math.sqrt(1 - r2 / (RS * RS)); continue; }
  let kb = 0; while (kb < NS - 1 && rho >= SH[kb].R) kb++;
  haze += SH[kb].h * Math.sqrt(SH[kb].R ** 2 - r2);
  let lev = BACK[kb] + haze;
  if (ln >= 0) lev += 0.6;
  KIND[i] = K_GLOW; SHI[i] = kb; LEV[i] = lev;
}
// palette mapping
for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
  const i = y * W + x, k = KIND[i];
  if (!k || k === K_BUB) continue;
  if (k === K_PLATE && SHI[i] === NS - 1) set(x, y, C[clamp(Math.round(LEV[i]), 1, 5)]);
  else if (k === K_PLATE) set(x, y, WR[clamp(Math.round(LEV[i]), 1, 11)]);
  else set(x, y, WR[clamp(qd(LEV[i], x, y, 3), 1, 11)]);
}
// warm lips: a plate pixel whose neighbour toward the star is strong light
(function rims() {
  const warmOf = i => (KIND[i] === K_PLATE && SHI[i] === NS - 1) ? 0 : (KIND[i] === K_BUB ? 8 : LEV[i]);
  const out = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x;
    if (KIND[i] !== K_PLATE) continue;
    const dx = x + 0.5 - CX, dy = y + 0.5 - CY, d = Math.hypot(dx, dy) || 1;
    const qx = Math.round(x - dx / d), qy = Math.round(y - dy / d), j = qy * W + qx;
    if (KIND[j] === K_PLATE && SHI[j] >= SHI[i]) continue;
    const ln = warmOf(j), own = warmOf(i);
    if (ln >= 6 && ln > own + 2) out.push([x, y, Math.min(ln - 1.6, 9)]);
  }
  for (const [x, y, v] of out) set(x, y, WR[clamp(Math.round(v), 1, 11)]);
})();
// cool rim on the outer shell's limb where it turns toward A
(function rimA() {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x;
    if (KIND[i] !== K_PLATE || SHI[i] !== NS - 1) continue;
    const dx = x + 0.5 - CX, dy = y + 0.5 - CY, rho = Math.hypot(dx, dy);
    if (rho < R_OUT - 1.25) continue;
    const lam = (dx / rho) * LA[0] + (dy / rho) * LA[1];
    if (lam > 0.55) set(x, y, lam > 0.85 ? A0 : C[7]);
    else if (lam > 0.2) set(x, y, C[5]);
  }
})();

// ======================================================== the held world ===
// a soap-film bubble with a pastel sunset and a hill in it, hand-placed
const BUBBLE = [
  '....abbba....',
  '..abLLLLLba..',
  '.aLLLLLLLLLb.',
  '.bKKKKKKKKKL.',
  'aKKKKKKKKKKKL',
  'bEEEEEEEESSEL',
  'bEEEEEEESSSEL',
  'bGGGEEEEESSEL',
  'aGGGGGGEEEEEL',
  '.GGGGGGGGGGD.',
  '.aDGGGGGGGDD.',
  '..aDDDDDDDD..',
  '....LDDDL....',
];
const BUB_KEY = { a: Wc[8], b: P[3], L: P[0], K: P[1], E: P[2], S: P[3], G: P[4], D: P[5] };
(function bubble() {
  const bx0 = Math.round(CX + BUB.x - BUBBLE[0].length / 2), by0 = Math.round(CY + BUB.y - BUBBLE.length / 2);
  for (let r = 0; r < BUBBLE.length; r++) for (let c = 0; c < BUBBLE[r].length; c++) {
    const v = BUB_KEY[BUBBLE[r][c]];
    if (v !== undefined) set(bx0 + c, by0 + r, v);
  }
})();

// ================================================================ output ===
(function blit() {
  const cv = document.getElementById('out');
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W * SC, H * SC);
  const d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const [r, g, b] = RGB[IB[y * W + x]];
    for (let j = 0; j < SC; j++) {
      let o = ((y * SC + j) * W * SC + x * SC) * 4;
      for (let i = 0; i < SC; i++) { d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255; o += 4; }
    }
  }
  ctx.putImageData(img, 0, 0);
  const ms = (performance.now() - T0).toFixed(1);
  document.title = 'render ' + ms + ' ms';
  console.log('render ms', ms);
})();
</script>
</body></html>
